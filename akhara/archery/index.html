<!-- A real page at a real path, so the archery link can be shared.
     The nav has linked /akhara/archery since the page was built, but the site
     is one file with client-side routes, so that URL only ever existed as a
     pushState address - every shared link, every "open in new tab" and every
     refresh on that panel returned a 404. This page is what the URL now
     resolves to: it carries the share card, then hands over to the site with
     ?vida, which opens the panel.

     Modelled on saaj/dilruba/index.html. The share image is the site card
     rather than one of its own - there is no archery photograph good enough
     to put on a link preview yet, and the site card is honest.

     og:image and og:url are absolute: a crawler has no page to resolve a
     relative path against. -->
<link rel="canonical" href="https://www.shaheedibunga.com/akhara/archery/">
