<!-- A real page at a real path, so the santhiya link can be shared. The site
     is one file with client-side routes, so /santhiya only ever existed as a
     pushState address - every shared link, every "open in new tab" and every
     refresh on that panel would return a 404. This page is what the URL
     resolves to: it carries the share card, then hands over to the site with
     ?vid, which opens the panel.

     Modelled on saaj/dilruba/index.html. The card is a render of the panel's
     own hero - the pothi open on a rumala over a rehal - rather than a
     photograph: it is the page's own image, and it puts no child's face on a
     link preview.

     og:image and og:url are absolute: a crawler has no page to resolve a
     relative path against. -->
<link rel="canonical" href="https://www.shaheedibunga.com/santhiya/">

<meta property="og:type" content="website">
