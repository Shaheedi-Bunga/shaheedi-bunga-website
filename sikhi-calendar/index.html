 Zulfiqar Ali Kalhoro, public domain, via Wikimedia Commons","alt":"Mural of Sri Guru Gobind Singh Ji with the Panj Pyare, each named in Gurmukhi above them."},{"file":"guru-gobind-singh-ji-amrit-to-panj-pyare--c1870--unknown.jpg","credit":"Unknown artist, c. 1870, public domain, via Wikimedia Commons","alt":"Sri Guru Gobind Singh Ji giving amrit to the Panj Pyare."},{"file":"guru-gobind-singh-ji-preparing-amrit-lithograph--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (26060i), coloured lithograph · public domain","alt":"Coloured lithograph: Sri Guru Gobind Singh Ji preparing amrit for the Panj Pyare at the birth of the Khalsa."}]},"avtar-purab-bhai-dharam-singh-ji":{"about":{"pa":"ਭਾਈ ਧਰਮ ਸਿੰਘ ਜੀ ਦਾ ਜਨਮ ੧੩ ਵਿਸਾਖ, ਸੰਮਤ ੧੭੨੭ ਬਿਕ੍ਰਮੀ ਨੂੰ ਪਿਤਾ ਪਰਮ ਸੁਖ ਜੀ ਅਤੇ ਮਾਤਾ ਅਨੰਤੀ ਜੀ ਦੇ ਘਰ ਹੋਇਆ; ਉਹ ਦਿੱਲੀ ਦੇ ਵਸਨੀਕ ਸਨ। ੨੫ ਸਾਲ ਦੀ ਉਮਰ ਵਿੱਚ ਦਸਵੀਂ ਪਾਤਿਸ਼ਾਹੀ ਜੀ ਦੀ ਸ਼ਰਨ ਆਏ ਅਤੇ ਅਬਚਲ ਨਗਰ ਸ੍ਰੀ ਹਜ਼ੂਰ ਸਾਹਿਬ ਵਿਖੇ ਜੋਤੀ ਜੋਤਿ ਸਮਾਏ।","en":"Bhai Dharam Singh Ji was born on 13 Vaisakh, 1727 Bikrami, to Param Sukh Ji and Mata Ananti Ji, of Delhi. They came into the sharan of the Tenth Patshahi at the age of 25, and merged in the Light at Abchal Nagar Sri Hazur Sahib."},"pankti":{"gurmukhi":"ਤਨੁ ਮਨੁ ਧਨੁ ਸਭੁ ਸਉਪਿ ਗੁਰ ਕਉ ਹੁਕਮਿ ਮੰਨਿਐ ਪਾਈਐ ॥","ref":"Ang 918 · Raag Ramkali · Anand Sahib · Sri Guru Amar Das Ji"},"darshan":{"label":"ਜਨਮ","text":"੧੭੨੭ ਬਿ: ਵਿਸਾਖ ੧੩","page":"੨੩","source":"Gurbani Paath Darshan p.੨੩"},"images":[{"file":"takht-sri-kesgarh-sahib--2022--historiansimar.jpg","credit":"Historiansimar, CC BY-SA 4.0, via Wikimedia Commons","alt":"Takht Sri Kesgarh Sahib, Sri Anandpur Sahib."},{"file":"guru-gobind-singh-ji-with-panj-pyare-mural-kot-fateh-khan--19th-century--unknown.jpg","credit":"Samadhi mural, Kot Fateh Khan, 19th century; photo Zulfiqar Ali Kalhoro, public domain, via Wikimedia Commons","alt":"Mural of Sri Guru Gobind Singh Ji with the Panj Pyare, each named in Gurmukhi above them."},{"file":"guru-gobind-singh-ji-amrit-to-panj-pyare--c1870--unknown.jpg","credit":"Unknown artist, c. 1870, public domain, via Wikimedia Commons","alt":"Sri Guru Gobind Singh Ji giving amrit to the Panj Pyare."},{"file":"guru-gobind-singh-ji-preparing-amrit-lithograph--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (26060i), coloured lithograph · public domain","alt":"Coloured lithograph: Sri Guru Gobind Singh Ji preparing amrit for the Panj Pyare at the birth of the Khalsa."}]},"avtar-purab-bhai-himmat-singh-ji":{"about":{"pa":"ਭਾਈ ਹਿੰਮਤ ਸਿੰਘ ਜੀ ਦਾ ਜਨਮ ੧੫ ਜੇਠ, ਸੰਮਤ ੧੭੨੧ ਬਿਕ੍ਰਮੀ ਨੂੰ ਬਾਬਾ ਬਕਾਲਾ ਵਿਖੇ ਪਿਤਾ ਮਾਲ ਦੇਉ ਜੀ ਅਤੇ ਮਾਤਾ ਲਾਲ ਦੇਈ ਜੀ ਦੇ ਘਰ ਹੋਇਆ, ਜੋ ਜਗਨ ਨਾਥ ਦੇ ਵਾਸੀ ਸਨ ਅਤੇ ਨੌਵੀਂ ਪਾਤਿਸ਼ਾਹੀ ਜੀ ਦੀ ਸ਼ਰਨ ਵਿੱਚ ਰਹਿੰਦੇ ਸਨ। ਸੰਮਤ ੧੭੬੧ ਵਿੱਚ ਉਹ ਵੱਡੇ ਸਾਹਿਬਜ਼ਾਦਿਆਂ ਨਾਲ ਸ੍ਰੀ ਚਮਕੌਰ ਸਾਹਿਬ ਸ਼ਹੀਦ ਹੋਏ।","en":"Bhai Himmat Singh Ji was born at Baba Bakala on 15 Jeth, 1721 Bikrami, to Mal Deu Ji and Mata Lal Dei Ji, a family from Jagannath who lived in the sharan of the Ninth Patshahi. In 1761 Bikrami they were martyred at Sri Chamkaur Sahib with the Vadde Sahibzade."},"pankti":{"gurmukhi":"ਜੋ ਸਿਰੁ ਸਾਂਈ ਨਾ ਨਿਵੈ ਸੋ ਸਿਰੁ ਦੀਜੈ ਡਾਰਿ ॥","ref":"Ang 89 · Sri Raag ki Vaar · Sri Guru Angad Dev Ji"},"darshan":{"label":"ਜਨਮ","text":"੧੭੨੧ ਬਿਕ੍ਰਮੀ, ਜੇਠ ੧੫","page":"੨੩","source":"Gurbani Paath Darshan p.੨੩"},"images":[{"file":"gurdwara-garhi-sahib-chamkaur--before-1930--mahan-kosh.jpg","credit":"Mahan Kosh, Bhai Kahn Singh Nabha (d. 1938); printed by F.W. & Co., Lahore · before 1930","alt":"Gurdwara Tilak Asthan (Garhi Sahib), Sri Chamkaur Sahib, the site of the kachi garhi; plate from the first edition of the Mahan Kosh. Cropped to the photograph inside the page frame."},{"file":"guru-gobind-singh-ji-with-panj-pyare-mural-kot-fateh-khan--19th-century--unknown.jpg","credit":"Samadhi mural, Kot Fateh Khan, 19th century; photo Zulfiqar Ali Kalhoro, public domain, via Wikimedia Commons","alt":"Mural of Sri Guru Gobind Singh Ji with the Panj Pyare, each named in Gurmukhi above them."},{"file":"guru-gobind-singh-ji-amrit-to-panj-pyare--c1870--unknown.jpg","credit":"Unknown artist, c. 1870, public domain, via Wikimedia Commons","alt":"Sri Guru Gobind Singh Ji giving amrit to the Panj Pyare."},{"file":"guru-gobind-singh-ji-preparing-amrit-lithograph--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (26060i), coloured lithograph · public domain","alt":"Coloured lithograph: Sri Guru Gobind Singh Ji preparing amrit for the Panj Pyare at the birth of the Khalsa."}]},"avtar-purab-bhai-mohkam-singh-ji":{"about":{"pa":"ਭਾਈ ਮੁਹਕਮ ਸਿੰਘ ਜੀ ਦਾ ਜਨਮ ੫ ਚੇਤ, ਸੰਮਤ ੧੭੩੬ ਬਿਕ੍ਰਮੀ ਨੂੰ ਦਵਾਰਕਾ ਦੇ ਵਾਸੀ ਪਿਤਾ ਜਗਜੀਵਨ ਰਾਇ ਜੀ ਅਤੇ ਮਾਤਾ ਸੰਭਲੀ ਜੀ ਦੇ ਘਰ ਹੋਇਆ। ੧੫ ਸਾਲ ਦੀ ਉਮਰ ਵਿੱਚ ਮਾਤਾ ਪਿਤਾ ਸਮੇਤ ਦਸਵੀਂ ਪਾਤਿਸ਼ਾਹੀ ਜੀ ਦੀ ਸ਼ਰਨ ਆਏ ਅਤੇ ਸੰਮਤ ੧੭੬੧ ਵਿੱਚ ਸ੍ਰੀ ਚਮਕੌਰ ਸਾਹਿਬ ਦੀ ਜੰਗ ਵਿੱਚ ਸ਼ਹੀਦ ਹੋਏ।","en":"Bhai Mohkam Singh Ji was born on 5 Chet, 1736 Bikrami, to Jagjivan Rai Ji and Mata Sambhali Ji of Dwarka. At 15 they came with their parents into the sharan of the Tenth Patshahi, and in 1761 Bikrami they were martyred in the battle of Sri Chamkaur Sahib."},"pankti":{"gurmukhi":"ਸੇਵਕ ਕਉ ਸੇਵਾ ਬਨਿ ਆਈ ॥ ਹੁਕਮੁ ਬੂਝਿ ਪਰਮ ਪਦੁ ਪਾਈ ॥","ref":"Ang 292 · Raag Gauri · Sukhmani Sahib · Sri Guru Arjan Dev Ji"},"darshan":{"label":"ਜਨਮ","text":"੧੭੩੬ ਬਿ:, ੫ ਚੇਤਰ","page":"੨੩","source":"Gurbani Paath Darshan p.੨੩"},"images":[{"file":"gurdwara-katalgarh-sahib-chamkaur--2009--zenit.jpg","credit":"Zenit, CC BY-SA 3.0, via Wikimedia Commons","alt":"Gurdwara Sri Katalgarh Sahib, Sri Chamkaur Sahib, by day."},{"file":"guru-gobind-singh-ji-with-panj-pyare-mural-kot-fateh-khan--19th-century--unknown.jpg","credit":"Samadhi mural, Kot Fateh Khan, 19th century; photo Zulfiqar Ali Kalhoro, public domain, via Wikimedia Commons","alt":"Mural of Sri Guru Gobind Singh Ji with the Panj Pyare, each named in Gurmukhi above them."},{"file":"guru-gobind-singh-ji-amrit-to-panj-pyare--c1870--unknown.jpg","credit":"Unknown artist, c. 1870, public domain, via Wikimedia Commons","alt":"Sri Guru Gobind Singh Ji giving amrit to the Panj Pyare."},{"file":"guru-gobind-singh-ji-preparing-amrit-lithograph--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (26060i), coloured lithograph · public domain","alt":"Coloured lithograph: Sri Guru Gobind Singh Ji preparing amrit for the Panj Pyare at the birth of the Khalsa."}]},"avtar-purab-bhai-sahib-singh-ji":{"about":{"pa":"ਭਾਈ ਸਾਹਿਬ ਸਿੰਘ ਜੀ ਦਾ ਜਨਮ ੫ ਮੱਘਰ, ਸੰਮਤ ੧੭੩੨ ਬਿਕ੍ਰਮੀ ਨੂੰ ਬਿਦਰਪੁਰ ਦੇ ਵਾਸੀ ਪਿਤਾ ਗੁਰ ਨਰੈਣ ਜੀ ਅਤੇ ਮਾਤਾ ਅਨਕੰਪਾ ਜੀ ਦੇ ਘਰ ਹੋਇਆ। ੧੧ ਸਾਲ ਦੀ ਉਮਰ ਵਿੱਚ ਮਾਤਾ ਪਿਤਾ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਦਸਵੀਂ ਪਾਤਿਸ਼ਾਹੀ ਜੀ ਦੀ ਸ਼ਰਨ ਵਿੱਚ ਭੇਟ ਕੀਤਾ; ਸੰਮਤ ੧੭੬੧ ਵਿੱਚ ਉਹ ਸ੍ਰੀ ਚਮਕੌਰ ਸਾਹਿਬ ਦੀ ਜੰਗ ਵਿੱਚ ਸ਼ਹੀਦ ਹੋਏ।","en":"Bhai Sahib Singh Ji was born on 5 Maghar, 1732 Bikrami, to Gur Narain Ji and Mata Ankampa Ji of Bidarpur, who offered them into the sharan of the Tenth Patshahi at the age of 11. In 1761 Bikrami they were martyred in the battle of Sri Chamkaur Sahib."},"pankti":{"gurmukhi":"ਸਿਖੀ ਸਿਖਿਆ ਗੁਰ ਵੀਚਾਰਿ ॥ ਨਦਰੀ ਕਰਮਿ ਲਘਾਏ ਪਾਰਿ ॥","ref":"Ang 465 · Asa di Vaar · Sri Guru Nanak Dev Ji"},"darshan":{"label":"ਜਨਮ","text":"੧੭੩੨ ਬਿ: ੫ ਮਘਰ","page":"੨੩","source":"Gurbani Paath Darshan p.੨੩"},"images":[{"file":"gurdwara-katalgarh-sahib-chamkaur--2010--baljinder-kang.jpg","credit":"Baljinder Kang, CC BY 3.0, via Wikimedia Commons","alt":"Gurdwara Sri Katalgarh Sahib, Sri Chamkaur Sahib, lit up at night during the December Shaheedi Jor Mela."},{"file":"guru-gobind-singh-ji-with-panj-pyare-mural-kot-fateh-khan--19th-century--unknown.jpg","credit":"Samadhi mural, Kot Fateh Khan, 19th century; photo Zulfiqar Ali Kalhoro, public domain, via Wikimedia Commons","alt":"Mural of Sri Guru Gobind Singh Ji with the Panj Pyare, each named in Gurmukhi above them."},{"file":"guru-gobind-singh-ji-amrit-to-panj-pyare--c1870--unknown.jpg","credit":"Unknown artist, c. 1870, public domain, via Wikimedia Commons","alt":"Sri Guru Gobind Singh Ji giving amrit to the Panj Pyare."},{"file":"guru-gobind-singh-ji-preparing-amrit-lithograph--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (26060i), coloured lithograph · public domain","alt":"Coloured lithograph: Sri Guru Gobind Singh Ji preparing amrit for the Panj Pyare at the birth of the Khalsa."}]},"jyoti-jyot-bhai-daya-singh-ji":{"about":{"pa":"ਭਾਈ ਦਯਾ ਸਿੰਘ ਜੀ ਅੱਸੂ ਦੀ ਮੱਸਿਆ, ਸੰਮਤ ੧੭੬੫ ਬਿਕ੍ਰਮੀ ਨੂੰ ਅਬਚਲ ਨਗਰ ਸ੍ਰੀ ਹਜ਼ੂਰ ਸਾਹਿਬ ਵਿਖੇ ਜੋਤੀ ਜੋਤਿ ਸਮਾਏ।","en":"Bhai Daya Singh Ji merged in the Light at Abchal Nagar Sri Hazur Sahib on the masya of Assu, 1765 Bikrami."},"pankti":{"gurmukhi":"ਸੂਰਜ ਕਿਰਣਿ ਮਿਲੇ ਜਲ ਕਾ ਜਲੁ ਹੂਆ ਰਾਮ ॥ ਜੋਤੀ ਜੋਤਿ ਰਲੀ ਸੰਪੂਰਨੁ ਥੀਆ ਰਾਮ ॥","ref":"Ang 846 · Raag Bilaval · Sri Guru Arjan Dev Ji"},"darshan":{"label":"ਜੋਤੀ ਜੋਤਿ ਸਮਾਏ","text":"੧੭੬੫ ਬਿਕ੍ਰਮੀ ਅੱਸੂ ਅਮਾਵਸ","page":"੨੩","source":"Gurbani Paath Darshan p.੨੩"},"images":[{"file":"takht-sachkhand-sri-hazur-sahib-nanded--2012--jaspal-singh.jpg","credit":"Jaspal Singh, CC BY-SA 3.0, via Wikimedia Commons","alt":"Takht Sachkhand Sri Hazur Sahib, Nanded."},{"file":"guru-gobind-singh-ji-with-panj-pyare-mural-kot-fateh-khan--19th-century--unknown.jpg","credit":"Samadhi mural, Kot Fateh Khan, 19th century; photo Zulfiqar Ali Kalhoro, public domain, via Wikimedia Commons","alt":"Mural of Sri Guru Gobind Singh Ji with the Panj Pyare, each named in Gurmukhi above them."},{"file":"guru-gobind-singh-ji-preparing-amrit-lithograph--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (26060i), coloured lithograph · public domain","alt":"Coloured lithograph: Sri Guru Gobind Singh Ji preparing amrit for the Panj Pyare at the birth of the Khalsa."}]},"akal-chalana-bhai-bidhi-chand-ji":{"about":{"en":"Bhai Bidhi Chand Ji of Sursingh, a commander of Sri Guru Hargobind Sahib Ji who won back the horses Dilbagh and Gulbagh from Lahore, passed away at Devnagar in 1640 beside their friend Sundar Shah.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਦੇ ਜਰਨੈਲ, ਸੁਰ ਸਿੰਘ ਦੇ ਭਾਈ ਬਿਧੀ ਚੰਦ ਜੀ, ਜਿਨ੍ਹਾਂ ਨੇ ਦਿਲਬਾਗ਼ ਅਤੇ ਗੁਲਬਾਗ਼ ਘੋੜੇ ਲਾਹੌਰ ਤੋਂ ਮੋੜ ਲਿਆਂਦੇ, ੧੬੪੦ ਈ. ਵਿੱਚ ਦੇਵਨਗਰ ਵਿਖੇ ਆਪਣੇ ਮਿੱਤਰ ਸੁੰਦਰ ਸ਼ਾਹ ਦੇ ਕੋਲ ਅਕਾਲ ਚਲਾਣਾ ਕਰ ਗਏ।"},"pankti":{"gurmukhi":"ਸਜਣ ਸੇਈ ਨਾਲਿ ਮੈ ਚਲਦਿਆ ਨਾਲਿ ਚਲੰਨਿੑ ॥ ਜਿਥੈ ਲੇਖਾ ਮੰਗੀਐ ਤਿਥੈ ਖੜੇ ਦਿਸੰਨਿ ॥੧॥ ਰਹਾਉ ॥","ref":"Ang 729 · Raag Suhi · Sri Guru Nanak Dev Ji"}},"akal-chalana-mata-ganga-ji":{"about":{"en":"Mata Ganga Ji, wife of Sri Guru Arjan Dev Ji and mother of Sri Guru Hargobind Sahib Ji, passed away at Bakala in 1621; as they wished, their body was given to the river Beas.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦੇ ਮਹਿਲ ਅਤੇ ਸ੍ਰੀ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਦੇ ਮਾਤਾ, ਮਾਤਾ ਗੰਗਾ ਜੀ ੧੬੨੧ ਈ. ਵਿੱਚ ਬਕਾਲੇ ਵਿਖੇ ਅਕਾਲ ਚਲਾਣਾ ਕਰ ਗਏ; ਉਨ੍ਹਾਂ ਦੀ ਇੱਛਾ ਅਨੁਸਾਰ ਉਨ੍ਹਾਂ ਦਾ ਸਰੀਰ ਬਿਆਸ ਦਰਿਆ ਵਿੱਚ ਜਲ-ਪ੍ਰਵਾਹ ਕੀਤਾ ਗਿਆ।"},"pankti":{"gurmukhi":"ਸਤਿਗੁਰੁ ਤੁਮੑ ਕਉ ਹੋਇ ਦਇਆਲਾ ਸੰਤਸੰਗਿ ਤੇਰੀ ਪ੍ਰੀਤਿ ॥","ref":"Ang 496 · Raag Gujri · Sri Guru Arjan Dev Ji"}},"avtar-purab-bibi-bhani-ji":{"about":{"en":"Bibi Bhani Ji — daughter of Sri Guru Amar Das Ji, wife of Sri Guru Ram Das Ji and mother of Sri Guru Arjan Dev Ji — were born at Basarke Gillan on 21 Magh, 1591 Bikrami (1535 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਅਮਰ ਦਾਸ ਜੀ ਦੇ ਸਪੁੱਤਰੀ, ਸ੍ਰੀ ਗੁਰੂ ਰਾਮ ਦਾਸ ਜੀ ਦੇ ਮਹਿਲ ਅਤੇ ਸ੍ਰੀ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦੇ ਮਾਤਾ ਬੀਬੀ ਭਾਨੀ ਜੀ ੨੧ ਮਾਘ, ਸੰਮਤ ੧੫੯੧ ਬਿਕ੍ਰਮੀ (੧੫੩੫ ਈ.) ਨੂੰ ਬਾਸਰਕੇ ਗਿੱਲਾਂ ਵਿਖੇ ਪ੍ਰਗਟ ਹੋਏ।"},"pankti":{"gurmukhi":"ਵਿਚਿ ਦੁਨੀਆ ਸੇਵ ਕਮਾਈਐ ॥ ਤਾ ਦਰਗਹ ਬੈਸਣੁ ਪਾਈਐ ॥","ref":"Ang 26 · Sri Raag · Sri Guru Nanak Dev Ji"}},"barsi-sant-attar-singh-ji-mastuane":{"about":{"en":"Sant Attar Singh Ji, whose kirtan and katha drew many into the Khalsa and who made Gursagar Mastuana their centre in 1902, passed away at Sangrur on 31 January 1927.","pa":"ਆਪਣੇ ਕੀਰਤਨ ਅਤੇ ਕਥਾ ਨਾਲ ਅਨੇਕਾਂ ਨੂੰ ਅੰਮ੍ਰਿਤ ਛਕਾ ਕੇ ਖ਼ਾਲਸਾ ਸਜਾਉਣ ਵਾਲੇ ਅਤੇ ੧੯੦੨ ਈ. ਵਿੱਚ ਗੁਰਸਾਗਰ ਮਸਤੂਆਣਾ ਨੂੰ ਆਪਣਾ ਕੇਂਦਰ ਬਣਾਉਣ ਵਾਲੇ ਸੰਤ ਅਤਰ ਸਿੰਘ ਜੀ ੩੧ ਜਨਵਰੀ ੧੯੨੭ ਈ. ਨੂੰ ਸੰਗਰੂਰ ਵਿਖੇ ਚਲਾਣਾ ਕਰ ਗਏ।"},"pankti":{"gurmukhi":"ਸੰਤ ਕਾ ਮਾਰਗੁ ਧਰਮ ਕੀ ਪਉੜੀ ਕੋ ਵਡਭਾਗੀ ਪਾਏ ॥","ref":"Ang 622 · Raag Sorath · Sri Guru Arjan Dev Ji"}},"jyoti-jyot-baba-gurditta-ji":{"about":{"en":"Baba Gurditta Ji — eldest son of Sri Guru Hargobind Sahib Ji, founder of Kiratpur Sahib and father of Sri Guru Har Rai Sahib Ji — merged in the Light at Kiratpur on Chet sudi 10, 1695 Bikrami (1638 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਦੇ ਵੱਡੇ ਸਾਹਿਬਜ਼ਾਦੇ, ਕੀਰਤਪੁਰ ਸਾਹਿਬ ਵਸਾਉਣ ਵਾਲੇ ਅਤੇ ਸ੍ਰੀ ਗੁਰੂ ਹਰਿ ਰਾਇ ਸਾਹਿਬ ਜੀ ਦੇ ਪਿਤਾ ਬਾਬਾ ਗੁਰਦਿੱਤਾ ਜੀ ਚੇਤ ਸੁਦੀ ੧੦, ਸੰਮਤ ੧੬੯੫ ਬਿਕ੍ਰਮੀ (੧੬੩੮ ਈ.) ਨੂੰ ਕੀਰਤਪੁਰ ਵਿਖੇ ਜੋਤੀ ਜੋਤਿ ਸਮਾਏ।"},"pankti":{"gurmukhi":"ਕਿਵ ਸਚਿਆਰਾ ਹੋਈਐ ਕਿਵ ਕੂੜੈ ਤੁਟੈ ਪਾਲਿ ॥ ਹੁਕਮਿ ਰਜਾਈ ਚਲਣਾ ਨਾਨਕ ਲਿਖਿਆ ਨਾਲਿ ॥੧॥","ref":"Ang 1 · Jap Ji Sahib · Sri Guru Nanak Dev Ji"}},"saka-vaisakhi-1978":{"about":{"en":"On Vaisakhi, 13 April 1978, Bhai Fauja Singh Ji led Singhs of the Akhand Kirtani Jatha and Damdami Taksal to stop a Nirankari convention in Amritsar; thirteen Singhs were martyred.","pa":"੧੩ ਅਪ੍ਰੈਲ ੧੯੭੮ ਈ. ਦੀ ਵਿਸਾਖੀ ਨੂੰ ਭਾਈ ਫ਼ੌਜਾ ਸਿੰਘ ਜੀ ਦੀ ਅਗਵਾਈ ਵਿੱਚ ਅਖੰਡ ਕੀਰਤਨੀ ਜਥੇ ਅਤੇ ਦਮਦਮੀ ਟਕਸਾਲ ਦੇ ਸਿੰਘਾਂ ਨੇ ਅੰਮ੍ਰਿਤਸਰ ਵਿੱਚ ਨਿਰੰਕਾਰੀ ਸਮਾਗਮ ਨੂੰ ਰੋਕਣ ਦਾ ਯਤਨ ਕੀਤਾ; ੧੩ ਸਿੰਘ ਸ਼ਹੀਦ ਹੋਏ।"},"pankti":{"gurmukhi":"ਕਬੀਰ ਜਉ ਤੁਹਿ ਸਾਧ ਪਿਰੰਮ ਕੀ ਸੀਸੁ ਕਾਟਿ ਕਰਿ ਗੋਇ ॥ ਖੇਲਤ ਖੇਲਤ ਹਾਲ ਕਰਿ ਜੋ ਕਿਛੁ ਹੋਇ ਤ ਹੋਇ ॥੨੩੯॥","ref":"Ang 1377 · Salok Kabir Ji · Bhagat Kabir Ji"}},"shaheedi-divas-sardar-hari-singh-nalwa":{"about":{"en":"Sardar Hari Singh Nalwa, commander of the Khalsa army and governor of Kashmir and Peshawar, fell defending Jamrud, at the mouth of the Khyber Pass, on 30 April 1837.","pa":"ਖ਼ਾਲਸਾ ਫ਼ੌਜ ਦੇ ਜਰਨੈਲ ਅਤੇ ਕਸ਼ਮੀਰ ਤੇ ਪਿਸ਼ਾਵਰ ਦੇ ਸੂਬੇਦਾਰ ਸਰਦਾਰ ਹਰੀ ਸਿੰਘ ਨਲੂਆ ੩੦ ਅਪ੍ਰੈਲ ੧੮੩੭ ਈ. ਨੂੰ ਖ਼ੈਬਰ ਦੱਰੇ ਦੇ ਮੂੰਹ ਉੱਤੇ ਜਮਰੌਦ ਦੀ ਰਾਖੀ ਕਰਦਿਆਂ ਸ਼ਹੀਦ ਹੋਏ।"},"pankti":{"gurmukhi":"ਦਰਗਹ ਮਾਣੁ ਪਾਵਹਿ ਪਤਿ ਸਿਉ ਜਾਵਹਿ ਆਗੈ ਦੂਖੁ ਨ ਲਾਗੈ ॥","ref":"Ang 580 · Raag Vadhans (Alahniyan) · Sri Guru Nanak Dev Ji"}},"shaheedi-divas-singhs-of-baba-banda-singh-bahadur-delhi":{"about":{"en":"The Singhs brought to Delhi in chains with Baba Banda Singh Bahadur were martyred a hundred a day from 5 March 1716; the English envoys in Delhi wrote that not one gave up the Sikhi to save their life.","pa":"ਬਾਬਾ ਬੰਦਾ ਸਿੰਘ ਬਹਾਦਰ ਦੇ ਨਾਲ ਸੰਗਲਾਂ ਵਿੱਚ ਦਿੱਲੀ ਲਿਆਂਦੇ ਸਿੰਘ ੫ ਮਾਰਚ ੧੭੧੬ ਈ. ਤੋਂ ਰੋਜ਼ ਸੌ-ਸੌ ਕਰਕੇ ਸ਼ਹੀਦ ਕੀਤੇ ਗਏ; ਦਿੱਲੀ ਵਿੱਚ ਅੰਗਰੇਜ਼ ਵਕੀਲਾਂ ਨੇ ਲਿਖਿਆ ਕਿ ਜਾਨ ਬਚਾਉਣ ਲਈ ਇੱਕ ਨੇ ਵੀ ਸਿੱਖੀ ਨਹੀਂ ਛੱਡੀ।"},"pankti":{"gurmukhi":"ਜੇ ਜੀਵੈ ਪਤਿ ਲਥੀ ਜਾਇ ॥ ਸਭੁ ਹਰਾਮੁ ਜੇਤਾ ਕਿਛੁ ਖਾਇ ॥","ref":"Ang 142 · Vaar Majh · Sri Guru Nanak Dev Ji"}},"saka-jallianwala-bagh":{"about":{"en":"On Vaisakhi, 13 April 1919, British troops under General Dyer fired on an unarmed gathering in Jallianwala Bagh, Amritsar; hundreds were killed.","pa":"੧੩ ਅਪ੍ਰੈਲ ੧੯੧੯ ਈ. ਦੀ ਵਿਸਾਖੀ ਨੂੰ ਜਨਰਲ ਡਾਇਰ ਦੀ ਕਮਾਨ ਹੇਠ ਅੰਗਰੇਜ਼ੀ ਫ਼ੌਜ ਨੇ ਅੰਮ੍ਰਿਤਸਰ ਦੇ ਜਲ੍ਹਿਆਂਵਾਲੇ ਬਾਗ਼ ਵਿੱਚ ਨਿਹੱਥੇ ਇਕੱਠ ਉੱਤੇ ਗੋਲੀ ਚਲਾਈ; ਸੈਂਕੜੇ ਲੋਕ ਮਾਰੇ ਗਏ।"},"pankti":{"gurmukhi":"ਨਿਰਭਉ ਭਏ ਸਗਲ ਭਉ ਮਿਟਿਆ ਰਾਖੇ ਰਾਖਨਹਾਰੇ ॥","ref":"Ang 383 · Raag Aasaa · Sri Guru Arjan Dev Ji"}},"shaheedi-divas-baba-maharaj-singh-ji":{"about":{"en":"Baba Maharaj Singh Ji, head of the Naurangabad dera, fought British rule after the Anglo-Sikh wars; arrested in 1849 and exiled to Singapore, they died there in solitary confinement on 5 July 1856.","pa":"ਨੌਰੰਗਾਬਾਦ ਡੇਰੇ ਦੇ ਮੁਖੀ ਬਾਬਾ ਮਹਾਰਾਜ ਸਿੰਘ ਜੀ ਨੇ ਐਂਗਲੋ-ਸਿੱਖ ਜੰਗਾਂ ਮਗਰੋਂ ਅੰਗਰੇਜ਼ੀ ਰਾਜ ਦਾ ਟਾਕਰਾ ਕੀਤਾ; ੧੮੪੯ ਈ. ਵਿੱਚ ਗ੍ਰਿਫ਼ਤਾਰ ਕਰਕੇ ਸਿੰਗਾਪੁਰ ਭੇਜ ਦਿੱਤੇ ਗਏ, ਜਿੱਥੇ ੫ ਜੁਲਾਈ ੧੮੫੬ ਨੂੰ ਇਕੱਲੀ ਕੈਦ ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੇ ਸਰੀਰ ਤਿਆਗਿਆ।"},"pankti":{"gurmukhi":"ਕਬੀਰ ਸੰਤ ਮੂਏ ਕਿਆ ਰੋਈਐ ਜੋ ਅਪੁਨੇ ਗ੍ਰਿਹਿ ਜਾਇ ॥ ਰੋਵਹੁ ਸਾਕਤ ਬਾਪੁਰੇ ਜੁ ਹਾਟੈ ਹਾਟ ਬਿਕਾਇ ॥੧੬॥","ref":"Ang 1365 · Salok Kabir Ji · Bhagat Kabir Ji"}}},
  PRINTED_FROM: '2021-03-13',
  PRINTED_TO: '2027-03-15'
};

/* ============================================================================
   events.js — every built-in date, worked out for any year
   ----------------------------------------------------------------------------
   Nothing here is typed in year by year. Each event has a RULE in
   tools/rules/events.json (built into js/rules.js):

     tithi      a lunar date — month, paksha, tithi — kept on the day the
                jantri's rules give it (see lunar.js); some festivals reckon
                at sunset (Diwali) or in the afternoon (Dussehra)
     solar      a day of a Bikrami solar month, e.g. 13 Poh
     gregorian  the same English date every year (the 1984 anniversaries)

   Sangrand, masya, puranmashi and the New Year are generated from the sky.

   The SGPC jantri of Samvat 553–558 (tools/jantri/*.tsv) is no longer the
   source — it is the REFERENCE. The build checks every printed row against
   these rules, and where SGPC printed a different day, that day ships in
   SikhRules.DIFFS so the app can say "SGPC prints …" beside it.
   ========================================================================= */

const SikhEvents = (function () {
  'use strict';

  const CATEGORIES = {
    prakash:  { en: 'Prakash Gurpurab', pa: 'ਪ੍ਰਕਾਸ਼ ਗੁਰਪੁਰਬ', hue: 'gold',    glyph: '\u2737' },
    gurgaddi: { en: 'Gurgaddi Divas',   pa: 'ਗੁਰਗੱਦੀ ਦਿਵਸ', hue: 'clay',   glyph: '\u2756' },
    jotijot:  { en: 'Jyoti Jyot',       pa: 'ਜੋਤੀ ਜੋਤਿ',       hue: 'plum',  glyph: '\u25c8' },
    shaheedi: { en: 'Shaheedi Divas',   pa: 'ਸ਼ਹੀਦੀ ਦਿਵਸ',     hue: 'crimson', glyph: '\u2726' },
    festival: { en: 'Festival',         pa: 'ਤਿਉਹਾਰ',         hue: 'saffron', glyph: '\u273a' },
    historic: { en: 'Historic Day',     pa: 'ਇਤਿਹਾਸਕ ਦਿਹਾੜਾ',  hue: 'forest',    glyph: '\u2b25' },
    janamdin: { en: 'Avtar Purab & Janam Divas', pa: 'ਅਵਤਾਰ ਪੁਰਬ ਤੇ ਜਨਮ ਦਿਵਸ',         hue: 'green',   glyph: '\u25cf' },
    mela:     { en: 'Jor Mela',         pa: 'ਜੋੜ ਮੇਲਾ',        hue: 'saffron', glyph: '\u273b' },
    modern:   { en: 'Modern Era',       pa: 'ਆਧੁਨਿਕ ਦੌਰ',      hue: 'stone',   glyph: '\u25aa' },
    moon:     { en: 'Masya & Puranmashi', pa: 'ਮੱਸਿਆ ਤੇ ਪੂਰਨਮਾਸ਼ੀ', hue: 'stone', glyph: '\u263e' },
    sangrand: { en: 'Sangrand',         pa: 'ਸੰਗਰਾਂਦ',         hue: 'gold',    glyph: '\u25d0' },
    personal: { en: 'My Event',         pa: 'ਮੇਰਾ ਸਮਾਗਮ',      hue: 'green',   glyph: '\u25cf' }
  };

  const R = SikhRules;
  const N = Nanakshahi;
  const EVENTS = R.EVENTS;
  const byId = new Map(EVENTS.map(e => [e.id, e]));
  const byEn = new Map(EVENTS.map(e => [e.en, e]));

  // Generated series: one definition each, so they can be renamed or hidden.
  const MOON = {
    masya:      { id: 'masya', en: 'Masya', pa: 'ਮੱਸਿਆ', cat: 'moon' },
    puranmashi: { id: 'puranmashi', en: 'Puranmashi', pa: 'ਪੂਰਨਮਾਸ਼ੀ', cat: 'moon' }
  };
  const sangrandDef = m => ({
    id: 'sangrand-' + m, cat: 'sangrand',
    en: 'Sangrand — ' + N.MONTHS[m - 1].en, pa: 'ਸੰਗਰਾਂਦ — ' + N.MONTHS[m - 1].pa
  });
  const NEW_YEAR = { id: 'nanakshahi-new-year', cat: 'festival', major: true,
                     en: 'Nanakshahi New Year', pa: 'ਨਾਨਕਸ਼ਾਹੀ ਨਵਾਂ ਸਾਲ' };

  const MONTH_NAMES = N.MONTHS.map(m => m.en);

  /** A rule in words: "Poh sudi 7", "13 Poh", "4 June". */
  function ruleText(rule) {
    if (rule.type === 'tithi') {
      return MONTH_NAMES[rule.month - 1] + ' ' + rule.paksha + ' ' + rule.tithi +
             (rule.when === 'sunset' ? ' (at sunset)' : rule.when === 'aparahna' ? ' (afternoon)' : '');
    }
    if (rule.type === 'solar') {
      const d = rule.day === -1 ? 'Last day of' : String(rule.day);
      return d + ' ' + MONTH_NAMES[rule.month - 1] + (rule.days > 1 ? ' (' + rule.days + ' days)' : '');
    }
    return rule.day + ' ' + N.G_MONTHS_LONG[rule.month - 1];
  }

  const applies = (rule, gy) => (rule.from == null || gy >= rule.from) &&
                                (rule.to == null || gy <= rule.to);

  /* -------------------------------------------------- one year, computed */

  const yearCache = new Map();   // place|year -> Map(iso -> [defs])
  if (typeof Sky !== 'undefined') Sky.onChange(() => yearCache.clear());

  function push(map, iso, def, extra) {
    if (!map.has(iso)) map.set(iso, []);
    map.get(iso).push(extra ? Object.assign({ def }, extra) : { def });
  }

  /** Bikrami (solar) dates of rule in Gregorian year gy, as iso strings. */
  function solarDates(rule, gy) {
    const out = [];
    // Two samvats touch every Gregorian year.
    [gy - 1469, gy - 1468].forEach(ns => {
      const len = Bikrami.monthLength(ns, rule.month);
      const day = rule.day === -1 ? len : Math.min(rule.day, len);
      for (let k = 0; k < (rule.days || 1); k++) {
        const iso = N.isoKey(Bikrami.toGregorian(ns, rule.month, day + k));
        if (+iso.slice(0, 4) === gy) out.push(iso);
      }
    });
    return out;
  }

  function buildYear(gy) {
    const map = new Map();
    // Sangrand and New Year: always, from the Sun.
    [gy - 1469, gy - 1468].forEach(ns => {
      for (let m = 1; m <= 12; m++) {
        const iso = N.isoKey(Bikrami.monthStart(ns, m));
        if (+iso.slice(0, 4) !== gy) continue;
        push(map, iso, sangrandDef(m));
        if (m === 1) push(map, iso, NEW_YEAR, { samvat: ns });
      }
    });
    if (!Sky.inRange(gy)) return map;      // outside 1900–2100: sangrands only

    Sky.moonDays(gy).forEach(x => push(map, x.iso, MOON[x.kind]));
    EVENTS.forEach(def => def.rules.forEach(rule => {
      if (!applies(rule, gy)) return;
      const dates = rule.type === 'tithi' ? Sky.tithiDates(gy, rule)
                  : rule.type === 'solar' ? solarDates(rule, gy)
                  : [N.isoKey(new Date(gy, rule.month - 1, rule.day))];
      dates.forEach(iso => push(map, iso, def));
    }));
    return map;
  }

  function yearMap(gy) {
    const key = JSON.stringify(Sky.location()) + '|' + gy;
    if (!yearCache.has(key)) yearCache.set(key, buildYear(gy));
    return yearCache.get(key);
  }

  /** Every computed date of one event in a Gregorian year range. */
  function datesOf(id, fromY, toY) {
    const out = [];
    for (let y = fromY; y <= toY; y++) {
      yearMap(y).forEach((list, iso) => {
        if (list.some(x => x.def.id === id)) out.push(iso);
      });
    }
    return out.sort();
  }

  /* ------------------------------------------------------------ lookup */

  function materialise(def, iso, g, ns, extra) {
    const e = {
      id: 'ev-' + def.id + '-' + iso, eventId: def.id,
      cat: def.cat, en: def.en, pa: def.pa, major: !!def.major,
      note: def.note || '', source: 'rule', greg: g, ns
    };
    const c = R.CONTENT && R.CONTENT[def.id];
    // A day with several approved pictures shows the next one each year.
    if (c) e.content = c.images && c.images.length
      ? Object.assign({}, c, { image: c.images[g.getFullYear() % c.images.length] }) : c;
    if (extra && extra.samvat != null) {
      e.en = def.en + ' ' + extra.samvat;
      e.pa = def.pa + ' ' + N.gurmukhiNumber(extra.samvat);
    }
    // Where SGPC printed this event on another day, say so (Amritsar only:
    // the comparison means nothing for another place's sunrise).
    if (Sky.isAmritsar()) {
      const p = R.DIFFS[def.id + '|' + iso];
      if (p) e.sgpcPrinted = p;
    }
    return e;
  }

  /**
   * Everything the calendar marks on this Gregorian date.
   * @param g   Date
   * @param ns  the date already converted
   */
  function builtInFor(g, ns) {
    const iso = N.isoKey(g);
    const list = yearMap(g.getFullYear()).get(iso) || [];
    return list.map(x => materialise(x.def, iso, g, ns, x));
  }

  /**
   * The days SGPC printed an event on where these rules give another day:
   * shown on the printed day as a pointer to the calculated one.
   */
  function printedHere(iso) {
    if (!Sky.isAmritsar()) return [];
    return (R.PRINTED_ON[iso] || []).map(x => ({ id: x.id, calculated: x.computed }));
  }

  /** One event definition on one date, by id or English name. Overrides use
   *  this to materialise an entry that has been moved onto another day. */
  function findOn(iso, key) {
    const def = byId.get(key) || byEn.get(key) || byId.get(R.LEGACY[key]) ||
                (MOON[key] || null);
    if (!def) return null;
    const g = N.parseIso(iso);
    return materialise(def, iso, g, Cal.fromGregorian(g));
  }

  /** Every built-in series once, for All purabs and the editor. */
  function definitions() {
    const now = new Date().getFullYear();
    const defs = EVENTS.concat([MOON.masya, MOON.puranmashi, NEW_YEAR],
      N.MONTHS.map(m => sangrandDef(m.n)));
    return defs.map(d => {
      const dates = datesOf(d.id, now - 1, now + 2);
      return {
        id: d.id, en: d.en, pa: d.pa, cat: d.cat, major: !!d.major,
        rule: d.rules ? d.rules.filter(r => applies(r, now)).map(ruleText).join(' · ')
                      : d.cat === 'sangrand' ? 'Sun enters the next rashi'
                      : d.id === 'nanakshahi-new-year' ? '1 Chet' : 'Every lunar month',
        kinds: ['rule'], count: dates.length,
        first: dates[0] || null, last: dates[dates.length - 1] || null, dates
      };
    }).sort((a, b) => a.en.localeCompare(b.en));
  }

  /** Inside the supported years? Sangrands show beyond; nothing else does. */
  function covered(g) { return Sky.inRange(g.getFullYear()); }
  const COVERED_FROM = Sky.MIN_YEAR + '-01-01';
  const COVERED_TO = Sky.MAX_YEAR + '-12-31';

  /* --------------------------------------------------------- self-test
     Cheap spot checks at load, at Amritsar: dates the jantri printed that
     the rules must reproduce. The full 876-row regression runs at build.
  */
  function selfTest() {
    const fails = [];
    if (!Sky.isAmritsar()) return fails;
    [['2026-11-24', 'prakash-gurpurab-sri-guru-nanak-dev-ji'],
     ['2027-01-15', 'prakash-gurpurab-sri-guru-gobind-singh-ji'],
     ['2026-12-08', 'masya'], ['2026-12-23', 'puranmashi'],
     ['2026-06-04', 'ghallughara-sri-akal-takht-sahib-1984'],
     ['2026-04-14', 'sangrand-2']
    ].forEach(([iso, id]) => {
      const list = yearMap(+iso.slice(0, 4)).get(iso) || [];
      if (!list.some(x => x.def.id === id)) fails.push(`${id} not on ${iso}`);
    });
    if (fails.length) console.error('Dataset self-test FAILED:\n' + fails.join('\n'));
    return fails;
  }

  /* ---------------------------------------------------- names and ids
     An event's id is permanent; its names are not. Overrides saved before an
     event was renamed are keyed by the old English name, so every name an id
     has ever had is an alias of it.
  */
  const GENERATED_IDS = new Map([['Masya', 'masya'], ['Puranmashi', 'puranmashi'],
                                 ['Nanakshahi New Year', 'nanakshahi-new-year']]);
  N.MONTHS.forEach(m => GENERATED_IDS.set('Sangrand — ' + m.en, 'sangrand-' + m.n));

  /** The id behind an id, a current name, a former name, or an event. */
  function idFor(x) {
    if (x && typeof x === 'object') return x.eventId || (byId.has(x.id) || isGenerated(x.id) ? x.id : null) || idFor(x.en);
    const k = String(x || '').trim();
    if (byId.has(k) || isGenerated(k)) return k;
    if (byEn.has(k)) return byEn.get(k).id;
    if (GENERATED_IDS.has(k)) return GENERATED_IDS.get(k);
    if (/^Nanakshahi New Year \d+$/.test(k)) return 'nanakshahi-new-year';
    const legacy = R.LEGACY[k];
    return legacy && legacy !== 'removed' ? legacy : null;
  }
  function isGenerated(id) {
    return id === 'masya' || id === 'puranmashi' || id === 'nanakshahi-new-year' ||
           /^sangrand-(1[0-2]|[1-9])$/.test(String(id));
  }

  const aliasMap = new Map();
  Object.keys(R.LEGACY).forEach(name => {
    const id = R.LEGACY[name];
    if (id === 'removed') return;
    if (!aliasMap.has(id)) aliasMap.set(id, new Set());
    aliasMap.get(id).add(name);
  });
  GENERATED_IDS.forEach((id, name) => {
    if (!aliasMap.has(id)) aliasMap.set(id, new Set());
    aliasMap.get(id).add(name);
  });

  /** Every key an id's overrides may have been saved under, id first. */
  function aliases(id) {
    const out = [id];
    const def = byId.get(id);
    if (def && out.indexOf(def.en) < 0) out.push(def.en);
    (aliasMap.get(id) || []).forEach(n => { if (out.indexOf(n) < 0) out.push(n); });
    return out;
  }

  /** The day SGPC printed this occurrence on, if it differs. */
  const printedFor = (id, iso) => R.DIFFS[id + '|' + iso] || null;

  return { CATEGORIES, EVENTS, COVERED_FROM, COVERED_TO, LEGACY: R.LEGACY,
           idFor, aliases, printedFor,
           builtInFor, printedHere, covered, findOn, definitions, datesOf,
           ruleText, selfTest };
})();

/* ============================================================================
   calendar.js — the calendar the app runs on
   ----------------------------------------------------------------------------
   One calendar: the Nanakshahi dates as they are printed in the jantri. Months
   are Bikrami solar, so the sangrand moves a little each year and the gurpurabs
   follow the moon — which is why the dates are transcribed rather than
   calculated.

   `Bikrami` does the geometry; `Nanakshahi` owns the shared date utilities and
   the month names, and both are reached through here so no view has to know
   which file a given function lives in.

   There was once a switch between two reckonings. It is gone: the app should
   answer "when is it", not ask the reader to pick a system first.
   ========================================================================= */

const Cal = (function () {
  'use strict';

  const E = () => Bikrami;

  const api = {
    get engine() { return Bikrami; },

    /* --- geometry: whichever engine is active ---------------------------- */
    fromGregorian: d => E().fromGregorian(d),
    toGregorian: (y, m, d) => E().toGregorian(y, m, d),
    monthStart: (y, m) => E().monthStart(y, m),
    monthLength: (y, m) => E().monthLength(y, m),
    yearLength: y => E().yearLength(y),
    monthSpan: (y, m) => E().monthSpan(y, m),
    shiftMonth: (y, m, delta) => E().shiftMonth(y, m, delta),
    monthGrid: (y, m, ws) => E().monthGrid(y, m, ws),
    weekOf: (d, ws) => E().weekOf(d, ws),
    isSangrand: ns => E().isSangrand(ns),
    nextSangrand: d => E().nextSangrand(d),

    /** Is this year's month table transcribed from a jantri, or computed? */
    isVerified(y) { return Bikrami.isVerified(y); },

    /** Provenance of one month start — 'jantri' or 'computed'. */
    startSource(y, m) { return Bikrami.startSource(y, m); },

    /* --- shared utilities: always Nanakshahi ----------------------------- */
    get MONTHS() { return Nanakshahi.MONTHS; },
    get WEEKDAYS() { return Nanakshahi.WEEKDAYS; },
    get G_MONTHS_SHORT() { return Nanakshahi.G_MONTHS_SHORT; },
    get G_MONTHS_LONG() { return Nanakshahi.G_MONTHS_LONG; },
    get GURMUKHI_DIGITS() { return Nanakshahi.GURMUKHI_DIGITS; },

    monthMeta: m => Nanakshahi.monthMeta(m),
    midnight: d => Nanakshahi.midnight(d),
    addDays: (d, n) => Nanakshahi.addDays(d, n),
    daysBetween: (a, b) => Nanakshahi.daysBetween(a, b),
    isoKey: d => Nanakshahi.isoKey(d),
    parseIso: s => Nanakshahi.parseIso(s),
    gurmukhiNumber: n => Nanakshahi.gurmukhiNumber(n),
    gregShort: d => Nanakshahi.gregShort(d),
    gregLong: d => Nanakshahi.gregLong(d),
    gregFull: d => Nanakshahi.gregFull(d),
    moonPhases: (a, b) => Nanakshahi.moonPhases(a, b),

    /** Run every self-test and return the combined failure list. */
    selfTest() {
      return [].concat(
        // Nanakshahi is no longer a selectable calendar, but it still owns the
        // shared date maths, so its own checks still have to pass.
        Nanakshahi.selfTest().map(s => 'dates: ' + s),
        Bikrami.selfTest().map(s => 'calendar: ' + s),
        SikhEvents.selfTest().map(s => 'data: ' + s)
      );
    }
  };

  return api;
})();

/* ============================================================================
   overrides.js — your edits to the built-in calendar
   ----------------------------------------------------------------------------
   The built-in dates are worked out from rules (events.js) that are checked
   against the printed jantri at every build. Nothing here ever changes them.
   Instead this keeps a separate layer of DIFFERENCES, and the views apply that
   layer on the way out.

   Why it matters: the checked calendar stays checkable. Delete your overrides
   and you are back to exactly what the rules give. Export them and someone else
   can apply the same changes to the same base. Neither is possible if you edit
   the source rows in place.

   Two scopes, because two different things get edited:

     SERIES     keyed by the event's permanent id (older edits: by the English
                name it had then — still honoured). Renaming Sri Guru Nanak Dev
                Ji's Prakash Gurpurab, or switching Lohri off, means every year —
                so these edits key on the event, not the date.
                { en, pa, cat, off, offFrom }

     OCCURRENCE keyed by date + name. Moving one year's date, or hiding a single
                instance, must not touch the other years.
                { to, off }

     CUSTOM     a date the sangat keeps that is not in the jantri at all, keyed
                by its own id. Anchored to an English date or a Panjabi one,
                once or every year — the same choice personal events offer, but
                shared with everyone rather than living on one device.
                { anchor, repeat, iso | m + d, en, pa, cat, note, major }

   `offFrom` is what makes "off for the future" work: history stays intact and
   the entry stops appearing from that date on. A calendar people have already
   planned around should not rewrite its own past.

   SYNC
   Every patch carries `_ts`, and deleting one writes a tombstone rather than
   removing the key. Both exist for the same reason: two devices editing the
   same calendar have to be merged per key, and a plain delete is
   indistinguishable from "this device has not heard about it yet" — so without
   tombstones, deleting a change on your phone would be silently undone by your
   laptop the next time it synced.
   ========================================================================= */

const Overrides = (function () {
  'use strict';

  const KEY = 'sikhi-calendar.overrides.v1';
  const SCOPES = ['series', 'occurrence', 'custom'];

  // The website page has no edits of its own: build-web-page.js bakes the
  // app's exported layer in as SIKHI_BAKED_OVERRIDES, read-only.
  const BAKED = (typeof SIKHI_BAKED_OVERRIDES !== 'undefined') ? SIKHI_BAKED_OVERRIDES : null;

  let data = read();

  function read() {
    try {
      const raw = BAKED || JSON.parse(localStorage.getItem(KEY));
      return {
        series: (raw && raw.series) || {},
        occurrence: (raw && raw.occurrence) || {},
        custom: (raw && raw.custom && !Array.isArray(raw.custom)) ? raw.custom : {}
      };
    } catch (e) {
      return { series: {}, occurrence: {}, custom: {} };
    }
  }

  function persist() {
    if (!BAKED) try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
    rebuildIndex();
  }

  const live = p => (p && !p._deleted ? p : null);

  /* ------------------------------------------------------------------ keys */

  /* Built-in events are keyed by their permanent id. Anything saved before
     the ids existed is keyed by the English name the event had then; those
     keys are still honoured (read-time aliases, never rewritten in bulk), and
     the newest of all the keys for one event wins. Custom and personal
     entries have no id and keep their name as the key. */
  const idOf = x => (typeof SikhEvents !== 'undefined' && SikhEvents.idFor) ? SikhEvents.idFor(x) : null;
  const nameOf = x => String(typeof x === 'object' && x ? (x.en || x.pa || '') : (x || '')).trim();
  const seriesKey = x => idOf(x) || nameOf(x);
  const occKey = (iso, e) => iso + '|' + seriesKey(e);

  /** Every series key this event's edits may live under. */
  function seriesKeys(x) {
    const id = idOf(x);
    return id ? SikhEvents.aliases(id) : [nameOf(x)];
  }
  /** Every occurrence key for this event on this day — including the day SGPC
   *  printed it on, which is the date an older edit would have used. */
  function occKeys(iso, x) {
    const id = idOf(x);
    const days = [iso];
    const printed = id && SikhEvents.printedFor(id, iso);
    if (printed) days.push(printed);
    const out = [];
    days.forEach(d => seriesKeys(x).forEach(k => out.push(d + '|' + k)));
    return out;
  }
  /** The newest live patch among some keys. */
  function newest(store, keys) {
    let best = null;
    keys.forEach(k => {
      const p = live(store[k]);
      if (p && (!best || (p._ts || 0) > (best._ts || 0))) best = p;
    });
    return best;
  }
  /** Tombstone the alias keys of a key just written, so an old-name copy
   *  cannot resurface (or win) after this edit. */
  function retire(scope, keys, keep, ts) {
    keys.forEach(k => {
      if (k !== keep && live(data[scope][k])) data[scope][k] = { _deleted: true, _ts: ts };
    });
  }

  /* -------------------------------------------------- reverse index for moves
     A moved event has to disappear from its old date and appear on its new one,
     so the day lookup needs to answer "what was moved INTO this date?" cheaply.
  */

  let movedInto = {};

  function rebuildIndex() {
    movedInto = {};
    Object.keys(data.occurrence).forEach(k => {
      const o = data.occurrence[k];
      if (!o || !o.to) return;
      const parts = k.split('|');
      const fromIso = parts[0], en = parts.slice(1).join('|');
      (movedInto[o.to] = movedInto[o.to] || []).push({ fromIso: fromIso, en: en });
    });
  }
  rebuildIndex();

  /* --------------------------------------------------------------- querying */

  function series(e) { return newest(data.series, seriesKeys(e)); }
  function occurrence(iso, e) { return newest(data.occurrence, occKeys(iso, e)); }

  /** Is this event switched off on this date? */
  function isOff(e, iso) {
    const o = occurrence(iso, e);
    if (o && o.off) return true;
    const s = series(e);
    if (!s || !s.off) return false;
    // offFrom set: history is preserved, the future is hidden.
    if (s.offFrom) return iso >= s.offFrom;
    return true;
  }

  /**
   * Apply the layer to one day's built-in events.
   * @param list  events from SikhEvents.builtInFor
   * @param iso   the day, so occurrence rules can be found
   * @param lookup (fromIso, en) => event | null   to materialise moved entries
   */
  function apply(list, iso, lookup) {
    const out = [];

    list.forEach(e => {
      const occ = occurrence(iso, e);
      if (occ && occ.to && occ.to !== iso) return;   // moved away from today
      if (isOff(e, iso)) return;
      out.push(decorate(e, iso));
    });

    // Dates the sangat added that are not in the jantri at all.
    const ns = Cal.fromGregorian(Nanakshahi.parseIso(iso));
    customList().forEach(e => {
      if (!customOn(e, Nanakshahi.parseIso(iso), ns)) return;
      out.push(Object.assign({}, e, {
        id: 'cu-' + e.id, source: 'custom', edited: true,
        greg: Nanakshahi.parseIso(iso), ns: ns
      }));
    });

    // Anything moved onto this date from elsewhere.
    (movedInto[iso] || []).forEach(m => {
      const src = lookup && lookup(m.fromIso, m.en);
      if (!src) return;
      if (isOff(src, iso)) return;
      out.push(decorate(Object.assign({}, src, {
        greg: Nanakshahi.parseIso(iso),
        ns: Cal.fromGregorian(Nanakshahi.parseIso(iso))
      }), iso, m.fromIso));
    });

    return out;
  }

  /** Overlay renames and recategorisation, and mark the event as edited. */
  function decorate(e, iso, movedFrom) {
    const s = series(e);
    if (!s && !movedFrom) return e;
    const out = Object.assign({}, e);
    if (s) {
      if (s.en) out.en = s.en;
      if (s.pa) out.pa = s.pa;
      if (s.cat) out.cat = s.cat;
    }
    out.edited = true;
    if (movedFrom) out.movedFrom = movedFrom;
    return out;
  }

  /* ---------------------------------------------------------------- editing */

  /** Strip the keys that are back to default, so the layer stays minimal. */
  function tidy(next) {
    Object.keys(next).forEach(k => {
      if (k === '_ts' || k === '_deleted') return;
      if (next[k] === '' || next[k] == null || next[k] === false) delete next[k];
    });
    return next;
  }

  const meaningful = p => Object.keys(p).some(k => k !== '_ts' && k !== '_deleted');

  function write(scope, key, next) {
    next._ts = Date.now();
    if (meaningful(next)) {
      delete next._deleted;
      data[scope][key] = next;
    } else if (data[scope][key]) {
      // Was set, now cleared — a tombstone, so other devices learn about it.
      data[scope][key] = { _deleted: true, _ts: next._ts };
    } else {
      delete data[scope][key];
    }
    persist();
    return live(data[scope][key]);
  }

  /** @param key  an event, its id, or any name it has had */
  function setSeries(key, patch) {
    const k = seriesKey(key), keys = seriesKeys(key);
    const cur = newest(data.series, keys) || {};
    const next = tidy(Object.assign({}, cur, patch));
    retire('series', keys, k, Date.now());
    return write('series', k, next);
  }

  function setOccurrence(iso, e, patch) {
    const k = occKey(iso, e), keys = occKeys(iso, e);
    const cur = newest(data.occurrence, keys) || {};
    const next = tidy(Object.assign({}, cur, patch));
    if (next.to === iso) delete next.to;             // moved back to where it was
    retire('occurrence', keys, k, Date.now());
    return write('occurrence', k, next);
  }

  /* ------------------------------------------------------ custom purabs */

  function customList() {
    return Object.keys(data.custom)
      .map(id => live(data.custom[id]) && Object.assign({ id }, data.custom[id]))
      .filter(Boolean)
      .sort((a, b) => String(a.en || a.pa).localeCompare(String(b.en || b.pa)));
  }

  function saveCustom(entry) {
    const id = entry.id ||
      ('cu-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7));
    const clean = {
      en: String(entry.en || '').trim(),
      pa: String(entry.pa || '').trim(),
      cat: entry.cat || 'historic',
      note: String(entry.note || '').trim(),
      anchor: entry.anchor === 'gregorian' ? 'gregorian' : 'nanakshahi',
      repeat: entry.repeat === 'once' ? 'once' : 'yearly',
      major: !!entry.major
    };
    if (clean.anchor === 'gregorian') clean.iso = entry.iso || '';
    else { clean.m = Number(entry.m) || 1; clean.d = Number(entry.d) || 1;
           clean.nsYear = entry.nsYear ? Number(entry.nsYear) : null; }
    if (!clean.en && !clean.pa) return null;
    return write('custom', id, clean);
  }

  function deleteCustom(id) { write('custom', id, {}); }

  /** Does a custom entry land on this date? Mirrors the personal-event rule. */
  function customOn(e, g, ns) {
    if (e.anchor === 'gregorian') {
      if (!e.iso) return false;
      const src = Nanakshahi.parseIso(e.iso);
      if (e.repeat === 'yearly') {
        return src.getMonth() === g.getMonth() && src.getDate() === g.getDate();
      }
      return Nanakshahi.isoKey(src) === Nanakshahi.isoKey(g);
    }
    if (!e.m || !e.d) return false;
    if (e.m !== ns.month || e.d !== ns.day) return false;
    if (e.repeat === 'yearly') return true;
    return e.nsYear === ns.year;
  }

  function clearSeries(key) {
    retire('series', seriesKeys(key), seriesKey(key), Date.now());
    write('series', seriesKey(key), {});
  }
  function clearOccurrence(iso, e) {
    retire('occurrence', occKeys(iso, e), occKey(iso, e), Date.now());
    write('occurrence', occKey(iso, e), {});
  }

  function clearAll() {
    // Tombstone everything rather than dropping it, so the reset propagates.
    const ts = Date.now();
    SCOPES.forEach(scope => {
      Object.keys(data[scope]).forEach(k => { data[scope][k] = { _deleted: true, _ts: ts }; });
    });
    persist();
  }

  const count = () => SCOPES
    .reduce((n, scope) => n + Object.keys(data[scope]).filter(k => live(data[scope][k])).length, 0);

  /* ------------------------------------------------------------------ merge
     Per key, the later timestamp wins. Whole-document replacement would mean
     whichever device synced last silently erased the other's work.
     @returns { applied, skipped }
  */
  /* Every phone trusts what the server sends, so one bad row must not be able
     to break the calendar: unknown categories are dropped and text is capped. */
  const MAX_TEXT = 300;
  function clean(p) {
    const out = {};
    Object.keys(p).forEach(f => {
      const v = p[f];
      if (typeof v === 'string') out[f] = v.slice(0, MAX_TEXT);
      else if (typeof v === 'number' || typeof v === 'boolean' || v == null) out[f] = v;
    });
    const cats = (typeof SikhEvents !== 'undefined' && SikhEvents.CATEGORIES) || null;
    if (out.cat && cats && !cats[out.cat]) delete out.cat;
    return out;
  }

  function merge(remote) {
    let applied = 0, skipped = 0;
    SCOPES.forEach(scope => {
      const incoming = (remote && remote[scope]) || {};
      Object.keys(incoming).forEach(k => {
        const theirs = incoming[k], mine = data[scope][k];
        if (!theirs || typeof theirs._ts !== 'number') { skipped++; return; }
        if (mine && Number(mine._ts || 0) >= theirs._ts) { skipped++; return; }
        if (k.length > 400) { skipped++; return; }
        data[scope][k] = clean(theirs);
        applied++;
      });
    });
    if (applied) persist();
    return { applied, skipped };
  }

  /** Keys changed since a timestamp — what this device still owes the server. */
  function changedSince(ts) {
    const out = { series: {}, occurrence: {}, custom: {} };
    let n = 0;
    SCOPES.forEach(scope => {
      Object.keys(data[scope]).forEach(k => {
        const p = data[scope][k];
        if (Number(p._ts || 0) > Number(ts || 0)) { out[scope][k] = p; n++; }
      });
    });
    out.count = n;
    return out;
  }

  /** The newest timestamp this device holds. */
  function latestTs() {
    let max = 0;
    SCOPES.forEach(scope => {
      Object.keys(data[scope]).forEach(k => {
        max = Math.max(max, Number(data[scope][k]._ts || 0));
      });
    });
    return max;
  }

  function all() { return JSON.parse(JSON.stringify(data)); }

  /* ------------------------------------------------------- export / import */

  function exportJson() {
    return JSON.stringify({
      app: 'Sikhi Calendar',
      kind: 'overrides',
      exported: new Date().toISOString(),
      base: { engine: Sky.ENGINE_V, rules: SikhEvents.EVENTS.length },
      overrides: data
    }, null, 2);
  }

  function importJson(text) {
    const parsed = JSON.parse(text);
    const o = parsed.overrides || parsed;
    if (!o || typeof o !== 'object') throw new Error('Not an overrides file.');
    data = {
      series: o.series || {},
      occurrence: o.occurrence || {},
      custom: o.custom || []
    };
    persist();
    return count();
  }

  /**
   * A human-readable summary, for the export file and the UI. This is what you
   * would hand to whoever maintains the TSVs so the edits can be folded into
   * the source properly.
   */
  function report() {
    const lines = [];
    Object.keys(data.series).sort().forEach(k => {
      const s = live(data.series[k]);
      if (!s) return;
      const bits = [];
      if (s.en) bits.push('renamed to "' + s.en + '"');
      if (s.pa) bits.push('Gurmukhi changed');
      if (s.cat) bits.push('category -> ' + s.cat);
      if (s.off) bits.push(s.offFrom ? 'off from ' + s.offFrom : 'off entirely');
      lines.push('SERIES  ' + k + ' — ' + bits.join(', '));
    });
    customList().forEach(e => {
      lines.push('ADDED   ' + (e.en || e.pa) + ' — ' +
        (e.anchor === 'gregorian' ? e.iso : e.d + '/' + e.m + ' Nanakshahi') +
        (e.repeat === 'yearly' ? ', every year' : ''));
    });
    Object.keys(data.occurrence).sort().forEach(k => {
      const o = live(data.occurrence[k]);
      if (!o) return;
      const bits = [];
      if (o.to) bits.push('moved to ' + o.to);
      if (o.off) bits.push('hidden');
      lines.push('DATE    ' + k + ' — ' + bits.join(', '));
    });
    return lines;
  }

  return {
    seriesKey, occKey, series, occurrence, isOff, apply,
    setSeries, setOccurrence, clearSeries, clearOccurrence, clearAll,
    customList, saveCustom, deleteCustom, customOn,
    count, all, exportJson, importJson, report,
    merge, changedSince, latestTs
  };
})();
</script>
<script>/* ============================================================================
   page.js — the website page's own view layer
   ----------------------------------------------------------------------------
   Public-facing and read-only: today, what's coming, this month, the year.
   No personal events, no reminders, no settings — those belong to the app.
   It reuses the same engines and the same verified data, so the dates here can
   never drift from the ones in the app.
   ========================================================================= */

(function () {
  'use strict';

  var $ = function (s) { return document.getElementById(s); };
  var esc = function (t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  };

  var today = function () { return Cal.midnight(new Date()); };
  var cursor = today();

  var HUE = { prakash: 'gold', gurgaddi: 'clay', jotijot: 'plum',
              shaheedi: 'crimson', festival: 'saffron', historic: 'forest',
              janamdin: 'green', mela: 'saffron', modern: 'stone',
              moon: 'stone', sangrand: 'gold' };
  var hue = function (c) { return HUE[c] || 'stone'; };

  /* Same as the app: the calculated dates, with the baked-in edits on top. */
  function dayEvents(g) {
    var ns = Cal.fromGregorian(g), iso = Cal.isoKey(g);
    return Overrides.apply(SikhEvents.builtInFor(g, ns), iso,
      function (fromIso, key) { return SikhEvents.findOn(fromIso, key); }).sort(function (a, b) {
      var w = { sangrand: 0, prakash: 1, gurgaddi: 2, jotijot: 3, shaheedi: 4,
                festival: 5, historic: 6, janamdin: 7, mela: 8, modern: 9,
                moon: 11 };
      var oa = w[a.cat] == null ? 10 : w[a.cat];
      var ob = w[b.cat] == null ? 10 : w[b.cat];
      if (oa !== ob) return oa - ob;
      return (b.major ? 1 : 0) - (a.major ? 1 : 0);
    });
  }

  /* -------------------------------------------------------------- today ---- */

  function renderToday() {
    var t = today(), ns = Cal.fromGregorian(t), sg = Cal.nextSangrand(t);
    var g = Cal.gurmukhiNumber;
    $('sbToday').innerHTML =
      '<div class="sbcal__todayrow">' +
        '<div class="sbcal__bigday" lang="pa">' + esc(g(ns.day)) + '</div>' +
        '<div class="sbcal__todaystack">' +
          '<div class="sbcal__dow">' + esc(Cal.WEEKDAYS[ns.weekday].en) + ' · Today</div>' +
          '<div class="sbcal__nsdate" lang="pa">' + esc(ns.monthMeta.pa) + ' ' + esc(g(ns.year)) + '</div>' +
          '<div class="sbcal__gdate">' + esc(Cal.gregLong(t)) +
            ' <span style="color:var(--ink-3)">· ' + esc(ns.day + ' ' + ns.monthMeta.en + ' ' + ns.year) + '</span></div>' +
        '</div>' +
        '<div class="sbcal__facts">' +
          fact('Nanakshahi', g(ns.year), 'Samvat') +
          fact('Khalsa', g(ns.khalsaYear), 'Samvat') +
          fact('Next sangrand', '<span lang="pa">' + esc(sg.monthMeta.pa) + '</span>',
               sg.inDays === 0 ? 'today' : 'in ' + sg.inDays + ' days') +
        '</div>' +
      '</div>';
  }

  function fact(k, v, s) {
    return '<div><div class="sbcal__fk">' + esc(k) + '</div>' +
           '<div class="sbcal__fv">' + v +
           (s ? ' <small>' + esc(s) + '</small>' : '') + '</div></div>';
  }

  /* ------------------------------------------------------------ upcoming --- */

  function renderUp() {
    var t = today(), out = [], i, g, ns;
    for (i = 0; i < 400 && out.length < 10; i++) {
      g = Cal.addDays(t, i);
      if (!SikhEvents.covered(g)) break;
      ns = Cal.fromGregorian(g);
      dayEvents(g).forEach(function (e) {
        if (out.length >= 10) return;
        if (e.cat === 'moon') return;
        if (!e.major && e.cat !== 'sangrand') return;
        out.push({ e: e, g: g, ns: ns, days: i });
      });
    }
    $('sbUp').innerHTML = out.map(function (u) {
      return '<div class="sbcal__uprow">' +
        '<div class="sbcal__upns h-' + hue(u.e.cat) + '" lang="pa">' +
          esc(Cal.gurmukhiNumber(u.ns.day)) +
          '<b>' + esc(u.ns.monthMeta.pa) + '</b></div>' +
        '<div class="sbcal__upg">' + esc(Cal.gregShort(u.g)) + '</div>' +
        '<div class="sbcal__upn"><div class="sbcal__upt" lang="pa">' + esc(u.e.pa || u.e.en) +
          (u.e.en && u.e.en !== u.e.pa ? '<span lang="en">' + esc(u.e.en) + '</span>' : '') +
          (u.e.sgpcPrinted ? '<span lang="en" style="color:var(--ink-3)">SGPC prints ' +
            esc(Cal.gregShort(Cal.parseIso(u.e.sgpcPrinted))) + '</span>' : '') +
        '</div></div>' +
        '<div class="sbcal__in">' + (u.days === 0 ? '<strong>Today</strong>'
          : '<strong>' + u.days + '</strong> ' + (u.days === 1 ? 'day' : 'days')) + '</div>' +
      '</div>';
    }).join('');
  }

  /* --------------------------------------------------------------- month --- */

  function renderMonth() {
    var ns = Cal.fromGregorian(cursor);
    var cells = Cal.monthGrid(ns.year, ns.month, 1);
    var t = today(), g = Cal.gurmukhiNumber;

    $('sbMonthTitle').innerHTML =
      '<span lang="pa">' + esc(ns.monthMeta.pa) + ' ' + esc(g(ns.year)) + '</span>' +
      '<em lang="en">' + esc(ns.monthMeta.en) + ' · ' + esc(Cal.monthSpan(ns.year, ns.month)) + '</em>';

    $('sbDows').innerHTML = [0,1,2,3,4,5,6].map(function (i) {
      return '<div class="sbcal__dow2">' + esc(Cal.WEEKDAYS[(i + 1) % 7].short_en) + '</div>';
    }).join('');

    $('sbGrid').innerHTML = cells.map(function (c) {
      var evs = dayEvents(c.greg);
      var moon = evs.filter(function (e) { return e.cat === 'moon'; })[0];
      var rest = evs.filter(function (e) { return e.cat !== 'moon'; });
      var cls = ['sbcal__cell'];
      if (!c.inMonth) cls.push('sbcal__cell--out');
      if (Cal.isoKey(c.greg) === Cal.isoKey(t)) cls.push('sbcal__cell--today');
      if (c.ns.day === 1) cls.push('sbcal__cell--sang');

      return '<div class="' + cls.join(' ') + '">' +
        '<div class="sbcal__ctop">' +
          '<span class="sbcal__cn" lang="pa">' + esc(g(c.ns.day)) + '</span>' +
          '<span class="sbcal__cg">' + c.greg.getDate() + ' ' +
            esc(Cal.G_MONTHS_SHORT[c.greg.getMonth()]) + '</span>' +
          (moon ? '<span class="sbcal__moon" title="' + esc(moon.en) + '">' +
                  (moon.en === 'Masya' ? '●' : '○') + '</span>' : '') +
        '</div>' +
        '<div class="sbcal__chips">' + rest.slice(0, 2).map(function (e) {
          return '<span class="sbcal__chip h-' + hue(e.cat) + '" lang="pa" title="' +
                 esc(e.en) + '">' + esc(e.pa || e.en) + '</span>';
        }).join('') + '</div>' +
        (rest.length > 2 ? '<div class="sbcal__more">+' + (rest.length - 2) + ' more</div>' : '') +
      '</div>';
    }).join('');
  }

  /* ---------------------------------------------------------------- year --- */

  function renderYear() {
    var ns = Cal.fromGregorian(cursor);
    var g = Cal.gurmukhiNumber;
    $('sbYearTitle').innerHTML =
      '<span lang="pa">ਸੰਮਤ ' + esc(g(ns.year)) + '</span>' +
      '<em lang="en">Nanakshahi Samvat ' + ns.year + ' · Khalsa ' + ns.khalsaYear + '</em>';

    $('sbYear').innerHTML = Cal.MONTHS.map(function (meta) {
      var m = meta.n, len = Cal.monthLength(ns.year, m), rows = [], d, gg;
      for (d = 1; d <= len; d++) {
        gg = Cal.toGregorian(ns.year, m, d);
        dayEvents(gg).forEach(function (e) {
          if (e.cat === 'moon' || e.cat === 'sangrand') return;
          if (!e.major) return;
          rows.push({ e: e, g: gg, d: d });
        });
      }
      return '<section class="sbcal__ym">' +
        '<div class="sbcal__ymh">' +
          '<div class="sbcal__ymt" lang="pa">' + esc(meta.pa) +
            '<em lang="en">' + esc(meta.en) + '</em></div>' +
          '<div class="sbcal__yms">' + esc(Cal.monthSpan(ns.year, m)) + '</div>' +
        '</div>' +
        (rows.length ? rows.map(function (r) {
          return '<div class="sbcal__ymrow">' +
            '<span class="sbcal__ymns h-' + hue(r.e.cat) + '" lang="pa">' + esc(g(r.d)) + '</span>' +
            '<span class="sbcal__ymg">' + r.g.getDate() + ' ' +
              esc(Cal.G_MONTHS_SHORT[r.g.getMonth()]) + '</span>' +
            '<span class="sbcal__ymn" lang="pa">' + esc(r.e.pa || r.e.en) +
              (r.e.en ? '<span lang="en">' + esc(r.e.en) + '</span>' : '') + '</span>' +
          '</div>';
        }).join('') : '<div class="sbcal__ymrow" style="color:var(--ink-3)">' +
                      '<span></span><span></span><span>—</span></div>') +
      '</section>';
    }).join('');
  }

  /* -------------------------------------------------------------- colophon */

  function renderNote() {
    $('sbNote').innerHTML =
      '<p><strong>Where these dates come from.</strong> Every date is worked out ' +
      'from the Sun and Moon by the jantri\'s own rules: the months are Bikrami ' +
      'solar, opening at each sangrand, and the gurpurabs follow the tithi at ' +
      'sunrise at Sri Harmandir Sahib, Amritsar. The rules are checked against ' +
      'every date the SGPC jantri printed from ' +
      esc(Cal.gregLong(Cal.parseIso(SikhRules.PRINTED_FROM))) + ' to ' +
      esc(Cal.gregLong(Cal.parseIso(SikhRules.PRINTED_TO))) + '. Where SGPC printed ' +
      'a different day, it is shown as \u201cSGPC prints\u201d.</p>' +
      '<p><strong>Covered:</strong> ' + Sky.MIN_YEAR + ' to ' + Sky.MAX_YEAR +
      '. Nothing needs adding each year.</p>' +
      '<p style="color:var(--ink-3);font-size:13.5px">Panjabi dates are given ' +
      'first throughout, with the English date beneath. ● masya · ○ puranmashi ' +
      '· the gold edge marks a sangrand.</p>';
  }

  /* -------------------------------------------------------------- wiring --- */

  function step(n) {
    var ns = Cal.fromGregorian(cursor);
    var nx = Cal.shiftMonth(ns.year, ns.month, n);
    cursor = Cal.monthStart(nx.year, nx.month);
    renderMonth(); renderYear();
  }

  $('sbPrev').addEventListener('click', function () { step(-1); });
  $('sbNext').addEventListener('click', function () { step(1); });
  $('sbThis').addEventListener('click', function () {
    cursor = today(); renderMonth(); renderYear();
  });

  var fails = Cal.selfTest();
  if (fails.length) console.error('Sikhi Calendar self-test failed:\n' + fails.join('\n'));

  renderToday(); renderUp(); renderMonth(); renderYear(); renderNote();
})();
</script>
