own artist, 19th century, public domain, via Wikimedia Commons","alt":"Drawing: the shaheedi of Bhai Taru Singh Ji."}]},"miri-piri-divas":{"about":{"en":"Miri Piri Divas remembers Sri Guru Hargobind Ji putting on two swords, of miri and piri, when they took the Gurgaddi at Sri Amritsar Sahib in 1663 Bikrami (1606 CE).","pa":"ਮੀਰੀ ਪੀਰੀ ਦਿਵਸ ਉਸ ਸਮੇਂ ਦੀ ਯਾਦ ਹੈ ਜਦੋਂ ਸ੍ਰੀ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਜੀ ਨੇ ਸੰਮਤ ੧੬੬੩ ਬਿਕ੍ਰਮੀ (੧੬੦੬ ਈ.) ਵਿੱਚ ਸ੍ਰੀ ਅੰਮ੍ਰਿਤਸਰ ਸਾਹਿਬ ਵਿਖੇ ਗੁਰਗੱਦੀ ਸਮੇਂ ਮੀਰੀ ਅਤੇ ਪੀਰੀ ਦੀਆਂ ਦੋ ਤਲਵਾਰਾਂ ਪਹਿਨੀਆਂ।"},"pankti":{"gurmukhi":"ਪੰਜਿ ਪਿਆਲੇ ਪੰਜ ਪੀਰ ਛਠਮੁ ਪੀਰੁ ਬੈਠਾ ਗੁਰੁ ਭਾਰੀ।","ref":"Vaar 1, Pauri 48 · Bhai Gurdas Ji"},"images":[{"file":"akal-takht-sahib-nishan-sahibs--2007--jasleen-kaur.jpg","credit":"Jasleen Kaur, CC BY-SA 2.0, via Wikimedia Commons","alt":"Sri Akal Takht Sahib with the two Nishan Sahibs of miri and piri."},{"file":"guru-hargobind-sahib-ji-with-hawk--mid-17th-century--sursinghwala-collection.jpg","credit":"Sursinghwala collection, mid-17th century, public domain, via Wikimedia Commons","alt":"Sri Guru Hargobind Sahib Ji holding a bird of prey."},{"file":"guru-hargobind-sahib-ji-on-horseback--mid-17th-century--unknown.jpg","credit":"Unknown artist, mid-17th century, public domain, via Wikimedia Commons","alt":"Early portrait of Sri Guru Hargobind Sahib Ji on horseback."},{"file":"guru-hargobind-sahib-ji-on-akal-bunga-mural-baba-atal--19th-century--naqqash.jpg","credit":"Naqqash painters, Gurdwara Baba Atal Rai, Amritsar, 19th century, public domain, via Wikimedia Commons","alt":"Mural of Sri Guru Hargobind Sahib Ji seated on the original Akal Bunga, captioned Sri Akal Takht in Gurmukhi."}]},"shaheedi-divas-s-udham-singh-ji":{"about":{"en":"Sardar Udham Singh Ji of Sunam, who had been at Jallianwala Bagh in 1919, shot Sir Michael O'Dwyer in London and was hanged at Pentonville Prison in 1940.","pa":"ਸੁਨਾਮ ਦੇ ਸਰਦਾਰ ਊਧਮ ਸਿੰਘ ਜੀ, ਜੋ ੧੯੧੯ ਵਿੱਚ ਜਲ੍ਹਿਆਂਵਾਲੇ ਬਾਗ਼ ਵਿੱਚ ਹਾਜ਼ਰ ਸਨ, ਨੇ ਲੰਡਨ ਵਿੱਚ ਸਰ ਮਾਈਕਲ ਓਡਵਾਇਰ ਨੂੰ ਗੋਲੀ ਮਾਰੀ; ੧੯੪੦ ਈ. ਵਿੱਚ ਉਨ੍ਹਾਂ ਨੂੰ ਪੈਂਟਨਵਿਲ ਜੇਲ੍ਹ ਵਿੱਚ ਫਾਂਸੀ ਦਿੱਤੀ ਗਈ।"},"pankti":{"gurmukhi":"ਜਿਨ ਨਿਰਭਉ ਜਿਨ ਹਰਿ ਨਿਰਭਉ ਧਿਆਇਆ ਜੀ ਤਿਨ ਕਾ ਭਉ ਸਭੁ ਗਵਾਸੀ ॥","ref":"Ang 11 · So Purakh · Sri Guru Ram Das Ji"},"images":[{"file":"jallianwala-bagh-udham-singh-statue--2018--bernard-gagnon.jpg","credit":"Bernard Gagnon, CC BY-SA 4.0, via Wikimedia Commons","alt":"Jallianwala Bagh, Amritsar: the entrance wall with the statue of Shaheed Udham Singh."},{"file":"s-udham-singh--before-1940--punjab-state-archives.jpg","credit":"Punjab State Archives, public domain, via Wikimedia Commons","alt":"Portrait photograph of S. Udham Singh."}]},"prakash-gurpurab-sri-guru-har-krishan-ji":{"about":{"en":"Sri Guru Har Krishan Ji took Prakash at Kiratpur Sahib on Sawan vadi 9, 1713 Bikrami (1656 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਹਰਿ ਕ੍ਰਿਸ਼ਨ ਜੀ ਨੇ ਸਾਵਣ ਵਦੀ ਨੌਵੀਂ, ਸੰਮਤ ੧੭੧੩ ਬਿਕ੍ਰਮੀ (੧੬੫੬ ਈ.) ਨੂੰ ਕੀਰਤਪੁਰ ਸਾਹਿਬ ਵਿਖੇ ਪ੍ਰਕਾਸ਼ ਧਾਰਿਆ।"},"pankti":{"gurmukhi":"ਸ੍ਰੀ ਹਰਿਕ੍ਰਿਸ਼ਨ ਧਿਆਈਐ ਜਿਸੁ ਡਿਠੇ ਸਭਿ ਦੁਖਿ ਜਾਇ ॥","ref":"Sri Dasam Granth Sahib · Chandi di Vaar, Pauri 1 · Sri Guru Gobind Singh Ji"},"darshan":{"label":"ਅਵਤਾਰ ਧਾਰਨ","text":"੧੭੧੩ ਬਿਕ੍ਰਮੀ ਸਾਵਣ ਵਦੀ ਨੌਵੀਂ","page":"੨੦","source":"Gurbani Paath Darshan p.੨੦"},"images":[{"file":"guru-har-krishan-ji--c1800-1840--royal-collection--scene.jpg","credit":"Royal Collection Trust, RCIN 925209 · c. 1800–1840 · detail","alt":"Sri Guru Har Krishan Ji, seated on a terrace with a rababi and an attendant; Gurmukhi name panel across the head"},{"file":"guru-har-krishan-sahib-ji-numbered-8--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Har Krishan Sahib Ji, numbered ੮ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-har-krishan-sahib-ji-with-sangat--c1875-1900--unknown.jpg","credit":"Pahari, c. 1875–1900, public domain, via Wikimedia Commons","alt":"Sri Guru Har Krishan Sahib Ji seated in darbar with Sikhs."}]},"morcha-guru-ka-bagh":{"about":{"en":"The Morcha at Guru ka Bagh began in 1922 at Ghukewali, district Amritsar, when Sikhs cutting firewood for the langar were arrested; jathas then came daily and were beaten without striking back.","pa":"ਗੁਰੂ ਕੇ ਬਾਗ਼ ਦਾ ਮੋਰਚਾ ੧੯੨੨ ਈ. ਵਿੱਚ ਪਿੰਡ ਘੁੱਕੇਵਾਲੀ, ਜ਼ਿਲ੍ਹਾ ਅੰਮ੍ਰਿਤਸਰ ਵਿਖੇ ਲੰਗਰ ਲਈ ਲੱਕੜਾਂ ਕੱਟਦੇ ਸਿੰਘਾਂ ਦੀ ਗ੍ਰਿਫ਼ਤਾਰੀ ਨਾਲ ਸ਼ੁਰੂ ਹੋਇਆ; ਫਿਰ ਰੋਜ਼ ਜਥੇ ਆਉਂਦੇ ਅਤੇ ਬਿਨਾਂ ਹੱਥ ਚੁੱਕੇ ਮਾਰ ਸਹਿੰਦੇ ਰਹੇ।"},"pankti":{"gurmukhi":"ਫਰੀਦਾ ਬੁਰੇ ਦਾ ਭਲਾ ਕਰਿ ਗੁਸਾ ਮਨਿ ਨ ਹਢਾਇ ॥","ref":"Ang 1381 · Salok Farid Ji · Bhagat Sheikh Farid Ji"},"images":[{"file":"gurdwara-guru-ka-bagh--2010--jiwanjot.jpg","credit":"Jiwanjot / Jjsingh1981, public domain, via Wikimedia Commons","alt":"Gurdwara Sri Guru Ka Bagh (Ghukewali), Amritsar."},{"file":"guru-ka-bagh-morcha-marchers--1922--al-verges.jpg","credit":"A. L. Verges, 1922; scan Panjab Digital Library, public domain, via Wikimedia Commons","alt":"Photograph of Akali marchers during Morcha Guru Ka Bagh, 1922."}]},"jor-mela-baba-bakala":{"about":{"en":"The Jor Mela at Baba Bakala (Rakhar Puniya) remembers 1664, when Bhai Makhan Shah Lubana found Sri Guru Tegh Bahadur Sahib Ji there and called out \"Guru ladho re\".","pa":"ਬਾਬਾ ਬਕਾਲਾ ਦਾ ਜੋੜ ਮੇਲਾ (ਰੱਖੜ ਪੁੰਨਿਆ) ੧੬੬੪ ਈ. ਦੀ ਯਾਦ ਹੈ, ਜਦੋਂ ਭਾਈ ਮੱਖਣ ਸ਼ਾਹ ਲੁਬਾਣੇ ਨੇ ਇੱਥੇ ਸ੍ਰੀ ਗੁਰੂ ਤੇਗ਼ ਬਹਾਦਰ ਸਾਹਿਬ ਜੀ ਨੂੰ ਲੱਭ ਕੇ \"ਗੁਰੂ ਲਾਧੋ ਰੇ\" ਪੁਕਾਰਿਆ।"},"pankti":{"gurmukhi":"ਜੋ ਨਰੁ ਦੁਖ ਮੈ ਦੁਖੁ ਨਹੀ ਮਾਨੈ ॥ ਸੁਖ ਸਨੇਹੁ ਅਰੁ ਭੈ ਨਹੀ ਜਾ ਕੈ ਕੰਚਨ ਮਾਟੀ ਮਾਨੈ ॥੧॥ ਰਹਾਉ ॥","ref":"Ang 633 · Raag Sorath · Sri Guru Tegh Bahadur Sahib Ji"},"images":[{"file":"gurdwara-baba-bakala-sahib--2016--savraj.jpg","credit":"Savraj, CC BY-SA 4.0, via Wikimedia Commons","alt":"Gurdwara Baba Bakala Sahib, with its Nishan Sahib and tower. Cropped at the left foot to remove a passer-by."},{"file":"bhai-makhan-shah-lubana-ji-and-guru-tegh-bahadur-sahib-ji-gilded-panel--19th-century--harmandir-sahib.jpg","credit":"Gilded panel, Sri Harmandir Sahib, 19th century, public domain, via Wikimedia Commons","alt":"Gilded copper panel: Bhai Makhan Shah Lubana Ji finding Sri Guru Tegh Bahadur Sahib Ji at Bakala."}]},"sampuranta-divas-sri-guru-granth-sahib-ji":{"about":{"en":"At Sri Damdama Sahib (Talwandi Sabo), Sri Guru Gobind Singh Ji had the bir completed with the bani of Sri Guru Tegh Bahadur Sahib Ji added, Bhai Mani Singh Ji writing.","pa":"ਸ੍ਰੀ ਦਮਦਮਾ ਸਾਹਿਬ (ਤਲਵੰਡੀ ਸਾਬੋ) ਵਿਖੇ ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੇ ਸ੍ਰੀ ਗੁਰੂ ਤੇਗ਼ ਬਹਾਦਰ ਸਾਹਿਬ ਜੀ ਦੀ ਬਾਣੀ ਦਰਜ ਕਰਵਾ ਕੇ ਬੀੜ ਸੰਪੂਰਨ ਕਰਵਾਈ; ਲਿਖਾਰੀ ਭਾਈ ਮਨੀ ਸਿੰਘ ਜੀ ਸਨ।"},"pankti":{"gurmukhi":"ਥਾਲ ਵਿਚਿ ਤਿੰਨਿ ਵਸਤੂ ਪਈਓ ਸਤੁ ਸੰਤੋਖੁ ਵੀਚਾਰੋ ॥","ref":"Ang 1429 · Mundavani · Sri Guru Arjan Dev Ji"},"images":[{"file":"gurdwara-ramsar-sahib-amritsar--2009--diego-delso.jpg","credit":"Diego Delso, delso.photo, License CC BY-SA 4.0 (as the photographer asks), via Wikimedia Commons","alt":"Gurdwara Ramsar Sahib, Amritsar, where Sri Guru Arjan Dev Ji compiled the Adi Granth."},{"file":"harmandir-sahib--c1858--felice-beato-wellcome-collection.jpg","credit":"Felice Beato, c. 1858; Wellcome Collection (569626i) · public domain","alt":"Photograph of Sri Harmandir Sahib across the sarovar, c. 1858."}]},"pehla-prakash-gurpurab-sri-guru-granth-sahib-ji":{"about":{"en":"Sri Guru Arjan Dev Ji installed the Pothi Sahib they had compiled in Sri Harmandir Sahib on Bhadon sudi 1, 1661 Bikrami (1604 CE), with Baba Buddha Ji as the first granthi.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੇ ਆਪਣੀ ਤਿਆਰ ਕੀਤੀ ਬੀੜ ਦਾ ਭਾਦੋਂ ਸੁਦੀ ਏਕਮ, ਸੰਮਤ ੧੬੬੧ ਬਿਕ੍ਰਮੀ (੧੬੦੪ ਈ.) ਨੂੰ ਸ੍ਰੀ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਵਿੱਚ ਪ੍ਰਕਾਸ਼ ਕੀਤਾ ਅਤੇ ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਨੂੰ ਪਹਿਲੇ ਗ੍ਰੰਥੀ ਥਾਪਿਆ।"},"pankti":{"gurmukhi":"ਪੋਥੀ ਪਰਮੇਸਰ ਕਾ ਥਾਨੁ ॥ ਸਾਧਸੰਗਿ ਗਾਵਹਿ ਗੁਣ ਗੋਬਿੰਦ ਪੂਰਨ ਬ੍ਰਹਮ ਗਿਆਨੁ ॥੧॥ ਰਹਾਉ ॥","ref":"Ang 1226 · Raag Sarang · Sri Guru Arjan Dev Ji"},"darshan":{"label":"ਪਹਿਲਾ ਪ੍ਰਕਾਸ਼","text":"੧੬੬੧ ਬਿ: ਭਾਦਰੋਂ ਸੁਦੀ ਏਕਮ","page":"੧੭","source":"Gurbani Paath Darshan p.੧੭"},"images":[{"file":"harmandir-sahib-night--2018--marsmux.jpg","credit":"Marsmux, CC BY-SA 4.0, via Wikimedia Commons","alt":"Sri Harmandir Sahib lit at night, reflected in the sarovar."},{"file":"harmandir-sahib-causeway--c1870s--william-henry-baker.jpg","credit":"William Henry Baker, c. 1870s, public domain, via Wikimedia Commons","alt":"Photograph of the causeway leading to Sri Harmandir Sahib, sangat along the railings."},{"file":"harmandir-sahib-lithograph--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (26054i), coloured lithograph · public domain","alt":"Coloured lithograph of Sri Harmandir Sahib in its sarovar, with a Gurmukhi title."}]},"gurgaddi-divas-sri-guru-arjan-dev-ji":{"about":{"en":"Sri Guru Ram Das Ji gave the Gurgaddi to Sri Guru Arjan Dev Ji on Bhadon sudi 2, 1638 Bikrami (1581 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਰਾਮ ਦਾਸ ਜੀ ਨੇ ਭਾਦੋਂ ਸੁਦੀ ਦੂਜ, ਸੰਮਤ ੧੬੩੮ ਬਿਕ੍ਰਮੀ (੧੫੮੧ ਈ.) ਨੂੰ ਗੁਰਗੱਦੀ ਸ੍ਰੀ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੂੰ ਬਖ਼ਸ਼ੀ।"},"pankti":{"gurmukhi":"ਤਖਤਿ ਬੈਠਾ ਅਰਜਨ ਗੁਰੂ ਸਤਿਗੁਰ ਕਾ ਖਿਵੈ ਚੰਦੋਆ ॥","ref":"Ang 968 · Ramkali ki Vaar · Rai Balvand Ji & Bhai Satta Ji"},"darshan":{"label":"ਗੁਰ ਗੱਦੀ","text":"੧੬੩੮ ਬਿ: ਭਾਦਰੋਂ ਸੁਦੀ ਦੂਜ","page":"੧੭","source":"Gurbani Paath Darshan p.੧੭"},"images":[{"file":"guru-arjan-dev-ji--c1800-1840--royal-collection--scene.jpg","credit":"Royal Collection Trust, RCIN 925206 · c. 1800–1840 · detail","alt":"Sri Guru Arjan Dev Ji, seated on a terrace with a rababi and an attendant; Gurmukhi name panel across the head"},{"file":"guru-arjan-dev-ji-numbered-5--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Arjan Dev Ji, numbered ੫ in the IntrinsikhArts series of the ten Guru Sahiban."}]},"jyoti-jyot-sri-guru-ram-das-ji":{"about":{"en":"Sri Guru Ram Das Ji were Jyoti Jyot at Goindwal Sahib on Bhadon sudi 3, 1638 Bikrami (1581 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਰਾਮ ਦਾਸ ਜੀ ਭਾਦੋਂ ਸੁਦੀ ਤੀਜ, ਸੰਮਤ ੧੬੩੮ ਬਿਕ੍ਰਮੀ (੧੫੮੧ ਈ.) ਨੂੰ ਗੋਇੰਦਵਾਲ ਸਾਹਿਬ ਵਿਖੇ ਜੋਤੀ ਜੋਤਿ ਸਮਾਏ।"},"pankti":{"gurmukhi":"ਗੁਰ ਸਤਿਗੁਰ ਕਾ ਜੋ ਸਿਖੁ ਅਖਾਏ ਸੁ ਭਲਕੇ ਉਠਿ ਹਰਿ ਨਾਮੁ ਧਿਆਵੈ ॥","ref":"Ang 305 · Gauri ki Vaar · Sri Guru Ram Das Ji"},"darshan":{"label":"ਜੋਤੀ ਜੋਤਿ ਸਮਾਉਣਾ","text":"੧੬੩੮ ਬਿ: ਭਾਦਰੋਂ ਸੁਦੀ ਤੀਜ","page":"੧੬","source":"Gurbani Paath Darshan p.੧੬"},"images":[{"file":"guru-ram-das-ji--c1800-1840--royal-collection--scene.jpg","credit":"Royal Collection Trust, RCIN 925205 · c. 1800–1840 · detail","alt":"Sri Guru Ram Das Ji, seated on a terrace with a rababi and an attendant; Gurmukhi name panel across the head"},{"file":"guru-ram-das-ji-numbered-4--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Ram Das Ji, numbered ੪ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-ram-das-ji--c1800--nainsukh-family.jpg","credit":"Family workshop of Nainsukh of Guler, c. 1800, public domain, via Wikimedia Commons","alt":"Sri Guru Ram Das Ji seated against a bolster, an attendant with a chaur."}]},"jor-mela-gurdwara-kandh-sahib-batala":{"about":{"en":"The Jor Mela at Gurdwara Kandh Sahib, Batala, is held on the day of the Viah Purab of Sri Guru Nanak Dev Ji and Mata Sulakhni Ji, who were married at Batala.","pa":"ਗੁਰਦੁਆਰਾ ਕੰਧ ਸਾਹਿਬ, ਬਟਾਲਾ ਦਾ ਜੋੜ ਮੇਲਾ ਸ੍ਰੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅਤੇ ਮਾਤਾ ਸੁਲੱਖਣੀ ਜੀ ਦੇ ਵਿਆਹ ਪੁਰਬ ਵਾਲੇ ਦਿਨ ਹੁੰਦਾ ਹੈ; ਇਹ ਵਿਆਹ ਬਟਾਲੇ ਹੋਇਆ।"},"pankti":{"gurmukhi":"ਵੀਆਹੁ ਹੋਆ ਮੇਰੇ ਬਾਬੁਲਾ ਗੁਰਮੁਖੇ ਹਰਿ ਪਾਇਆ ॥","ref":"Ang 78 · Sri Raag · Sri Guru Ram Das Ji"},"image":{"file":"gurdwara-kandh-sahib-batala--2014--vipsachinverma.jpg","credit":"Vipsachinverma, CC BY-SA 3.0, via Wikimedia Commons","alt":"The gateway of Gurdwara Sri Kandh Sahib, Batala, with its Gurmukhi name board."}},"gurgaddi-divas-sri-guru-ram-das-ji":{"about":{"en":"Sri Guru Amar Das Ji gave the Gurgaddi to Sri Guru Ram Das Ji at Goindwal Sahib on Bhadon sudi 13, 1631 Bikrami (1574 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਅਮਰ ਦਾਸ ਜੀ ਨੇ ਭਾਦੋਂ ਸੁਦੀ ਤੇਰਸ, ਸੰਮਤ ੧੬੩੧ ਬਿਕ੍ਰਮੀ (੧੫੭੪ ਈ.) ਨੂੰ ਗੋਇੰਦਵਾਲ ਸਾਹਿਬ ਵਿਖੇ ਗੁਰਗੱਦੀ ਸ੍ਰੀ ਗੁਰੂ ਰਾਮ ਦਾਸ ਜੀ ਨੂੰ ਬਖ਼ਸ਼ੀ।"},"pankti":{"gurmukhi":"ਰਾਜੁ ਜੋਗੁ ਤਖਤੁ ਦੀਅਨੁ ਗੁਰ ਰਾਮਦਾਸ ॥","ref":"Ang 1399 · Savaiye Mahalle Chauthe Ke · Bhatt Nal Ji"},"darshan":{"label":"ਗੁਰ ਗੱਦੀ","text":"੧੬੩੧ ਬਿ: ਭਾਦਰੋਂ ਸੁਦੀ ਤਰੌਦਸੀ","page":"੧੬","source":"Gurbani Paath Darshan p.੧੬"},"images":[{"file":"guru-ram-das-ji--c1800-1840--royal-collection--scene.jpg","credit":"Royal Collection Trust, RCIN 925205 · c. 1800–1840 · detail","alt":"Sri Guru Ram Das Ji, seated on a terrace with a rababi and an attendant; Gurmukhi name panel across the head"},{"file":"guru-ram-das-ji-numbered-4--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Ram Das Ji, numbered ੪ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-ram-das-ji--c1800--nainsukh-family.jpg","credit":"Family workshop of Nainsukh of Guler, c. 1800, public domain, via Wikimedia Commons","alt":"Sri Guru Ram Das Ji seated against a bolster, an attendant with a chaur."}]},"jyoti-jyot-sri-guru-amar-das-ji":{"about":{"en":"Sri Guru Amar Das Ji were Jyoti Jyot at Goindwal Sahib on Bhadon sudi puranmashi, 1631 Bikrami (1574 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਅਮਰ ਦਾਸ ਜੀ ਭਾਦੋਂ ਸੁਦੀ ਪੂਰਨਮਾਸ਼ੀ, ਸੰਮਤ ੧੬੩੧ ਬਿਕ੍ਰਮੀ (੧੫੭੪ ਈ.) ਨੂੰ ਗੋਇੰਦਵਾਲ ਸਾਹਿਬ ਵਿਖੇ ਜੋਤੀ ਜੋਤਿ ਸਮਾਏ।"},"pankti":{"gurmukhi":"ਜਗਿ ਦਾਤਾ ਸੋਇ ਭਗਤਿ ਵਛਲੁ ਤਿਹੁ ਲੋਇ ਜੀਉ ॥","ref":"Ang 923 · Ramkali Sadd · Baba Sundar Ji"},"darshan":{"label":"ਜੋਤੀ ਜੋਤਿ ਸਮਾਉਣਾ","text":"੧੬੩੧ ਬਿ: ਭਾਦਰੋਂ ਸੁਦੀ ਪੂਰਨਮਾਸ਼ੀ","page":"੧੫","source":"Gurbani Paath Darshan p.੧੫"},"images":[{"file":"guru-amar-das-ji--c1800-1840--royal-collection--scene.jpg","credit":"Royal Collection Trust, RCIN 925204 · c. 1800–1840 · detail","alt":"Sri Guru Amar Das Ji, seated on a terrace with a rababi and an attendant; Gurmukhi name panel across the head"},{"file":"guru-amar-das-ji-numbered-3--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Amar Das Ji, numbered ੩ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-amar-das-ji--late-18th-century--unknown.jpg","credit":"Unknown artist, late 18th century, public domain, via Wikimedia Commons","alt":"Sri Guru Amar Das Ji seated on a terrace, in white."}]},"jor-mela-goindwal-sahib":{"about":{"en":"The Jor Mela at Goindwal Sahib is held on the day Sri Guru Amar Das Ji were Jyoti Jyot there, Bhadon sudi puranmashi, 1631 Bikrami (1574 CE).","pa":"ਗੋਇੰਦਵਾਲ ਸਾਹਿਬ ਦਾ ਜੋੜ ਮੇਲਾ ਉਸ ਦਿਨ ਹੁੰਦਾ ਹੈ ਜਿਸ ਦਿਨ ਸ੍ਰੀ ਗੁਰੂ ਅਮਰ ਦਾਸ ਜੀ ਇੱਥੇ ਜੋਤੀ ਜੋਤਿ ਸਮਾਏ — ਭਾਦੋਂ ਸੁਦੀ ਪੂਰਨਮਾਸ਼ੀ, ਸੰਮਤ ੧੬੩੧ ਬਿਕ੍ਰਮੀ (੧੫੭੪ ਈ.)।"},"pankti":{"gurmukhi":"ਫੇਰਿ ਵਸਾਇਆ ਗੋਇੰਦਵਾਲੁ ਅਚਰਜੁ ਖੇਲੁ ਨ ਲਖਿਆ ਜਾਈ।","ref":"Vaar 1, Pauri 46 · Bhai Gurdas Ji"},"images":[{"file":"gurdwara-baoli-sahib-goindwal--c1890-1910--bonhams.jpg","credit":"unknown photographer; copy from a Bonhams sale · late 19th or early 20th century","alt":"Gurdwara Baoli Sahib, Goindwal Sahib: the domed entrance to the baoli with sangat seated before it. Cropped to the print."},{"file":"akbar-meets-guru-amar-das-ji-goindwal--19th-century--basahatullah.jpg","credit":"Possibly Basahatullah, Nabha court, 19th century, public domain, via Wikimedia Commons","alt":"Emperor Akbar meeting Sri Guru Amar Das Ji at Goindwal."}]},"jor-mela-baba-buddha-ji-ramdas":{"about":{"en":"The Jor Mela at Ramdas remembers Baba Buddha Ji, who spent their last years there and left the world at Ramdas.","pa":"ਰਮਦਾਸ ਦਾ ਜੋੜ ਮੇਲਾ ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਦੀ ਯਾਦ ਵਿੱਚ ਹੁੰਦਾ ਹੈ, ਜੋ ਰਮਦਾਸ ਵਿਖੇ ਚੜ੍ਹਾਈ ਕਰ ਗਏ।"},"pankti":{"gurmukhi":"ਸਤਿਗੁਰ ਕੀ ਸੇਵਾ ਸਫਲੁ ਹੈ ਜੇ ਕੋ ਕਰੇ ਚਿਤੁ ਲਾਇ ॥","ref":"Ang 644 · Raag Sorath · Sri Guru Amar Das Ji"},"images":[{"file":"baba-buddha-ji-with-bhai-lalo-ji-and-bhai-sahilo-ji--1929--gian-singh-naqqash.jpg","credit":"Gian Singh Naqqash, 1929, public domain, via Wikimedia Commons","alt":"Line illustration of Baba Buddha Ji with Bhai Lalo Ji and Bhai Sahilo Ji, Gurmukhi captions below."},{"file":"baba-buddha-ji-gurgaddi-of-guru-amar-das-ji-gilded-panel--c1801-1839--harmandir-sahib.jpg","credit":"Gilded door panel, Sri Harmandir Sahib, c. 1801–1839, public domain, via Wikimedia Commons","alt":"Gilded panel: Baba Buddha Ji performing the gurgaddi of Sri Guru Amar Das Ji."}]},"gurgaddi-divas-sri-guru-angad-dev-ji":{"about":{"en":"Sri Guru Nanak Dev Ji gave the Gurgaddi to Sri Guru Angad Dev Ji at Sri Kartarpur Sahib on Assu vadi 5, 1596 Bikrami (1539 CE), five days before their own Jyoti Jyot.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਅੱਸੂ ਵਦੀ ਪੰਚਮੀ, ਸੰਮਤ ੧੫੯੬ ਬਿਕ੍ਰਮੀ (੧੫੩੯ ਈ.) ਨੂੰ ਸ੍ਰੀ ਕਰਤਾਰਪੁਰ ਸਾਹਿਬ ਵਿਖੇ, ਜੋਤੀ ਜੋਤਿ ਸਮਾਉਣ ਤੋਂ ਪੰਜ ਦਿਨ ਪਹਿਲਾਂ, ਗੁਰਗੱਦੀ ਸ੍ਰੀ ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਨੂੰ ਬਖ਼ਸ਼ੀ।"},"pankti":{"gurmukhi":"ਲਹਣੇ ਦੀ ਫੇਰਾਈਐ ਨਾਨਕਾ ਦੋਹੀ ਖਟੀਐ ॥","ref":"Ang 966 · Ramkali ki Vaar · Rai Balvand Ji & Bhai Satta Ji"},"darshan":{"label":"ਗੁਰ ਗੱਦੀ","text":"੧੫੯੬ ਬਿ: ਅੱਸੂ ਵਦੀ ਪੰਚਮੀ","page":"੧੪","source":"Gurbani Paath Darshan p.੧੪"},"images":[{"file":"guru-angad-dev-ji--c1800-1840--royal-collection--scene.jpg","credit":"Royal Collection Trust, RCIN 925203 · c. 1800–1840 · detail","alt":"Sri Guru Angad Dev Ji, seated on a terrace with a rababi and an attendant; Gurmukhi name panel across the head"},{"file":"guru-angad-dev-ji-numbered-2--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Angad Dev Ji, numbered ੨ in the IntrinsikhArts series of the ten Guru Sahiban."}]},"jyoti-jyot-sri-guru-nanak-dev-ji":{"about":{"en":"Sri Guru Nanak Dev Ji were Jyoti Jyot at Sri Kartarpur Sahib on Assu vadi 10, 1596 Bikrami (1539 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਅੱਸੂ ਵਦੀ ਦਸਮੀ, ਸੰਮਤ ੧੫੯੬ ਬਿਕ੍ਰਮੀ (੧੫੩੯ ਈ.) ਨੂੰ ਸ੍ਰੀ ਕਰਤਾਰਪੁਰ ਸਾਹਿਬ ਵਿਖੇ ਜੋਤੀ ਜੋਤਿ ਸਮਾਏ।"},"pankti":{"gurmukhi":"ਜੋਤੀ ਜੋਤਿ ਮਿਲਾਇ ਕੈ ਸਤਿਗੁਰ ਨਾਨਕਿ ਰੂਪੁ ਵਟਾਇਆ।","ref":"Vaar 1, Pauri 45 · Bhai Gurdas Ji"},"darshan":{"label":"ਜੋਤੀ ਜੋਤਿ ਸਮਾਉਣਾ","text":"੧੫੯੬ ਬਿ: ਅੱਸੂ ਵਦੀ ਦਸਮੀ","page":"੧੩","source":"Gurbani Paath Darshan p.੧੩"},"images":[{"file":"guru-nanak-dev-ji--c1800-1840--royal-collection--scene.jpg","credit":"Royal Collection Trust, RCIN 925202 · c. 1800–1840 · detail","alt":"Sri Guru Nanak Dev Ji, seated on a terrace with a rababi and an attendant; Gurmukhi name panel across the head"},{"file":"guru-nanak-dev-ji-numbered-1--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Nanak Dev Ji, numbered ੧ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-nanak-dev-ji-listening-to-musicians--c1680--unknown.jpg","credit":"Unknown artist, c. 1680, public domain, via Wikimedia Commons","alt":"Miniature painting of Sri Guru Nanak Dev Ji listening to musicians."},{"file":"homage-and-langar-before-guru-nanak-dev-ji--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (578876i), 19th century · public domain","alt":"Kings and sangat paying homage to Sri Guru Nanak Dev Ji while langar is prepared and served."}]},"jor-mela-bir-baba-buddha-ji-thatha":{"about":{"en":"At Bir Baba Buddha Sahib, Thatha, near Sri Amritsar Sahib, Mata Ganga Ji received Baba Buddha Ji's blessing for a son, the future Sri Guru Hargobind Ji, on 21 Assu, 1651 Bikrami (1594 CE).","pa":"ਬੀੜ ਬਾਬਾ ਬੁੱਢਾ ਸਾਹਿਬ, ਠੱਠਾ (ਅੰਮ੍ਰਿਤਸਰ) ਵਿਖੇ ੨੧ ਅੱਸੂ, ਸੰਮਤ ੧੬੫੧ ਬਿਕ੍ਰਮੀ (੧੫੯੪ ਈ.) ਨੂੰ ਮਾਤਾ ਗੰਗਾ ਜੀ ਨੂੰ ਬਾਬਾ ਬੁੱਢਾ ਜੀ ਤੋਂ ਪੁੱਤਰ ਦੀ ਦਾਤ ਦਾ ਵਰ ਮਿਲਿਆ, ਜੋ ਸ੍ਰੀ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਜੀ ਹੋਏ।"},"pankti":{"gurmukhi":"ਸੇਵਾ ਕਰਤ ਹੋਇ ਨਿਹਕਾਮੀ ॥ ਤਿਸ ਕਉ ਹੋਤ ਪਰਾਪਤਿ ਸੁਆਮੀ ॥","ref":"Ang 286 · Sukhmani Sahib · Raag Gauri · Sri Guru Arjan Dev Ji"},"image":{"file":"gurdwara-baba-buddha-sahib-thaath--2025--mnv179.jpg","credit":"Mnv179, CC BY-SA 4.0, via Wikimedia Commons","alt":"Gurdwara Baba Buddha Sahib Ji, 'Thaath', with mela shamianas in front; Wiki Loves Punjab 2026 upload."}},"avtar-purab-bhai-taru-singh-ji":{"about":{"en":"Bhai Taru Singh Ji were born at the village of Poohla, district Amritsar, in 1720, to Bhai Jodh Singh and Bibi Dharam Kaur.","pa":"ਭਾਈ ਤਾਰੂ ਸਿੰਘ ਜੀ ੧੭੨੦ ਈ. ਵਿੱਚ ਪਿੰਡ ਪੂਹਲਾ, ਜ਼ਿਲ੍ਹਾ ਅੰਮ੍ਰਿਤਸਰ ਵਿਖੇ ਭਾਈ ਜੋਧ ਸਿੰਘ ਅਤੇ ਬੀਬੀ ਧਰਮ ਕੌਰ ਦੇ ਘਰ ਪ੍ਰਗਟ ਹੋਏ।"},"pankti":{"gurmukhi":"ਘਾਲਿ ਖਾਇ ਕਿਛੁ ਹਥਹੁ ਦੇਇ ॥ ਨਾਨਕ ਰਾਹੁ ਪਛਾਣਹਿ ਸੇਇ ॥੧॥","ref":"Ang 1245 · Sarang ki Vaar · Sri Guru Nanak Dev Ji"},"image":{"file":"bhai-taru-singh-ji-shaheedi--19th-century--unknown.jpg","credit":"Unknown artist, 19th century, public domain, via Wikimedia Commons","alt":"Drawing: the shaheedi of Bhai Taru Singh Ji."}},"shaheedi-divas-bhai-sukhdev-singh-bhai-harjinder-singh":{"about":{"en":"Bhai Sukhdev Singh (Sukha) and Bhai Harjinder Singh (Jinda) were hanged together in Yerwada Jail, Pune, on 9 October 1992, convicted for the 1986 killing of General Arun Vaidya.","pa":"ਭਾਈ ਸੁਖਦੇਵ ਸਿੰਘ (ਸੁੱਖਾ) ਅਤੇ ਭਾਈ ਹਰਜਿੰਦਰ ਸਿੰਘ (ਜਿੰਦਾ) ਨੂੰ ੧੯੮੬ ਵਿੱਚ ਜਨਰਲ ਅਰੁਣ ਵੈਦਿਆ ਦੇ ਕਤਲ ਦੇ ਕੇਸ ਵਿੱਚ ੯ ਅਕਤੂਬਰ ੧੯੯੨ ਈ. ਨੂੰ ਯਰਵਦਾ ਜੇਲ੍ਹ, ਪੂਨਾ ਵਿੱਚ ਇਕੱਠਿਆਂ ਫਾਂਸੀ ਦਿੱਤੀ ਗਈ।"},"pankti":{"gurmukhi":"ਚਿੰਤਾ ਤਾ ਕੀ ਕੀਜੀਐ ਜੋ ਅਨਹੋਨੀ ਹੋਇ ॥ ਇਹੁ ਮਾਰਗੁ ਸੰਸਾਰ ਕੋ ਨਾਨਕ ਥਿਰੁ ਨਹੀ ਕੋਇ ॥੫੧॥","ref":"Ang 1429 · Salok Mahalla 9 · Sri Guru Tegh Bahadur Sahib Ji"}},"darbar-khalsa-dussehra":{"about":{"en":"On Dussehra the Nihang Singh dals hold a Darbar Khalsa, with mahalla and displays of shastar.","pa":"ਦੁਸਹਿਰੇ ਵਾਲੇ ਦਿਨ ਨਿਹੰਗ ਸਿੰਘ ਦਲ ਦਰਬਾਰ ਖ਼ਾਲਸਾ ਸਜਾਉਂਦੇ ਹਨ ਅਤੇ ਮਹੱਲਾ ਤੇ ਸ਼ਸਤਰਾਂ ਦੇ ਜੌਹਰ ਹੁੰਦੇ ਹਨ।"},"pankti":{"gurmukhi":"ਪ੍ਰਿਥਮ ਭਗੌਤੀ ਸਿਮਰਿ ਕੈ ਗੁਰ ਨਾਨਕ ਲਈਂ ਧਿਆਇ ॥","ref":"Sri Dasam Granth Sahib · Chandi di Vaar, Pauri 1 · Sri Guru Gobind Singh Ji"},"images":[{"file":"akali-nihang-singhs-on-the-march--c1885--company-school.jpg","credit":"possibly Sanee, a Company artist, public domain, via Wikimedia Commons","alt":"Painting: Akali Nihang Singhs on the march, the Jathedar on horseback with the Nishan Sahib. Company School, Lahore."},{"file":"akali-nihang-singhs-court-of-lahore-detail--c1841-1855--august-schoefft.jpg","credit":"August Schoefft, c. 1841–1855, public domain, via Wikimedia Commons","alt":"Detail of Schoefft’s ‘The Court of Lahore’: Akali-Nihang Singhs in blue with tall dastars."}]},"janam-divas-sant-gyani-kartar-singh-bhindranwale":{"about":{"en":"Sant Gyani Kartar Singh Ji Khalsa Bhindranwale, head of Damdami Taksal, were born in 1932 and passed away in 1977.","pa":"ਦਮਦਮੀ ਟਕਸਾਲ ਦੇ ਮੁਖੀ ਸੰਤ ਗਿਆਨੀ ਕਰਤਾਰ ਸਿੰਘ ਜੀ ਖ਼ਾਲਸਾ ਭਿੰਡਰਾਂਵਾਲੇ ੧੯੩੨ ਈ. ਵਿੱਚ ਜਨਮੇ ਅਤੇ ੧੯੭੭ ਈ. ਵਿੱਚ ਚੜ੍ਹਾਈ ਕਰ ਗਏ।"},"pankti":{"gurmukhi":"ਗੁਰਬਾਣੀ ਇਸੁ ਜਗ ਮਹਿ ਚਾਨਣੁ ਕਰਮਿ ਵਸੈ ਮਨਿ ਆਏ ॥੧॥","ref":"Ang 67 · Sri Raag · Sri Guru Amar Das Ji"}},"prakash-gurpurab-sri-guru-ram-das-ji":{"about":{"en":"Sri Guru Ram Das Ji took Prakash at Chuna Mandi, Lahore, on Kattak vadi 2, 1591 Bikrami (1534 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਰਾਮ ਦਾਸ ਜੀ ਨੇ ਕੱਤਕ ਵਦੀ ਦੂਜ, ਸੰਮਤ ੧੫੯੧ ਬਿਕ੍ਰਮੀ (੧੫੩੪ ਈ.) ਨੂੰ ਚੂਨਾ ਮੰਡੀ, ਲਾਹੌਰ ਵਿਖੇ ਪ੍ਰਕਾਸ਼ ਧਾਰਿਆ।"},"pankti":{"gurmukhi":"ਧੰਨੁ ਧੰਨੁ ਰਾਮਦਾਸ ਗੁਰੁ ਜਿਨਿ ਸਿਰਿਆ ਤਿਨੈ ਸਵਾਰਿਆ ॥","ref":"Ang 968 · Ramkali ki Vaar · Rai Balvand Ji & Bhai Satta Ji"},"darshan":{"label":"ਅਵਤਾਰ ਧਾਰਨ","text":"੧੫੯੧ ਬਿ: ਕੱਤਕ ਵਦੀ ਦੂਜ","page":"੧੬","source":"Gurbani Paath Darshan p.੧੬"},"images":[{"file":"guru-ram-das-ji--c1800-1840--royal-collection--scene.jpg","credit":"Royal Collection Trust, RCIN 925205 · c. 1800–1840 · detail","alt":"Sri Guru Ram Das Ji, seated on a terrace with a rababi and an attendant; Gurmukhi name panel across the head"},{"file":"guru-ram-das-ji-numbered-4--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Ram Das Ji, numbered ੪ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-ram-das-ji--c1800--nainsukh-family.jpg","credit":"Family workshop of Nainsukh of Guler, c. 1800, public domain, via Wikimedia Commons","alt":"Sri Guru Ram Das Ji seated against a bolster, an attendant with a chaur."}]},"barsi-sardar-jassa-singh-ahluwalia":{"about":{"en":"Sardar Jassa Singh Ahluwalia, honoured by the Panth as Sultan-ul-Qaum, died in 1783 at the age of sixty-five.","pa":"ਪੰਥ ਵੱਲੋਂ ਸੁਲਤਾਨ-ਉਲ-ਕੌਮ ਦੀ ਉਪਾਧੀ ਪਾਉਣ ਵਾਲੇ ਸਰਦਾਰ ਜੱਸਾ ਸਿੰਘ ਆਹਲੂਵਾਲੀਆ ੧੭੮੩ ਈ. ਵਿੱਚ ੬੫ ਸਾਲ ਦੀ ਉਮਰ ਵਿੱਚ ਚੜ੍ਹਾਈ ਕਰ ਗਏ।"},"pankti":{"gurmukhi":"ਜੋ ਆਇਆ ਸੋ ਚਲਸੀ ਸਭੁ ਕੋਈ ਆਈ ਵਾਰੀਐ ॥","ref":"Ang 474 · Asa di Vaar · Sri Guru Nanak Dev Ji"},"images":[{"file":"samadhi-jassa-singh-ahluwalia-amritsar--2023--maplesyrupsushi.jpg","credit":"MaplesyrupSushi, CC BY-SA 4.0, via Wikimedia Commons","alt":"The Samadhi of Sardar Jassa Singh Ahluwalia, inside the Sri Harmandir Sahib complex, at night with its name board."},{"file":"s-jassa-singh-ahluwalia-on-horseback--c1859--unknown.jpg","credit":"Punjab Plains, c. 1859, public domain, via Wikimedia Commons","alt":"Drawing of S. Jassa Singh Ahluwalia on horseback."}]},"avtar-purab-baba-buddha-ji":{"about":{"en":"Baba Buddha Ji were born at Kathu Nangal, district Amritsar, on 7 Kattak, 1563 Bikrami (1506 CE).","pa":"ਬਾਬਾ ਬੁੱਢਾ ਜੀ ੭ ਕੱਤਕ, ਸੰਮਤ ੧੫੬੩ ਬਿਕ੍ਰਮੀ (੧੫੦੬ ਈ.) ਨੂੰ ਪਿੰਡ ਕੱਥੂਨੰਗਲ, ਜ਼ਿਲ੍ਹਾ ਅੰਮ੍ਰਿਤਸਰ ਵਿਖੇ ਪ੍ਰਗਟ ਹੋਏ।"},"pankti":{"gurmukhi":"ਜਿਤਾ ਰੰਧਾਵਾ ਭਲਾ ਹੈ ਬੂੜਾ ਬੁਢਾ ਇਕ ਮਨਿ ਧਿਆਵੈ।","ref":"Vaar 11, Pauri 14 · Bhai Gurdas Ji"},"images":[{"file":"baba-buddha-ji-fresco-gurdwara-baba-bir-singh--19th-century--unknown.jpg","credit":"Unknown artist, public domain, via Wikimedia Commons","alt":"Fresco of Baba Buddha Ji, named in Gurmukhi, Gurdwara Baba Bir Singh."},{"file":"mata-ganga-ji-and-baba-buddha-ji-mural-hazur-sahib--19th-century--hukam-singh.jpg","credit":"Hukam Singh and Amar Singh, public domain, via Wikimedia Commons","alt":"Mural: Mata Ganga Ji seeking the blessing of Baba Buddha Ji at the Bir, Takht Sachkhand Sri Hazur Sahib."}]},"gurgaddi-divas-sri-guru-har-krishan-ji":{"about":{"en":"Sri Guru Har Rai Ji gave the Gurgaddi to Sri Guru Har Krishan Ji at Kiratpur Sahib on Kattak vadi 9, 1718 Bikrami (1661 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਹਰਿ ਰਾਇ ਜੀ ਨੇ ਕੱਤਕ ਵਦੀ ਨੌਮੀ, ਸੰਮਤ ੧੭੧੮ ਬਿਕ੍ਰਮੀ (੧੬੬੧ ਈ.) ਨੂੰ ਕੀਰਤਪੁਰ ਸਾਹਿਬ ਵਿਖੇ ਗੁਰਗੱਦੀ ਸ੍ਰੀ ਗੁਰੂ ਹਰਿ ਕ੍ਰਿਸ਼ਨ ਜੀ ਨੂੰ ਬਖ਼ਸ਼ੀ।"},"pankti":{"gurmukhi":"ਹਰੀਕ੍ਰਿਸਨ ਤਿਨ ਕੇ ਸੁਤ ਵਏ ॥ ਤਿਨ ਤੇ ਤੇਗ ਬਹਾਦਰ ਭਏ ॥੧੨॥","ref":"Sri Dasam Granth Sahib · Bachittar Natak, Adhyay 5 · Sri Guru Gobind Singh Ji"},"darshan":{"label":"ਗੁਰ ਗੱਦੀ","text":"੧੭੧੮ ਬਿ: ਕਤਕ ਵਦੀ ਨੌਮੀ","page":"੨੦","source":"Gurbani Paath Darshan p.੨੦"},"images":[{"file":"guru-har-krishan-ji--c1800-1840--royal-collection--scene.jpg","credit":"Royal Collection Trust, RCIN 925209 · c. 1800–1840 · detail","alt":"Sri Guru Har Krishan Ji, seated on a terrace with a rababi and an attendant; Gurmukhi name panel across the head"},{"file":"guru-har-krishan-sahib-ji-numbered-8--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Har Krishan Sahib Ji, numbered ੮ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-har-krishan-sahib-ji-with-sangat--c1875-1900--unknown.jpg","credit":"Pahari, c. 1875–1900, public domain, via Wikimedia Commons","alt":"Sri Guru Har Krishan Sahib Ji seated in darbar with Sikhs."}]},"jyoti-jyot-sri-guru-har-rai-ji":{"about":{"en":"Sri Guru Har Rai Ji were Jyoti Jyot at Patalpuri, Kiratpur Sahib, on Kattak vadi 9, 1718 Bikrami (1661 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਹਰਿ ਰਾਇ ਜੀ ਕੱਤਕ ਵਦੀ ਨੌਮੀ, ਸੰਮਤ ੧੭੧੮ ਬਿਕ੍ਰਮੀ (੧੬੬੧ ਈ.) ਨੂੰ ਕੀਰਤਪੁਰ ਸਾਹਿਬ (ਪਤਾਲਪੁਰੀ) ਵਿਖੇ ਜੋਤੀ ਜੋਤਿ ਸਮਾਏ।"},"pankti":{"gurmukhi":"ਸਭਨਾ ਮਨ ਮਾਣਿਕ ਠਾਹਣੁ ਮੂਲਿ ਮਚਾਂਗਵਾ ॥ ਜੇ ਤਉ ਪਿਰੀਆ ਦੀ ਸਿਕ ਹਿਆਉ ਨ ਠਾਹੇ ਕਹੀ ਦਾ ॥੧੩੦॥","ref":"Ang 1384 · Salok Farid Ji · Bhagat Sheikh Farid Ji"},"darshan":{"label":"ਜੋਤੀ ਜੋਤਿ ਸਮਾਉਣਾ","text":"੧੭੧੮ ਬਿਕ੍ਰਮੀ ਕਤਕ ਵਦੀ ਨੌਮੀ","page":"੧੯","source":"Gurbani Paath Darshan p.੧੯"},"images":[{"file":"guru-har-rai-ji--c1800-1840--royal-collection--scene.jpg","credit":"Royal Collection Trust, RCIN 925208 · c. 1800–1840 · detail","alt":"Sri Guru Har Rai Ji, seated on a terrace with a rababi and an attendant; Gurmukhi name panel across the head"},{"file":"guru-har-rai-sahib-ji-numbered-7--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Har Rai Sahib Ji, numbered ੭ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-har-rai-sahib-ji-holding-flower--17th-18th-century--bhai-rupa-chand-collection.jpg","credit":"Bhai Rupa Chand collection, 17th or 18th century, public domain, via Wikimedia Commons","alt":"Sri Guru Har Rai Sahib Ji holding a flower."},{"file":"guru-har-rai-sahib-ji-receiving-devotee--c1790--nainsukh-family.jpg","credit":"Family workshop of Nainsukh of Guler, c. 1790, public domain, via Wikimedia Commons","alt":"Sri Guru Har Rai Sahib Ji standing in a garden, receiving a devotee who brings a garland."}]},"saka-panja-sahib":{"about":{"en":"In 1922 at Hasan Abdal, Bhai Partap Singh and Bhai Karam Singh lay on the railway line to stop a train carrying Guru ka Bagh prisoners so the sangat could serve them langar, and were crushed.","pa":"੧੯੨੨ ਈ. ਵਿੱਚ ਹਸਨ ਅਬਦਾਲ (ਪੰਜਾ ਸਾਹਿਬ) ਵਿਖੇ ਗੁਰੂ ਕੇ ਬਾਗ਼ ਦੇ ਕੈਦੀਆਂ ਵਾਲੀ ਗੱਡੀ ਰੋਕ ਕੇ ਲੰਗਰ ਛਕਾਉਣ ਲਈ ਭਾਈ ਪ੍ਰਤਾਪ ਸਿੰਘ ਅਤੇ ਭਾਈ ਕਰਮ ਸਿੰਘ ਪਟੜੀ ਉੱਤੇ ਲੇਟ ਗਏ ਅਤੇ ਗੱਡੀ ਹੇਠ ਆ ਕੇ ਸ਼ਹੀਦ ਹੋਏ।"},"pankti":{"gurmukhi":"ਮਰਣੁ ਮੁਣਸਾ ਸੂਰਿਆ ਹਕੁ ਹੈ ਜੋ ਹੋਇ ਮਰਨਿ ਪਰਵਾਣੋ ॥","ref":"Ang 579 · Alahniyan · Raag Vadhans · Sri Guru Nanak Dev Ji"},"image":{"file":"gurdwara-panja-sahib-hasan-abdal--2013--muhammad-imran-saeed.jpg","credit":"Muhammad Imran Saeed, CC BY 2.0, via Wikimedia Commons","alt":"Gurdwara Sri Panja Sahib, Hasan Abdal."}},"shaheedi-divas-bhai-beant-singh":{"about":{"en":"In 1984 in New Delhi, Bhai Beant Singh and Bhai Satwant Singh shot Prime Minister Indira Gandhi; Bhai Beant Singh was shot dead in custody the same day.","pa":"੧੯੮੪ ਈ. ਵਿੱਚ ਨਵੀਂ ਦਿੱਲੀ ਵਿਖੇ ਭਾਈ ਬੇਅੰਤ ਸਿੰਘ ਅਤੇ ਭਾਈ ਸਤਵੰਤ ਸਿੰਘ ਨੇ ਪ੍ਰਧਾਨ ਮੰਤਰੀ ਇੰਦਰਾ ਗਾਂਧੀ ਨੂੰ ਗੋਲੀ ਮਾਰੀ; ਭਾਈ ਬੇਅੰਤ ਸਿੰਘ ਨੂੰ ਉਸੇ ਦਿਨ ਹਿਰਾਸਤ ਵਿੱਚ ਗੋਲੀ ਮਾਰ ਦਿੱਤੀ ਗਈ।"},"pankti":{"gurmukhi":"ਜੋ ਉਪਜਿਓ ਸੋ ਬਿਨਸਿ ਹੈ ਪਰੋ ਆਜੁ ਕੈ ਕਾਲਿ ॥ ਨਾਨਕ ਹਰਿ ਗੁਨ ਗਾਇ ਲੇ ਛਾਡਿ ਸਗਲ ਜੰਜਾਲ ॥੫੨॥","ref":"Ang 1429 · Salok Mahalla 9 · Sri Guru Tegh Bahadur Sahib Ji"}},"avtar-purab-mata-sahib-kaur-ji":{"about":{"en":"Mata Sahib Kaur Ji, the Mother of the Khalsa, was born at Rohtas, district Jhelum, in 1681.","pa":"ਖ਼ਾਲਸੇ ਦੀ ਮਾਤਾ, ਮਾਤਾ ਸਾਹਿਬ ਕੌਰ ਜੀ, ੧੬੮੧ ਈ. ਵਿੱਚ ਰੋਹਤਾਸ, ਜ਼ਿਲ੍ਹਾ ਜੇਹਲਮ ਵਿਖੇ ਪ੍ਰਗਟ ਹੋਏ।"},"pankti":{"gurmukhi":"ਜਿਉ ਜਨਨੀ ਸੁਤੁ ਜਣਿ ਪਾਲਤੀ ਰਾਖੈ ਨਦਰਿ ਮਝਾਰਿ ॥","ref":"Ang 168 · Raag Gauri · Sri Guru Ram Das Ji"},"image":{"file":"rohtas-fort-sohail-gate--2015--hassantahir.jpg","credit":"Hassantahir6009, CC BY-SA 4.0, via Wikimedia Commons","alt":"The Sohail Gate of Rohtas Fort, Jhelum — Paath Darshan p.੨੨ says Mata Sahib Kaur Ji's parental home was in the Rohtas fort."}},"bandi-chhor-divas-diwali":{"about":{"en":"Sri Guru Hargobind Ji were released from Gwalior Fort, with fifty-two hill rajas freed with them, and returned to Sri Amritsar Sahib at Diwali.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਜੀ ਗਵਾਲੀਅਰ ਦੇ ਕਿਲ੍ਹੇ ਤੋਂ ਬਵੰਜਾ ਪਹਾੜੀ ਰਾਜਿਆਂ ਨੂੰ ਨਾਲ ਛੁਡਾ ਕੇ ਦੀਵਾਲੀ ਵਾਲੇ ਦਿਨ ਸ੍ਰੀ ਅੰਮ੍ਰਿਤਸਰ ਸਾਹਿਬ ਪਹੁੰਚੇ।"},"pankti":{"gurmukhi":"ਫੂਟੋ ਆਂਡਾ ਭਰਮ ਕਾ ਮਨਹਿ ਭਇਓ ਪਰਗਾਸੁ ॥ ਕਾਟੀ ਬੇਰੀ ਪਗਹ ਤੇ ਗੁਰਿ ਕੀਨੀ ਬੰਦਿ ਖਲਾਸੁ ॥੧॥","ref":"Ang 1002 · Raag Maru · Sri Guru Arjan Dev Ji"},"images":[{"file":"gurdwara-data-bandi-chhor-gwalior--2018--suyash-dwivedi.jpg","credit":"Suyash Dwivedi, CC BY-SA 4.0, via Wikimedia Commons","alt":"Gurdwara Sri Data Bandi Chhor Sahib, Gwalior Fort: the steps up to the darbar between two Nishan Sahibs."},{"file":"guru-hargobind-sahib-ji-leaving-gwalior-with-52-rajas--19th-century--unknown.jpg","credit":"Unknown artist, 19th century, public domain, via Wikimedia Commons","alt":"Sri Guru Hargobind Sahib Ji leading the 52 rajas out of Gwalior fort."},{"file":"harmandir-sahib-lithograph--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (26054i), coloured lithograph · public domain","alt":"Coloured lithograph of Sri Harmandir Sahib in its sarovar, with a Gurmukhi title."}]},"gurgaddi-divas-sri-guru-granth-sahib-ji":{"about":{"en":"At Sri Hazur Sahib, Nanded, in 1708, Sri Guru Gobind Singh Ji gave the Gurgaddi to Sri Guru Granth Sahib Ji, a few days before their own Jyoti Jyot.","pa":"੧੭੦੮ ਈ. ਵਿੱਚ ਸ੍ਰੀ ਹਜ਼ੂਰ ਸਾਹਿਬ, ਨੰਦੇੜ ਵਿਖੇ ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੇ ਜੋਤੀ ਜੋਤਿ ਸਮਾਉਣ ਤੋਂ ਕੁਝ ਦਿਨ ਪਹਿਲਾਂ ਗੁਰਗੱਦੀ ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ ਨੂੰ ਬਖ਼ਸ਼ੀ।"},"pankti":{"gurmukhi":"ਬਾਣੀ ਗੁਰੂ ਗੁਰੂ ਹੈ ਬਾਣੀ ਵਿਚਿ ਬਾਣੀ ਅੰਮ੍ਰਿਤੁ ਸਾਰੇ ॥","ref":"Ang 982 · Raag Nat Narain · Sri Guru Ram Das Ji"},"image":{"file":"takht-sachkhand-sri-hazur-sahib-nanded--2012--jaspal-singh.jpg","credit":"Jaspal Singh, CC BY-SA 3.0, via Wikimedia Commons","alt":"Takht Sachkhand Sri Hazur Sahib, Nanded."}},"jyoti-jyot-sri-guru-gobind-singh-ji":{"about":{"en":"Sri Guru Gobind Singh Ji were Jyoti Jyot at Sri Hazur Sahib, Nanded, on Kattak sudi 5, 1765 Bikrami (1708 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਕੱਤਕ ਸੁਦੀ ਪੰਚਮੀ, ਸੰਮਤ ੧੭੬੫ ਬਿਕ੍ਰਮੀ (੧੭੦੮ ਈ.) ਨੂੰ ਸ੍ਰੀ ਹਜ਼ੂਰ ਸਾਹਿਬ, ਨੰਦੇੜ ਵਿਖੇ ਜੋਤੀ ਜੋਤਿ ਸਮਾਏ।"},"pankti":{"gurmukhi":"ਪਾਇ ਗਹੇ ਜਬ ਤੇ ਤੁਮਰੇ ਤਬ ਤੇ ਕੋਊ ਆਂਖ ਤਰੇ ਨਹੀ ਆਨਯੋ ॥","ref":"Sri Dasam Granth Sahib · Ramavtar, Savaiya 863 · Sri Guru Gobind Singh Ji"},"darshan":{"label":"ਜੋਤੀ ਜੋਤਿ ਸਮਾਉਣਾ","text":"੧੭੬੫ ਬਿਕ੍ਰਮੀ, ਕਤਕ ਸੁਦੀ ਪੰਚਮੀ","page":"੨੨","source":"Gurbani Paath Darshan p.੨੨"},"images":[{"file":"guru-gobind-singh-ji--c1800--mfa-boston.jpg","credit":"Museum of Fine Arts, Boston, acc. 17.2729 (Ross-Coomaraswamy Collection) · c. 1800","alt":"Sri Guru Gobind Singh Ji on horseback, a parasol bearer behind"},{"file":"guru-gobind-singh-ji-numbered-10--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Gobind Singh Ji, numbered ੧੦ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-gobind-singh-ji-fresco-baoli-sahib-goindwal--19th-century--unknown.jpg","credit":"Fresco, Baoli Sahib, Goindwal, 19th century, public domain, via Wikimedia Commons","alt":"Fresco of Sri Guru Gobind Singh Ji above the entrance of the Baoli Sahib, Goindwal."},{"file":"guru-gobind-singh-ji-on-terrace-with-arrow--18th-19th-century--unknown.jpg","credit":"Unknown artist, 18th or 19th century, public domain, via Wikimedia Commons","alt":"Sri Guru Gobind Singh Ji seated on a terrace against a bolster, holding an arrow."}]},"avtar-purab-bhagat-namdev-ji":{"about":{"en":"Bhagat Namdev Ji were born at Narsi Bamni, district Satara (Maharashtra), in 1328 Bikrami (about 1270 CE).","pa":"ਭਗਤ ਨਾਮਦੇਵ ਜੀ ਸੰਮਤ ੧੩੨੮ ਬਿਕ੍ਰਮੀ (ਲਗਪਗ ੧੨੭੦ ਈ.) ਵਿੱਚ ਨਰਸੀ ਬਾਮਨੀ, ਜ਼ਿਲ੍ਹਾ ਸਤਾਰਾ (ਮਹਾਰਾਸ਼ਟਰ) ਵਿਖੇ ਪ੍ਰਗਟ ਹੋਏ।"},"pankti":{"gurmukhi":"ਸਭੁ ਗੋਬਿੰਦੁ ਹੈ ਸਭੁ ਗੋਬਿੰਦੁ ਹੈ ਗੋਬਿੰਦ ਬਿਨੁ ਨਹੀ ਕੋਈ ॥ ਸੂਤੁ ਏਕੁ ਮਣਿ ਸਤ ਸਹੰਸ ਜੈਸੇ ਓਤਿ ਪੋਤਿ ਪ੍ਰਭੁ ਸੋਈ ॥੧॥ ਰਹਾਉ ॥","ref":"Ang 485 · Raag Asa · Bhagat Namdev Ji"},"images":[{"file":"gurdwara-bhagat-namdev-ji-ghuman--before-1909--macauliffe.jpg","credit":"Max Arthur Macauliffe, The Sikh Religion vol. 6 (Oxford, 1909) · before 1909","alt":"The shrine of Bhagat Namdev Ji at Ghuman, sangat at the door; plate 'NAMDEV'S SHRINE AT GHUMAN' from Macauliffe's The Sikh Religion. Cropped to the photograph."},{"file":"bhagat-namdev-ji--c18th-century--panjab-digital-library.jpg","credit":"Prem Ambodh Pothi, 18th century; scan Panjab Digital Library, public domain, via Wikimedia Commons","alt":"Bhagat Namdev Ji seated; Gurmukhi caption ਨਾਮਦੇਵ ਜੀ above the panel. Folio of the Prem Ambodh Pothi."},{"file":"gathering-of-holy-men-kabir-namdev-ravidas--c1770-1775--met-museum.jpg","credit":"The Metropolitan Museum of Art (2009.318), attributed to Mir Kalan Khan, c. 1770–75 · public domain","alt":"Gathering of holy men, among them Bhagat Kabir Ji, Bhagat Namdev Ji and Bhagat Ravidas Ji, before a hut."}]},"shaheedi-divas-baba-deep-singh-ji":{"about":{"en":"Baba Deep Singh Ji were martyred at Sri Amritsar Sahib in 1757, fighting the Afghan army to free Sri Harmandir Sahib.","pa":"ਬਾਬਾ ਦੀਪ ਸਿੰਘ ਜੀ ੧੭੫੭ ਈ. ਵਿੱਚ ਸ੍ਰੀ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਨੂੰ ਆਜ਼ਾਦ ਕਰਾਉਣ ਲਈ ਅਫ਼ਗ਼ਾਨ ਫ਼ੌਜ ਨਾਲ ਜੂਝਦੇ ਹੋਏ ਸ੍ਰੀ ਅੰਮ੍ਰਿਤਸਰ ਸਾਹਿਬ ਵਿਖੇ ਸ਼ਹੀਦ ਹੋਏ।"},"pankti":{"gurmukhi":"ਜਉ ਤਉ ਪ੍ਰੇਮ ਖੇਲਣ ਕਾ ਚਾਉ ॥ ਸਿਰੁ ਧਰਿ ਤਲੀ ਗਲੀ ਮੇਰੀ ਆਉ ॥","ref":"Ang 1412 · Salok Vaaran te Vadheek · Sri Guru Nanak Dev Ji"},"images":[{"file":"baba-deep-singh-ji-battle-of-amritsar--early-20th-century--gian-singh-naqqash.jpg","credit":"Gian Singh Naqqash (1883–1953), public domain, via Wikimedia Commons","alt":"Watercolour: Baba Deep Singh Ji, head in hand, fighting with the Singhs against the Afghan army at Amritsar, 1757."},{"file":"baba-deep-singh-ji-leading-the-singhs--early-20th-century--unknown.jpg","credit":"Unknown Sikh painter, early 20th century, public domain, via Wikimedia Commons","alt":"Painting: Baba Deep Singh Ji with khanda raised, leading the Singhs against the Afghan army."},{"file":"shaheed-baba-deep-singh-ji-fresco-gurdwara-baba-atal--19th-century--naqqash.jpg","credit":"Jaimal Singh Naqqash and Gian Singh Naqqash (painters), Gurdwara Baba Atal Rai, public domain, via Wikimedia Commons","alt":"Fresco medallion of Shaheed Baba Deep Singh Ji, Gurdwara Baba Atal Rai, Amritsar, named in Gurmukhi."}]},"prakash-gurpurab-sri-guru-nanak-dev-ji":{"about":{"en":"Sri Guru Nanak Dev Ji took Prakash at Rai Bhoe di Talwandi (Sri Nankana Sahib) on Kattak sudi puranmashi, 1526 Bikrami (1469 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਕੱਤਕ ਸੁਦੀ ਪੂਰਨਮਾਸ਼ੀ, ਸੰਮਤ ੧੫੨੬ ਬਿਕ੍ਰਮੀ (੧੪੬੯ ਈ.) ਨੂੰ ਰਾਇ ਭੋਇ ਦੀ ਤਲਵੰਡੀ (ਸ੍ਰੀ ਨਨਕਾਣਾ ਸਾਹਿਬ) ਵਿਖੇ ਪ੍ਰਕਾਸ਼ ਧਾਰਿਆ।"},"pankti":{"gurmukhi":"ਸਤਿਗੁਰੁ ਨਾਨਕੁ ਪ੍ਰਗਟਿਆ ਮਿਟੀ ਧੁੰਧੁ ਜਗਿ ਚਾਨਣੁ ਹੋਆ।","ref":"Vaar 1, Pauri 27 · Bhai Gurdas Ji"},"darshan":{"label":"ਅਵਤਾਰ ਧਾਰਨ","text":"੧੫੨੬ ਬਿ: ਕੱਤਕ ਸੁਦੀ ਪੂਰਨਮਾਸ਼ੀ","page":"੧੩","source":"Gurbani Paath Darshan p.੧੩"},"images":[{"file":"guru-nanak-dev-ji--c1800-1840--royal-collection--scene.jpg","credit":"Royal Collection Trust, RCIN 925202 · c. 1800–1840 · detail","alt":"Sri Guru Nanak Dev Ji, seated on a terrace with a rababi and an attendant; Gurmukhi name panel across the head"},{"file":"guru-nanak-dev-ji-numbered-1--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Nanak Dev Ji, numbered ੧ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"homage-and-langar-before-guru-nanak-dev-ji--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (578876i), 19th century · public domain","alt":"Kings and sangat paying homage to Sri Guru Nanak Dev Ji while langar is prepared and served."},{"file":"guru-nanak-dev-ji-with-bhai-mardana-ji--c19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (27298i), 19th century · public domain","alt":"Sri Guru Nanak Dev Ji seated under a tree, a rababi playing the rabab, an attendant with a chaur."}]},"akal-chalana-bhai-mardana-ji":{"about":{"en":"This day remembers the Akal Chalana of Bhai Mardana Ji, the rababi who travelled with Sri Guru Nanak Dev Ji.","pa":"ਇਹ ਦਿਨ ਸ੍ਰੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੇ ਸਾਥੀ ਰਬਾਬੀ ਭਾਈ ਮਰਦਾਨਾ ਜੀ ਦੇ ਅਕਾਲ ਚਲਾਣੇ ਦੀ ਯਾਦ ਹੈ।"},"pankti":{"gurmukhi":"ਭਲਾ ਰਬਾਬ ਵਜਾਇੰਦਾ ਮਜਲਸ ਮਰਦਾਨਾ ਮੀਰਾਸੀ।","ref":"Vaar 11, Pauri 13 · Bhai Gurdas Ji"},"images":[{"file":"bhai-mardana-ji--unknown--unknown.jpg","credit":"unknown artist; book plate photographed by the uploader · c. 17th–19th century","alt":"Bhai Mardana Ji playing the rabab: detail of a Janamsakhi painting, oval on black; photographed from Sikh Heritage: Ethos and Relics (2012), p. 17."},{"file":"antim-sanskar-bhai-mardana-ji-janamsakhi--19th-century--unknown.jpg","credit":"Janamsakhi folio, 19th century, public domain, via Wikimedia Commons","alt":"Janamsakhi drawing: the antim sanskar of Bhai Mardana Ji, Sri Guru Nanak Dev Ji standing by."},{"file":"guru-nanak-dev-ji-with-bhai-mardana-ji--c19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (27298i), 19th century · public domain","alt":"Sri Guru Nanak Dev Ji seated under a tree, a rababi playing the rabab, an attendant with a chaur."},{"file":"guru-nanak-dev-ji-listening-to-music--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (27201i), 19th century · public domain","alt":"Sri Guru Nanak Dev Ji listening to a rabab player under a tree, an attendant beside them."}]},"avtar-purab-sahibzada-zorawar-singh-ji":{"about":{"en":"Sahibzada Zorawar Singh Ji, son of Sri Guru Gobind Singh Ji and Mata Jito Ji, was born at Sri Anandpur Sahib.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਅਤੇ ਮਾਤਾ ਜੀਤੋ ਜੀ ਦੇ ਸਾਹਿਬਜ਼ਾਦੇ, ਸਾਹਿਬਜ਼ਾਦਾ ਜ਼ੋਰਾਵਰ ਸਿੰਘ ਜੀ, ਸ੍ਰੀ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਵਿਖੇ ਪ੍ਰਗਟ ਹੋਏ।"},"pankti":{"gurmukhi":"ਨਿਰਭਉ ਜਪੈ ਸਗਲ ਭਉ ਮਿਟੈ ॥ ਪ੍ਰਭ ਕਿਰਪਾ ਤੇ ਪ੍ਰਾਣੀ ਛੁਟੈ ॥","ref":"Ang 293 · Sukhmani Sahib · Raag Gauri · Sri Guru Arjan Dev Ji"},"images":[{"file":"sahibzada-zorawar-singh-ji-fresco-gurdwara-baba-atal--19th-century--naqqash.jpg","credit":"Painted by Gian Singh Naqqash, Jaimal Singh Naqqash (1860–1916), Mehtab Singh Naqqash (187, public domain, via Wikimedia Commons","alt":"Fresco of Sahibzada Zorawar Singh Ji, named in Gurmukhi, Gurdwara Baba Atal Rai, Amritsar."},{"file":"sahibzade-zorawar-singh-ji-fateh-singh-ji-mural--19th-century--unknown.jpg","credit":"Unknown artist, public domain, via Wikimedia Commons","alt":"Mural detail: Sahibzada Zorawar Singh Ji and Sahibzada Fateh Singh Ji, from a mural of Sri Guru Gobind Singh Ji and the four Sahibzade."}]},"shaheedi-divas-baba-gurbaksh-singh-ji":{"about":{"en":"Baba Gurbaksh Singh Ji, of village Leel, district Amritsar, were martyred at Sri Amritsar Sahib in 1764 with about thirty Singhs, defending Sri Harmandir Sahib against Ahmad Shah Abdali's army.","pa":"ਪਿੰਡ ਲੀਲ, ਜ਼ਿਲ੍ਹਾ ਅੰਮ੍ਰਿਤਸਰ ਦੇ ਬਾਬਾ ਗੁਰਬਖ਼ਸ਼ ਸਿੰਘ ਜੀ ੧੭੬੪ ਈ. ਵਿੱਚ ਲਗਪਗ ਤੀਹ ਸਿੰਘਾਂ ਸਮੇਤ ਅਹਿਮਦ ਸ਼ਾਹ ਅਬਦਾਲੀ ਦੀ ਫ਼ੌਜ ਤੋਂ ਸ੍ਰੀ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੀ ਰਾਖੀ ਕਰਦੇ ਹੋਏ ਸ੍ਰੀ ਅੰਮ੍ਰਿਤਸਰ ਸਾਹਿਬ ਵਿਖੇ ਸ਼ਹੀਦ ਹੋਏ।"},"pankti":{"gurmukhi":"ਸੂਰੇ ਸੇਈ ਆਗੈ ਆਖੀਅਹਿ ਦਰਗਹ ਪਾਵਹਿ ਸਾਚੀ ਮਾਣੋ ॥","ref":"Ang 580 · Alahniyan · Raag Vadhans · Sri Guru Nanak Dev Ji"},"images":[{"file":"gurdwara-shaheed-ganj-baba-gurbaksh-singh-amritsar--2023--maplesyrupsushi.jpg","credit":"MaplesyrupSushi, CC BY-SA 4.0, via Wikimedia Commons","alt":"Inside Gurdwara Sri Shaheed Ganj Baba Gurbaksh Singh Ji, Sri Harmandir Sahib complex: the carved doorway with its name board."},{"file":"baba-gurbaksh-singh-ji-fresco-baba-atal--19th-century--naqqash.jpg","credit":"Naqqash painters, Gurdwara Baba Atal Rai, Amritsar, 19th century, public domain, via Wikimedia Commons","alt":"Fresco of Shaheed Baba Gurbaksh Singh Ji seated with a sword, haloed."}]},"gurgaddi-divas-sri-guru-gobind-singh-ji":{"about":{"en":"The Gurgaddi of Sri Guru Tegh Bahadur Sahib Ji was sent from Delhi to Sri Anandpur Sahib, to Sri Guru Gobind Singh Ji, on Maghar sudi 3, 1732 Bikrami (1675 CE).","pa":"ਮੱਘਰ ਸੁਦੀ ਤੀਜ, ਸੰਮਤ ੧੭੩੨ ਬਿਕ੍ਰਮੀ (੧੬੭੫ ਈ.) ਨੂੰ ਗੁਰਗੱਦੀ ਦਿੱਲੀ ਤੋਂ ਸ੍ਰੀ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਵਿਖੇ ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੂੰ ਭੇਜੀ ਗਈ।"},"pankti":{"gurmukhi":"ਹਮ ਇਹ ਕਾਜ ਜਗਤ ਮੋ ਆਏ ॥ ਧਰਮ ਹੇਤ ਗੁਰਦੇਵ ਪਠਾਏ ॥","ref":"Sri Dasam Granth Sahib · Bachittar Natak, Adhyay 6 · Sri Guru Gobind Singh Ji"},"darshan":{"label":"ਗੁਰ ਗੱਦੀ","text":"੧੭੩੨ ਬਿਕ੍ਰਮੀ, ਮਘਰ ਸੁਦੀ ਤੀਜ","page":"੨੨","source":"Gurbani Paath Darshan p.੨੨"},"images":[{"file":"guru-gobind-singh-ji--c1800--mfa-boston.jpg","credit":"Museum of Fine Arts, Boston, acc. 17.2729 (Ross-Coomaraswamy Collection) · c. 1800","alt":"Sri Guru Gobind Singh Ji on horseback, a parasol bearer behind"},{"file":"guru-gobind-singh-ji-numbered-10--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Gobind Singh Ji, numbered ੧੦ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-gobind-singh-ji-mandi-portrait--c1690--unknown.jpg","credit":"Commissioned by the Raja of Mandi, end of the 17th century, public domain, via Wikimedia Commons","alt":"Portrait of Sri Guru Gobind Singh Ji commissioned by the Raja of Mandi."}]},"shaheedi-sri-guru-tegh-bahadur-sahib-ji":{"about":{"en":"Sri Guru Tegh Bahadur Sahib Ji gave their sees for dharam at Chandni Chowk, Delhi, on Maghar sudi 5, 1732 Bikrami (1675 CE), where Gurdwara Sis Ganj Sahib now stands.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਤੇਗ਼ ਬਹਾਦਰ ਸਾਹਿਬ ਜੀ ਨੇ ਮੱਘਰ ਸੁਦੀ ਪੰਚਮੀ, ਸੰਮਤ ੧੭੩੨ ਬਿਕ੍ਰਮੀ (੧੬੭੫ ਈ.) ਨੂੰ ਦਿੱਲੀ ਦੇ ਚਾਂਦਨੀ ਚੌਕ ਵਿਖੇ ਧਰਮ ਹੇਤ ਸੀਸ ਦਿੱਤਾ, ਜਿੱਥੇ ਹੁਣ ਗੁਰਦੁਆਰਾ ਸੀਸ ਗੰਜ ਸਾਹਿਬ ਹੈ।"},"pankti":{"gurmukhi":"ਤਿਲਕ ਜੰਞੂ ਰਾਖਾ ਪ੍ਰਭ ਤਾ ਕਾ ॥ ਕੀਨੋ ਬਡੋ ਕਲੂ ਮਹਿ ਸਾਕਾ ॥","ref":"Sri Dasam Granth Sahib · Bachittar Natak, Adhyay 5 · Sri Guru Gobind Singh Ji"},"darshan":{"label":"ਸ਼ਹੀਦੀ","text":"੧੭੩੨ ਬਿ: ਮਘਰ ਸੁਦੀ ਪੰਚਮੀ","page":"੨੧","source":"Gurbani Paath Darshan p.੨੧"},"images":[{"file":"gurdwara-sis-ganj-sahib-delhi--2018--indrajit-das.jpg","credit":"Indrajit Das, CC BY-SA 4.0, via Wikimedia Commons","alt":"Gurdwara Sis Ganj Sahib, Chandni Chowk, Delhi."},{"file":"guru-tegh-bahadur-sahib-ji-numbered-9--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Tegh Bahadur Sahib Ji, numbered ੯ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-tegh-bahadur-sahib-ji--modern--intrinsikh-arts-rajpal-s.jpg","credit":"Intrinsikh Arts (Rajpal S.)","alt":"Modern painting: Sri Guru Tegh Bahadur Sahib Ji seated in meditation, in blue."},{"file":"shaheedi-guru-tegh-bahadur-sahib-ji-and-bhai-sahiban--late-19th-century--basahatullah.jpg","credit":"Basahatullah, Nabha court, late 19th century, public domain, via Wikimedia Commons","alt":"Painting of the shaheedi of Sri Guru Tegh Bahadur Sahib Ji, Bhai Mati Das Ji and Bhai Dayala Ji at Delhi."}]},"avtar-purab-sahibzada-fateh-singh-ji":{"about":{"en":"Sahibzada Fateh Singh Ji, the youngest son of Sri Guru Gobind Singh Ji and Mata Jito Ji, was born at Sri Anandpur Sahib.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਅਤੇ ਮਾਤਾ ਜੀਤੋ ਜੀ ਦੇ ਛੋਟੇ ਸਾਹਿਬਜ਼ਾਦੇ, ਸਾਹਿਬਜ਼ਾਦਾ ਫ਼ਤਿਹ ਸਿੰਘ ਜੀ, ਸ੍ਰੀ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਵਿਖੇ ਪ੍ਰਗਟ ਹੋਏ।"},"pankti":{"gurmukhi":"ਜਿਸ ਕੇ ਸਿਰ ਊਪਰਿ ਤੂੰ ਸੁਆਮੀ ਸੋ ਦੁਖੁ ਕੈਸਾ ਪਾਵੈ ॥","ref":"Ang 749 · Raag Suhi · Sri Guru Arjan Dev Ji"},"images":[{"file":"sahibzada-fateh-singh-ji-fresco-gurdwara-baba-atal--19th-century--naqqash.jpg","credit":"Painted by Gian Singh Naqqash, Jaimal Singh Naqqash (1860–1916), Mehtab Singh Naqqash (187, public domain, via Wikimedia Commons","alt":"Fresco of Sahibzada Fateh Singh Ji, named in Gurmukhi, Gurdwara Baba Atal Rai, Amritsar."},{"file":"sahibzade-zorawar-singh-ji-fateh-singh-ji-mural--19th-century--unknown.jpg","credit":"Unknown artist, public domain, via Wikimedia Commons","alt":"Mural detail: Sahibzada Zorawar Singh Ji and Sahibzada Fateh Singh Ji, from a mural of Sri Guru Gobind Singh Ji and the four Sahibzade."}]},"shaheedi-divas-baba-jivan-singh-ji-bhai-jaita-ji":{"about":{"en":"Baba Jivan Singh Ji (Bhai Jaita Ji), who had carried the sees of Sri Guru Tegh Bahadur Sahib Ji to Sri Anandpur Sahib, was martyred fighting at Sri Chamkaur Sahib.","pa":"ਬਾਬਾ ਜੀਵਨ ਸਿੰਘ ਜੀ (ਭਾਈ ਜੈਤਾ ਜੀ), ਜਿਨ੍ਹਾਂ ਨੇ ਸ੍ਰੀ ਗੁਰੂ ਤੇਗ਼ ਬਹਾਦਰ ਸਾਹਿਬ ਜੀ ਦਾ ਸੀਸ ਸ੍ਰੀ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਪਹੁੰਚਾਇਆ ਸੀ, ਸ੍ਰੀ ਚਮਕੌਰ ਸਾਹਿਬ ਵਿਖੇ ਜੂਝਦੇ ਹੋਏ ਸ਼ਹੀਦ ਹੋਏ।"},"pankti":{"gurmukhi":"ਹਰਿ ਜੁਗੁ ਜੁਗੁ ਭਗਤ ਉਪਾਇਆ ਪੈਜ ਰਖਦਾ ਆਇਆ ਰਾਮ ਰਾਜੇ ॥","ref":"Ang 451 · Raag Asa · Sri Guru Ram Das Ji"},"image":{"file":"sees-sri-guru-tegh-bahadur-sahib-ji-brought-to-anandpur-fresco--18th-19th-century--unknown.jpg","credit":"Unknown artist, public domain, via Wikimedia Commons","alt":"Fresco from Gurdwara Sis Ganj Sahib, Anandpur: the Sees of Sri Guru Tegh Bahadur Sahib Ji brought to Anandpur."}},"shaheedi-divas-vadde-sahibzade-chamkaur-sahib":{"about":{"en":"Sahibzada Ajit Singh Ji and Sahibzada Jujhar Singh Ji were martyred fighting at Sri Chamkaur Sahib on 8 Poh, 1761 Bikrami.","pa":"ਸਾਹਿਬਜ਼ਾਦਾ ਅਜੀਤ ਸਿੰਘ ਜੀ ਅਤੇ ਸਾਹਿਬਜ਼ਾਦਾ ਜੁਝਾਰ ਸਿੰਘ ਜੀ ੮ ਪੋਹ, ਸੰਮਤ ੧੭੬੧ ਬਿਕ੍ਰਮੀ ਨੂੰ ਸ੍ਰੀ ਚਮਕੌਰ ਸਾਹਿਬ ਵਿਖੇ ਜੂਝਦੇ ਹੋਏ ਸ਼ਹੀਦ ਹੋਏ।"},"pankti":{"gurmukhi":"ਜਬ ਆਵ ਕੀ ਅਉਧ ਨਿਦਾਨ ਬਨੈ ਅਤਿ ਹੀ ਰਨ ਮੈ ਤਬ ਜੂਝ ਮਰੋ ॥੨੩੧॥","ref":"Sri Dasam Granth Sahib · Chandi Charitar Ukti Bilas, Savaiya 231 · Sri Guru Gobind Singh Ji"},"image":{"file":"gurdwara-katalgarh-sahib-chamkaur--2009--zenit.jpg","credit":"Zenit, CC BY-SA 3.0, via Wikimedia Commons","alt":"Gurdwara Sri Katalgarh Sahib, Sri Chamkaur Sahib, by day."}},"shaheedi-divas-bhai-sangat-singh-ji":{"about":{"en":"Bhai Sangat Singh Ji, one of the Singhs besieged with Sri Guru Gobind Singh Ji in the garhi of Sri Chamkaur Sahib, was martyred there.","pa":"ਭਾਈ ਸੰਗਤ ਸਿੰਘ ਜੀ, ਜੋ ਸ੍ਰੀ ਚਮਕੌਰ ਸਾਹਿਬ ਦੀ ਕੱਚੀ ਗੜ੍ਹੀ ਵਿੱਚ ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨਾਲ ਘਿਰੇ ਸਿੰਘਾਂ ਵਿੱਚੋਂ ਸਨ, ਉੱਥੇ ਸ਼ਹੀਦ ਹੋਏ।"},"pankti":{"gurmukhi":"ਹਰਿ ਕਾ ਸੇਵਕੁ ਸੋ ਹਰਿ ਜੇਹਾ ॥ ਭੇਦੁ ਨ ਜਾਣਹੁ ਮਾਣਸ ਦੇਹਾ ॥","ref":"Ang 1076 · Raag Maru · Sri Guru Arjan Dev Ji"},"image":{"file":"gurdwara-garhi-sahib-chamkaur--before-1930--mahan-kosh.jpg","credit":"Mahan Kosh, Bhai Kahn Singh Nabha (d. 1938); printed by F.W. & Co., Lahore · before 1930","alt":"Gurdwara Tilak Asthan (Garhi Sahib), Sri Chamkaur Sahib, the site of the kachi garhi; plate from the first edition of the Mahan Kosh. Cropped to the photograph inside the page frame."}},"shaheedi-divas-chhote-sahibzade-mata-gujri-ji":{"about":{"en":"Sahibzada Zorawar Singh Ji and Sahibzada Fateh Singh Ji were martyred at Sirhind on 13 Poh, 1761 Bikrami, on the order of Wazir Khan; Mata Gujri Ji left the world the same day.","pa":"ਸਾਹਿਬਜ਼ਾਦਾ ਜ਼ੋਰਾਵਰ ਸਿੰਘ ਜੀ ਅਤੇ ਸਾਹਿਬਜ਼ਾਦਾ ਫ਼ਤਿਹ ਸਿੰਘ ਜੀ ੧੩ ਪੋਹ, ਸੰਮਤ ੧੭੬੧ ਬਿਕ੍ਰਮੀ ਨੂੰ ਸੂਬਾ ਵਜ਼ੀਰ ਖ਼ਾਂ ਦੇ ਹੁਕਮ ਨਾਲ ਸਰਹਿੰਦ ਵਿਖੇ ਸ਼ਹੀਦ ਕੀਤੇ ਗਏ; ਉਸੇ ਦਿਨ ਮਾਤਾ ਗੁਜਰੀ ਜੀ ਵੀ ਚੜ੍ਹਾਈ ਕਰ ਗਏ।"},"pankti":{"gurmukhi":"ਇਤੁ ਮਾਰਗਿ ਪੈਰੁ ਧਰੀਜੈ ॥ ਸਿਰੁ ਦੀਜੈ ਕਾਣਿ ਨ ਕੀਜੈ ॥੨੦॥","ref":"Ang 1412 · Salok Vaaran te Vadheek · Sri Guru Nanak Dev Ji"},"images":[{"file":"gurdwara-thanda-burj-fatehgarh-sahib--2008--hari-singh.jpg","credit":"Hari Singh, CC BY-SA 2.0, via Wikimedia Commons","alt":"Gurdwara Sri Thanda Burj, Fatehgarh Sahib, standing on its red sandstone burj: the place where Mata Gujri Ji and the Chhote Sahibzade were held."},{"file":"chhote-sahibzade-at-sirhind--modern--artist-unknown.jpg","credit":"Artist unknown · from the IntrinsikhArts resources","alt":"Modern painting: the Chhote Sahibzade, Baba Zorawar Singh Ji and Baba Fateh Singh Ji, standing in the court at Sirhind."},{"file":"gurdwara-fatehgarh-sahib--early-1900s--macauliffe.jpg","credit":"Max Arthur Macauliffe, early 1900s, public domain, via Wikimedia Commons","alt":"Gurdwara Fatehgarh Sahib, Sirhind, photographed in the early 1900s."}]},"shaheedi-divas-bhai-kehar-singh-bhai-satwant-singh":{"about":{"en":"Bhai Satwant Singh and Bhai Kehar Singh were hanged in Tihar Jail, Delhi, on 6 January 1989, convicted for the killing of Indira Gandhi.","pa":"ਭਾਈ ਸਤਵੰਤ ਸਿੰਘ ਅਤੇ ਭਾਈ ਕੇਹਰ ਸਿੰਘ ਨੂੰ ਇੰਦਰਾ ਗਾਂਧੀ ਦੇ ਕਤਲ ਦੇ ਕੇਸ ਵਿੱਚ ੬ ਜਨਵਰੀ ੧੯੮੯ ਈ. ਨੂੰ ਤਿਹਾੜ ਜੇਲ੍ਹ, ਦਿੱਲੀ ਵਿੱਚ ਫਾਂਸੀ ਦਿੱਤੀ ਗਈ।"},"pankti":{"gurmukhi":"ਜੋ ਤਿਸੁ ਭਾਵੈ ਸੋਈ ਕਰਸੀ ਹੁਕਮੁ ਨ ਕਰਣਾ ਜਾਈ ॥","ref":"Ang 6 · Japji Sahib, Pauri 27 · Sri Guru Nanak Dev Ji"}},"prakash-gurpurab-sri-guru-gobind-singh-ji":{"about":{"en":"Sri Guru Gobind Singh Ji took Prakash at Sri Patna Sahib, Bihar, on Poh sudi 7, 1723 Bikrami (1666 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਨੇ ਪੋਹ ਸੁਦੀ ਸਪਤਮੀ, ਸੰਮਤ ੧੭੨੩ ਬਿਕ੍ਰਮੀ (੧੬੬੬ ਈ.) ਨੂੰ ਸ੍ਰੀ ਪਟਨਾ ਸਾਹਿਬ (ਬਿਹਾਰ) ਵਿਖੇ ਪ੍ਰਕਾਸ਼ ਧਾਰਿਆ।"},"pankti":{"gurmukhi":"ਧਰਮ ਚਲਾਵਨ ਸੰਤ ਉਬਾਰਨ ॥ ਦੁਸਟ ਸਭਨ ਕੋ ਮੂਲ ਉਪਾਰਨ ॥੪੩॥","ref":"Sri Dasam Granth Sahib · Bachittar Natak, Adhyay 6 · Sri Guru Gobind Singh Ji"},"darshan":{"label":"ਅਵਤਾਰ ਧਾਰਨ","text":"੧੭੨੩ ਬਿ: ਪੋਹ ਸੁਦੀ ਸਪਤਮੀ","page":"੨੨","source":"Gurbani Paath Darshan p.੨੨"},"images":[{"file":"guru-gobind-singh-ji--c1800--mfa-boston.jpg","credit":"Museum of Fine Arts, Boston, acc. 17.2729 (Ross-Coomaraswamy Collection) · c. 1800","alt":"Sri Guru Gobind Singh Ji on horseback, a parasol bearer behind"},{"file":"guru-gobind-singh-ji-numbered-10--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Gobind Singh Ji, numbered ੧੦ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-gobind-singh-ji-anandpuri-hazuri-bir--c1690s-1700s--unknown.jpg","credit":"Anandpuri Hazuri Bir of Sri Dasam Granth Sahib, c. 1690s–1700s, public domain, via Wikimedia Commons","alt":"Painting of Sri Guru Gobind Singh Ji from the Anandpuri Hazuri Bir codex."},{"file":"gobind-das-childhood-portrait-guru-gobind-singh-ji--c1675-1677--unknown.jpg","credit":"Unknown artist, c. 1675–1677, public domain, via Wikimedia Commons","alt":"Childhood portrait of Sri Guru Gobind Singh Ji (Gobind Das)."}]},"lohri":{"about":{"en":"Lohri is kept on the last night of Poh, the eve of Maghi. For the Sikh sangat it closes Poh, the month of the Sahibzade's shaheedi, and leads into Maghi, the day of the Chali Mukte.","pa":"ਲੋਹੜੀ ਪੋਹ ਦੀ ਆਖ਼ਰੀ ਰਾਤ, ਮਾਘੀ ਤੋਂ ਪਹਿਲਾਂ, ਮਨਾਈ ਜਾਂਦੀ ਹੈ। ਸਿੱਖ ਸੰਗਤ ਲਈ ਇਹ ਸਾਹਿਬਜ਼ਾਦਿਆਂ ਦੀ ਸ਼ਹੀਦੀ ਵਾਲੇ ਪੋਹ ਮਹੀਨੇ ਨੂੰ ਪੂਰਾ ਕਰਦੀ ਹੈ ਅਤੇ ਚਾਲ੍ਹੀ ਮੁਕਤਿਆਂ ਦੀ ਮਾਘੀ ਵੱਲ ਲੈ ਜਾਂਦੀ ਹੈ।"},"pankti":{"gurmukhi":"ਪੋਖਿ ਤੁਖਾਰੁ ਪੜੈ ਵਣੁ ਤ੍ਰਿਣੁ ਰਸੁ ਸੋਖੈ ॥","ref":"Ang 1109 · Tukhari Barah Maha · Sri Guru Nanak Dev Ji"},"image":{"file":"lohri-bonfire--2016--aasthap.jpg","credit":"Aasthap dsc, CC BY-SA 4.0, via Wikimedia Commons","alt":"A Lohri bonfire."}},"foundation-day-sri-harmandir-sahib":{"about":{"en":"Sri Guru Arjan Dev Ji had the foundation of Sri Harmandir Sahib laid at Sri Amritsar Sahib on 1 Magh, 1645 Bikrami (1588 CE).","pa":"ਸ੍ਰੀ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਨੇ ੧ ਮਾਘ, ਸੰਮਤ ੧੬੪੫ ਬਿਕ੍ਰਮੀ (੧੫੮੮ ਈ.) ਨੂੰ ਸ੍ਰੀ ਅੰਮ੍ਰਿਤਸਰ ਸਾਹਿਬ ਵਿਖੇ ਸ੍ਰੀ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੀ ਨੀਂਹ ਰਖਵਾਈ।"},"pankti":{"gurmukhi":"ਡਿਠੇ ਸਭੇ ਥਾਵ ਨਹੀ ਤੁਧੁ ਜੇਹਿਆ ॥ ਬਧੋਹੁ ਪੁਰਖਿ ਬਿਧਾਤੈ ਤਾਂ ਤੂ ਸੋਹਿਆ ॥","ref":"Ang 1362 · Phunhe · Sri Guru Arjan Dev Ji"},"images":[{"file":"harmandir-sahib--2018--bernard-gagnon.jpg","credit":"Bernard Gagnon, CC BY-SA 4.0, via Wikimedia Commons","alt":"Sri Harmandir Sahib across the sarovar at evening."},{"file":"harmandir-sahib-causeway--c1870s--william-henry-baker.jpg","credit":"William Henry Baker, c. 1870s, public domain, via Wikimedia Commons","alt":"Photograph of the causeway leading to Sri Harmandir Sahib, sangat along the railings."},{"file":"harmandir-sahib-lithograph--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (26054i), coloured lithograph · public domain","alt":"Coloured lithograph of Sri Harmandir Sahib in its sarovar, with a Gurmukhi title."}]},"jor-mela-sri-muktsar-sahib-maghi":{"about":{"en":"Maghi at Sri Muktsar Sahib remembers the Chali Mukte, who fell at Khidrane di Dhab fighting the Mughal force pursuing Sri Guru Gobind Singh Ji; Guru Ji blessed them as mukte.","pa":"ਸ੍ਰੀ ਮੁਕਤਸਰ ਸਾਹਿਬ ਦੀ ਮਾਘੀ ਚਾਲ੍ਹੀ ਮੁਕਤਿਆਂ ਦੀ ਯਾਦ ਹੈ, ਜੋ ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਦਾ ਪਿੱਛਾ ਕਰਦੀ ਮੁਗ਼ਲ ਫ਼ੌਜ ਨਾਲ ਖਿਦਰਾਣੇ ਦੀ ਢਾਬ ਉੱਤੇ ਜੂਝ ਕੇ ਸ਼ਹੀਦ ਹੋਏ; ਗੁਰੂ ਜੀ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਮੁਕਤੇ ਕਿਹਾ।"},"pankti":{"gurmukhi":"ਮਾਘਿ ਸੁਚੇ ਸੇ ਕਾਂਢੀਅਹਿ ਜਿਨ ਪੂਰਾ ਗੁਰੁ ਮਿਹਰਵਾਨੁ ॥੧੨॥","ref":"Ang 136 · Barah Maha Majh · Sri Guru Arjan Dev Ji"},"images":[{"file":"gurdwara-tutti-gandhi-sahib-muktsar--2022--wikiuser.jpg","credit":"WikiUser, CC BY-SA 4.0, via Wikimedia Commons","alt":"Gurdwara Darbar Sahib (Tuti Gandhi Sahib), Sri Muktsar Sahib, across the sarovar."},{"file":"gurdwara-darbar-sahib-muktsar--c1924--mahan-kosh.jpg","credit":"From the Mahan Kosh, c. 1923–1924, public domain, via Wikimedia Commons","alt":"Gurdwara Darbar Sahib, Sri Muktsar Sahib, photographed about 1924."}]},"chabiyan-da-morcha-amritsar":{"about":{"en":"In the Chabiyan da Morcha, the government gave up the keys of the Sri Harmandir Sahib toshakhana; they were handed to Baba Kharak Singh at Sri Akal Takht Sahib in 1922.","pa":"ਚਾਬੀਆਂ ਦੇ ਮੋਰਚੇ ਵਿੱਚ ਸਰਕਾਰ ਨੂੰ ਸ੍ਰੀ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੇ ਤੋਸ਼ਾਖ਼ਾਨੇ ਦੀਆਂ ਚਾਬੀਆਂ ਵਾਪਸ ਕਰਨੀਆਂ ਪਈਆਂ; ੧੯੨੨ ਈ. ਵਿੱਚ ਇਹ ਚਾਬੀਆਂ ਸ੍ਰੀ ਅਕਾਲ ਤਖ਼ਤ ਸਾਹਿਬ ਵਿਖੇ ਬਾਬਾ ਖੜਕ ਸਿੰਘ ਨੂੰ ਸੌਂਪੀਆਂ ਗਈਆਂ।"},"pankti":{"gurmukhi":"ਗੁਰੁ ਕੁੰਜੀ ਪਾਹੂ ਨਿਵਲੁ ਮਨੁ ਕੋਠਾ ਤਨੁ ਛਤਿ ॥ ਨਾਨਕ ਗੁਰ ਬਿਨੁ ਮਨ ਕਾ ਤਾਕੁ ਨ ਉਘੜੈ ਅਵਰ ਨ ਕੁੰਜੀ ਹਥਿ ॥੧॥","ref":"Ang 1237 · Sarang ki Vaar · Sri Guru Angad Dev Ji"},"image":{"file":"akal-takht-sahib-sangat--2020--amandeep-singh.jpg","credit":"Amandeep Singh, CC BY-SA 4.0, via Wikimedia Commons","alt":"Sri Akal Takht Sahib with the sangat gathered in front. Cropped at the foot to keep the crowd small."}},"avtar-purab-baba-deep-singh-ji":{"about":{"en":"Baba Deep Singh Ji were born at the village of Pahuwind, district Amritsar, in 1682.","pa":"ਬਾਬਾ ਦੀਪ ਸਿੰਘ ਜੀ ੧੬੮੨ ਈ. ਵਿੱਚ ਪਿੰਡ ਪਹੂਵਿੰਡ, ਜ਼ਿਲ੍ਹਾ ਅੰਮ੍ਰਿਤਸਰ ਵਿਖੇ ਪ੍ਰਗਟ ਹੋਏ।"},"pankti":{"gurmukhi":"ਧੰਨੁ ਸੁ ਕਾਗਦੁ ਕਲਮ ਧੰਨੁ ਧਨੁ ਭਾਂਡਾ ਧਨੁ ਮਸੁ ॥ ਧਨੁ ਲੇਖਾਰੀ ਨਾਨਕਾ ਜਿਨਿ ਨਾਮੁ ਲਿਖਾਇਆ ਸਚੁ ॥੧॥","ref":"Ang 1291 · Malar ki Vaar · Sri Guru Nanak Dev Ji"},"image":{"file":"baba-deep-singh-ji--19th-century--gurdwara-baba-atal-rai.jpg","credit":"Jaimal Singh Naqqash (d. 1916) and family; digitised by the Panjab Digital Library · 19th century","alt":"Baba Deep Singh Ji Shaheed, seated, khanda raised; Gurmukhi inscription ਬਾਬਾ ਦੀਪ ਸਿੰਘ ਜੀ ਸ਼ਹੀਦ above. Wall painting at Gurdwara Baba Atal Rai, Amritsar. Cropped close; the painted arch is part of the mural."}},"basant-panchami":{"about":{"en":"Basant Panchami marks the coming of spring. On this day the wedding of Sri Guru Gobind Singh Ji and Mata Jito Ji is kept at Guru ka Lahore, near Sri Anandpur Sahib.","pa":"ਬਸੰਤ ਪੰਚਮੀ ਬਸੰਤ ਰੁੱਤ ਦੀ ਆਮਦ ਦਾ ਦਿਨ ਹੈ। ਇਸ ਦਿਨ ਸ੍ਰੀ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਦੇ ਨੇੜੇ ਗੁਰੂ ਕਾ ਲਾਹੌਰ ਵਿਖੇ ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਅਤੇ ਮਾਤਾ ਜੀਤੋ ਜੀ ਦਾ ਵਿਆਹ ਪੁਰਬ ਮਨਾਇਆ ਜਾਂਦਾ ਹੈ।"},"pankti":{"gurmukhi":"ਬਸੰਤੁ ਚੜਿਆ ਫੂਲੀ ਬਨਰਾਇ ॥ ਏਹਿ ਜੀਅ ਜੰਤ ਫੂਲਹਿ ਹਰਿ ਚਿਤੁ ਲਾਇ ॥੧॥","ref":"Ang 1176 · Raag Basant · Sri Guru Amar Das Ji"},"images":[{"file":"gurdwara-guru-ka-lahore--2009--banmeet-singh.jpg","credit":"Banmeet Singh, CC BY 2.0, via Wikimedia Commons","alt":"Gurdwara Guru Ka Lahore (Basantgarh), near Sri Anandpur Sahib: the arched gate and steps. Cropped at the foot to remove the photographer's 'BR' mark."},{"file":"maharaja-ranjit-singh-ji-boat-on-ravi-at-basant--c1900--unknown.jpg","credit":"Unknown artist, late 19th or early 20th century, public domain, via Wikimedia Commons","alt":"Maharaja Ranjit Singh Ji and the court in a red boat on the Ravi at Basant."}]},"avtar-purab-sahibzada-ajit-singh-ji":{"about":{"en":"Sahibzada Ajit Singh Ji, the eldest son of Sri Guru Gobind Singh Ji, was born to Mata Sundari Ji at Paonta Sahib.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਦੇ ਵੱਡੇ ਸਾਹਿਬਜ਼ਾਦੇ, ਸਾਹਿਬਜ਼ਾਦਾ ਅਜੀਤ ਸਿੰਘ ਜੀ, ਪਾਉਂਟਾ ਸਾਹਿਬ ਵਿਖੇ ਮਾਤਾ ਸੁੰਦਰੀ ਜੀ ਦੀ ਕੁੱਖੋਂ ਪ੍ਰਗਟ ਹੋਏ।"},"pankti":{"gurmukhi":"ਪੂਤਾ ਮਾਤਾ ਕੀ ਆਸੀਸ ॥ ਨਿਮਖ ਨ ਬਿਸਰਉ ਤੁਮੑ ਕਉ ਹਰਿ ਹਰਿ ਸਦਾ ਭਜਹੁ ਜਗਦੀਸ ॥੧॥ ਰਹਾਉ ॥","ref":"Ang 496 · Raag Gujri · Sri Guru Arjan Dev Ji"},"images":[{"file":"gurdwara-paonta-sahib--2013--pinakpani.jpg","credit":"Pinakpani, CC BY-SA 4.0, via Wikimedia Commons","alt":"Gurdwara Sri Paonta Sahib, Himachal Pradesh. Cropped slightly at the right to remove a passer-by's arm."},{"file":"four-sahibzade-on-horseback-mural-baba-atal--19th-century--unknown.jpg","credit":"Mural, Gurdwara Baba Atal Rai, Amritsar, 19th century, public domain, via Wikimedia Commons","alt":"Mural of the four Sahibzade on horseback, Gurdwara Baba Atal Rai, Amritsar."},{"file":"sahibzada-ajit-singh-ji-and-sahibzada-jujhar-singh-ji-mural-hazur-sahib--19th-century--unknown.jpg","credit":"Mural, Takht Sri Hazur Sahib, 19th century, public domain, via Wikimedia Commons","alt":"Mural of Sahibzada Ajit Singh Ji and Sahibzada Jujhar Singh Ji, named in Gurmukhi above them."}]},"prakash-gurpurab-sri-guru-har-rai-ji":{"about":{"en":"Sri Guru Har Rai Ji, grandson of Sri Guru Hargobind Ji, took Prakash at Kiratpur Sahib.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਜੀ ਦੇ ਪੋਤਰੇ ਸ੍ਰੀ ਗੁਰੂ ਹਰਿ ਰਾਇ ਜੀ ਨੇ ਕੀਰਤਪੁਰ ਸਾਹਿਬ ਵਿਖੇ ਪ੍ਰਕਾਸ਼ ਧਾਰਿਆ।"},"pankti":{"gurmukhi":"ਅਰਜਨ ਹਰਿਗੋਬਿੰਦ ਨੋ ਸਿਮਰੌ ਸ੍ਰੀ ਹਰਿਰਾਇ ॥","ref":"Sri Dasam Granth Sahib · Chandi di Vaar, Pauri 1 · Sri Guru Gobind Singh Ji"},"darshan":{"label":"ਅਵਤਾਰ ਧਾਰਨ","text":"੧੬੮੭ ਬਿਕ੍ਰਮੀ ਮਾਘ ਸੁਦੀ ਚੌਦਸ","page":"੧੯","source":"Gurbani Paath Darshan p.੧੯"},"images":[{"file":"guru-har-rai-ji--c1800-1840--royal-collection--scene.jpg","credit":"Royal Collection Trust, RCIN 925208 · c. 1800–1840 · detail","alt":"Sri Guru Har Rai Ji, seated on a terrace with a rababi and an attendant; Gurmukhi name panel across the head"},{"file":"guru-har-rai-sahib-ji-numbered-7--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Har Rai Sahib Ji, numbered ੭ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-har-rai-sahib-ji-holding-flower--17th-18th-century--bidhi-chand-chhina-family.jpg","credit":"Preserved by the family of Bhai Bidhi Chand Ji Chhina, 17th or 18th century, public domain, via Wikimedia Commons","alt":"Sri Guru Har Rai Sahib Ji holding a flower; Pahari style."},{"file":"guru-har-rai-sahib-ji-receiving-devotee--c1790--nainsukh-family.jpg","credit":"Family workshop of Nainsukh of Guler, c. 1790, public domain, via Wikimedia Commons","alt":"Sri Guru Har Rai Sahib Ji standing in a garden, receiving a devotee who brings a garland."}]},"avtar-purab-bhagat-ravidas-ji":{"about":{"en":"Bhagat Ravidas Ji were born at Kashi (Banaras) in 1433 Bikrami (1376 CE); the day is kept on Magh puranmashi.","pa":"ਭਗਤ ਰਵਿਦਾਸ ਜੀ ਸੰਮਤ ੧੪੩੩ ਬਿਕ੍ਰਮੀ (੧੩੭੬ ਈ.) ਵਿੱਚ ਕਾਸ਼ੀ (ਬਨਾਰਸ) ਵਿਖੇ ਪ੍ਰਗਟ ਹੋਏ; ਇਹ ਦਿਨ ਮਾਘ ਦੀ ਪੂਰਨਮਾਸ਼ੀ ਨੂੰ ਮਨਾਇਆ ਜਾਂਦਾ ਹੈ।"},"pankti":{"gurmukhi":"ਐਸੀ ਲਾਲ ਤੁਝ ਬਿਨੁ ਕਉਨੁ ਕਰੈ ॥ ਗਰੀਬ ਨਿਵਾਜੁ ਗੁਸਈਆ ਮੇਰਾ ਮਾਥੈ ਛਤ੍ਰੁ ਧਰੈ ॥੧॥ ਰਹਾਉ ॥","ref":"Ang 1106 · Raag Maru · Bhagat Ravidas Ji"},"images":[{"file":"bhagat-ravidas-ji-and-bhagat-kabir-ji--c1715--wellcome-collection.jpg","credit":"Wellcome Collection, London (L0024542) · c. 1715","alt":"Bhagat Ravidas Ji (ਰੈਦਾਸ ਜੀ) and Bhagat Kabir Ji (ਕਬੀਰ ਜੀ) seated under a tree, each named on the page; folio of Hindi Manuscript 844."},{"file":"bhagat-ravidas-ji-meets-a-brahmin--c1780--unknown.jpg","credit":"Unknown artist, c. 1780, public domain, via Wikimedia Commons","alt":"Bhagat Ravidas Ji at work making shoes, visited by a Brahmin."},{"file":"gathering-of-holy-men-kabir-namdev-ravidas--c1770-1775--met-museum.jpg","credit":"The Metropolitan Museum of Art (2009.318), attributed to Mir Kalan Khan, c. 1770–75 · public domain","alt":"Gathering of holy men, among them Bhagat Kabir Ji, Bhagat Namdev Ji and Bhagat Ravidas Ji, before a hut."}]},"jaitu-da-morcha-faridkot":{"about":{"en":"On 21 February 1924 a shaheedi jatha of 500 Singhs, sent from Sri Akal Takht Sahib, was fired on at Jaito; the morcha had begun after an akhand path at Gurdwara Gangsar was broken off in 1923.","pa":"੨੧ ਫ਼ਰਵਰੀ ੧੯੨੪ ਈ. ਨੂੰ ਸ੍ਰੀ ਅਕਾਲ ਤਖ਼ਤ ਸਾਹਿਬ ਤੋਂ ਤੁਰੇ ੫੦੦ ਸਿੰਘਾਂ ਦੇ ਸ਼ਹੀਦੀ ਜਥੇ ਉੱਤੇ ਜੈਤੋ ਵਿਖੇ ਗੋਲੀ ਚਲਾਈ ਗਈ; ਇਹ ਮੋਰਚਾ ੧੯੨੩ ਵਿੱਚ ਗੁਰਦੁਆਰਾ ਗੰਗਸਰ ਦਾ ਅਖੰਡ ਪਾਠ ਖੰਡਤ ਕਰਨ ਪਿੱਛੋਂ ਲੱਗਾ ਸੀ।"},"pankti":{"gurmukhi":"ਧੁਰ ਕੀ ਬਾਣੀ ਆਈ ॥ ਤਿਨਿ ਸਗਲੀ ਚਿੰਤ ਮਿਟਾਈ ॥","ref":"Ang 628 · Raag Sorath · Sri Guru Arjan Dev Ji"},"images":[{"file":"gurdwara-gangsar-sahib-jaito--c1890-1910--bonhams.jpg","credit":"unknown photographer; copy from a Bonhams sale · late 19th or early 20th century","alt":"Gurdwara Gangsar Sahib, Jaito, on the edge of its sarovar. Cropped to the print."},{"file":"shaheedi-jatha-to-jaito--1924--unknown-photographer.jpg","credit":"Unknown photographer, February 1924, public domain, via Wikimedia Commons","alt":"Photograph of a Shaheedi Jatha with nishans leaving Sri Harmandir Sahib for Jaito, 1924."}]},"saka-sri-nankana-sahib":{"about":{"en":"On 21 February 1921, Bhai Lachhman Singh's jatha went to free Gurdwara Janam Asthan, Sri Nankana Sahib, from Mahant Narain Das; the Mahant's men killed many Singhs, some burnt alive.","pa":"੨੧ ਫ਼ਰਵਰੀ ੧੯੨੧ ਈ. ਨੂੰ ਭਾਈ ਲਛਮਣ ਸਿੰਘ ਦਾ ਜਥਾ ਗੁਰਦੁਆਰਾ ਜਨਮ ਅਸਥਾਨ, ਸ੍ਰੀ ਨਨਕਾਣਾ ਸਾਹਿਬ ਨੂੰ ਮਹੰਤ ਨਰਾਇਣ ਦਾਸ ਤੋਂ ਆਜ਼ਾਦ ਕਰਾਉਣ ਗਿਆ; ਮਹੰਤ ਦੇ ਬੰਦਿਆਂ ਨੇ ਬਹੁਤ ਸਾਰੇ ਸਿੰਘ ਸ਼ਹੀਦ ਕੀਤੇ, ਕਈ ਜਿਊਂਦੇ ਸਾੜੇ ਗਏ।"},"pankti":{"gurmukhi":"ਜਿਨੀ ਨਾਮੁ ਧਿਆਇਆ ਗਏ ਮਸਕਤਿ ਘਾਲਿ ॥ ਨਾਨਕ ਤੇ ਮੁਖ ਉਜਲੇ ਕੇਤੀ ਛੁਟੀ ਨਾਲਿ ॥੧॥","ref":"Ang 8 · Japji Sahib, final Salok · Sri Guru Nanak Dev Ji"},"images":[{"file":"gurdwara-janam-asthan-nankana-sahib-entrance--c1890-1910--bonhams.jpg","credit":"unknown photographer; copy from a Bonhams sale · late 19th or early 20th century","alt":"The entrance and garden walk of Gurdwara Janam Asthan, Sri Nankana Sahib. Cropped to the print."},{"file":"gurdwara-janam-asthan-nankana-sahib--1935--unknown-photographer.jpg","credit":"Unknown photographer, 1935, public domain, via Wikimedia Commons","alt":"Gurdwara Janam Asthan, Nankana Sahib, photographed in 1935."}]},"viah-purab-sri-guru-nanak-dev-ji":{"about":{"en":"Sri Guru Nanak Dev Ji were married to Mata Sulakhni Ji at Batala, where Gurdwara Kandh Sahib now stands, on Bhadon sudi 7.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦਾ ਵਿਆਹ ਭਾਦੋਂ ਸੁਦੀ ੭ ਨੂੰ ਬਟਾਲੇ ਵਿਖੇ ਮਾਤਾ ਸੁਲੱਖਣੀ ਜੀ ਨਾਲ ਹੋਇਆ, ਜਿੱਥੇ ਹੁਣ ਗੁਰਦੁਆਰਾ ਕੰਧ ਸਾਹਿਬ ਹੈ।"},"pankti":{"gurmukhi":"ਕਰਿ ਕਿਰਪਾ ਅਪਨੈ ਘਰਿ ਆਇਆ ਤਾ ਮਿਲਿ ਸਖੀਆ ਕਾਜੁ ਰਚਾਇਆ ॥","ref":"Ang 351 · Raag Asa · Sri Guru Nanak Dev Ji"},"images":[{"file":"gurdwara-kandh-sahib-batala--2014--vipsachinverma.jpg","credit":"Vipsachinverma, CC BY-SA 3.0, via Wikimedia Commons","alt":"The gateway of Gurdwara Sri Kandh Sahib, Batala, with its Gurmukhi name board."},{"file":"mehta-kalu-ji-sets-out-for-viah-of-guru-nanak-dev-ji-mural-ram-rai-darbar--19th-century--unknown.jpg","credit":"Mural, Darbar of Ram Rai, Dehradun, 19th century, public domain, via Wikimedia Commons","alt":"Janamsakhi mural: Mehta Kalu Ji setting out with the wedding party for the viah of Sri Guru Nanak Dev Ji."}]},"leaving-fort-sri-anandgarh-sahib":{"about":{"en":"On the night of 6 Poh, Sri Guru Gobind Singh Ji, the family and the Singhs left the fort of Sri Anandgarh Sahib at Sri Anandpur Sahib.","pa":"੬ ਪੋਹ ਦੀ ਰਾਤ ਨੂੰ ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਪਰਿਵਾਰ ਅਤੇ ਸਿੰਘਾਂ ਸਮੇਤ ਸ੍ਰੀ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਦਾ ਕਿਲ੍ਹਾ ਸ੍ਰੀ ਆਨੰਦਗੜ੍ਹ ਸਾਹਿਬ ਛੱਡ ਕੇ ਚੱਲ ਪਏ।"},"pankti":{"gurmukhi":"ਮਿਤ੍ਰ ਪਿਆਰੇ ਨੂੰ ਹਾਲੁ ਮੁਰੀਦਾਂ ਦਾ ਕਹਣਾ ॥","ref":"Sri Dasam Granth Sahib · Shabad Hazare Patshahi 10 (Khayal) · Sri Guru Gobind Singh Ji"},"image":{"file":"qila-anandgarh-sahib--2025--harvinder-chandigarh.jpg","credit":"Harvinder Chandigarh, CC BY 4.0, via Wikimedia Commons","alt":"Qila Anandgarh Sahib, Sri Anandpur Sahib."}},"family-separation-sarsa-nangal":{"about":{"en":"Crossing the flooded Sarsa river after leaving Sri Anandpur Sahib, the Singhs were attacked and the family of Sri Guru Gobind Singh Ji was separated.","pa":"ਸ੍ਰੀ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਛੱਡਣ ਪਿੱਛੋਂ ਹੜ੍ਹ ਵਾਲੀ ਸਰਸਾ ਨਦੀ ਕੰਢੇ ਹਮਲਾ ਹੋਇਆ ਅਤੇ ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਦਾ ਪਰਿਵਾਰ ਵਿਛੜ ਗਿਆ।"},"pankti":{"gurmukhi":"ਤੂੰ ਮੇਰਾ ਪਿਤਾ ਤੂੰਹੈ ਮੇਰਾ ਮਾਤਾ ॥ ਤੂੰ ਮੇਰਾ ਬੰਧਪੁ ਤੂੰ ਮੇਰਾ ਭ੍ਰਾਤਾ ॥","ref":"Ang 103 · Raag Majh · Sri Guru Arjan Dev Ji"},"image":{"file":"gurdwara-parivar-vichhora-sahib--2012--shemaroo.jpg","credit":"User:Shemaroo, CC BY-SA 3.0, via Wikimedia Commons","alt":"Gurdwara Sri Parivar Vichhora Sahib, on the Sarsa near Ropar. Cropped slightly at the left and foot."}},"marriage-day-sri-guru-gobind-singh-ji":{"about":{"en":"Sri Guru Gobind Singh Ji were married to Mata Jito Ji at Guru ka Lahore, near Sri Anandpur Sahib.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਦਾ ਵਿਆਹ ਸ੍ਰੀ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਦੇ ਨੇੜੇ ਗੁਰੂ ਕਾ ਲਾਹੌਰ ਵਿਖੇ ਮਾਤਾ ਜੀਤੋ ਜੀ ਨਾਲ ਹੋਇਆ।"},"pankti":{"gurmukhi":"ਧਨ ਪਿਰੁ ਏਹਿ ਨ ਆਖੀਅਨਿ ਬਹਨਿ ਇਕਠੇ ਹੋਇ ॥ ਏਕ ਜੋਤਿ ਦੁਇ ਮੂਰਤੀ ਧਨ ਪਿਰੁ ਕਹੀਐ ਸੋਇ ॥੩॥","ref":"Ang 788 · Raag Suhi · Sri Guru Amar Das Ji"},"images":[{"file":"gurdwara-guru-ka-lahore--2009--banmeet-singh.jpg","credit":"Banmeet Singh, CC BY 2.0, via Wikimedia Commons","alt":"Gurdwara Guru Ka Lahore (Basantgarh), near Sri Anandpur Sahib: the arched gate and steps. Cropped at the foot to remove the photographer's 'BR' mark."},{"file":"guru-gobind-singh-ji-on-horse--himachal-state-museum-shimla--speakingarch.jpg","credit":"Himachal State Museum, Shimla; photo SpeakingArch, CC BY-SA 4.0, via Wikimedia Commons","alt":"Miniature painting of Sri Guru Gobind Singh Ji on horseback, Himachal State Museum, Shimla."}]},"shaheedi-divas-jathedar-akali-phula-singh-ji":{"about":{"en":"Jathedar Akali Phula Singh Ji, Jathedar of Sri Akal Takht Sahib, were martyred at the battle of Naushera in 1823 and cremated at Pir Sabaq.","pa":"ਸ੍ਰੀ ਅਕਾਲ ਤਖ਼ਤ ਸਾਹਿਬ ਦੇ ਜਥੇਦਾਰ ਅਕਾਲੀ ਫੂਲਾ ਸਿੰਘ ਜੀ ੧੮੨੩ ਈ. ਵਿੱਚ ਨੌਸ਼ਹਿਰੇ ਦੀ ਜੰਗ ਵਿੱਚ ਸ਼ਹੀਦ ਹੋਏ ਅਤੇ ਪੀਰ ਸਬਾਕ ਵਿਖੇ ਉਨ੍ਹਾਂ ਦਾ ਸਸਕਾਰ ਹੋਇਆ।"},"pankti":{"gurmukhi":"ਦੇਹ ਅਨਿਤ ਨ ਨਿਤ ਰਹੈ ਜਸੁ ਨਾਵ ਚੜੈ ਭਵ ਸਾਗਰ ਤਾਰੈ ॥","ref":"Sri Dasam Granth Sahib · Krishnavatar, Savaiya 2492 · Sri Guru Gobind Singh Ji"},"images":[{"file":"akali-phula-singh-ji--c1850-1870--victoria-and-albert-museum.jpg","credit":"Victoria and Albert Museum · c. 1850–1870","alt":"Akali Phula Singh Ji, bust in an oval, bow and arrows in hand; watercolour on ivory."},{"file":"akali-phula-singh-ji-on-horseback--c1839-1846--after-colesworthey-grant.jpg","credit":"After Colesworthey Grant, lithograph, c. 1839–1846, public domain, via Wikimedia Commons","alt":"Lithograph of Akali Phula Singh Ji on horseback, armed."}]},"janam-divas-sardar-jassa-singh-ramgarhia":{"about":{"en":"Sardar Jassa Singh Ramgarhia, founder of the Ramgarhia Misl, was born on 5 May 1723.","pa":"ਰਾਮਗੜ੍ਹੀਆ ਮਿਸਲ ਦੇ ਬਾਨੀ ਸਰਦਾਰ ਜੱਸਾ ਸਿੰਘ ਰਾਮਗੜ੍ਹੀਆ ੫ ਮਈ ੧੭੨੩ ਈ. ਨੂੰ ਜਨਮੇ।"},"pankti":{"gurmukhi":"ਰਾਮਦਾਸ ਸਰੋਵਰਿ ਨਾਤੇ ॥ ਸਭਿ ਉਤਰੇ ਪਾਪ ਕਮਾਤੇ ॥","ref":"Ang 625 · Raag Sorath · Sri Guru Arjan Dev Ji"},"images":[{"file":"sardar-jassa-singh-ramgarhia--late-18th-century--unknown.jpg","credit":"unknown artist (Guler); reproduced in Chitrolekha journal · 18th century","alt":"Sardar Jassa Singh Ramgarhia seated on a chair, sword at the waist; named in Gurmukhi at the head and in English at the foot."},{"file":"s-jassa-singh-ramgarhia-with-sons--c1760-1780--purkhu-of-kangra.jpg","credit":"Purkhu of Kangra, c. 1760–1780, public domain, via Wikimedia Commons","alt":"S. Jassa Singh Ramgarhia seated with their sons; Gurmukhi inscriptions above."}]},"janam-divas-sant-jarnail-singh-khalsa-bhindranwale":{"about":{"en":"Sant Jarnail Singh Ji Khalsa Bhindranwale, chosen by Sant Kartar Singh Ji as the next head of Damdami Taksal, were born in 1947 at the village of Rode, district Moga.","pa":"ਸੰਤ ਕਰਤਾਰ ਸਿੰਘ ਜੀ ਵੱਲੋਂ ਦਮਦਮੀ ਟਕਸਾਲ ਦੇ ਅਗਲੇ ਮੁਖੀ ਥਾਪੇ ਸੰਤ ਜਰਨੈਲ ਸਿੰਘ ਜੀ ਖ਼ਾਲਸਾ ਭਿੰਡਰਾਂਵਾਲੇ ੧੯੪੭ ਈ. ਵਿੱਚ ਪਿੰਡ ਰੋਡੇ, ਜ਼ਿਲ੍ਹਾ ਮੋਗਾ ਵਿਖੇ ਜਨਮੇ।"},"pankti":{"gurmukhi":"ਸਤਿਗੁਰ ਕੀ ਬਾਣੀ ਸਤਿ ਸਤਿ ਕਰਿ ਜਾਣਹੁ ਗੁਰਸਿਖਹੁ ਹਰਿ ਕਰਤਾ ਆਪਿ ਮੁਹਹੁ ਕਢਾਏ ॥","ref":"Ang 308 · Gauri ki Vaar · Sri Guru Ram Das Ji"}},"shaheedi-divas-bhai-dayala-ji-bhai-mati-das-ji-bhai-sati-das-ji":{"about":{"en":"Bhai Mati Das Ji, Bhai Sati Das Ji and Bhai Dayala Ji, arrested with Sri Guru Tegh Bahadur Sahib Ji, were martyred at Chandni Chowk, Delhi, for refusing to give up their faith.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਤੇਗ਼ ਬਹਾਦਰ ਸਾਹਿਬ ਜੀ ਨਾਲ ਗ੍ਰਿਫ਼ਤਾਰ ਕੀਤੇ ਭਾਈ ਮਤੀ ਦਾਸ ਜੀ, ਭਾਈ ਸਤੀ ਦਾਸ ਜੀ ਅਤੇ ਭਾਈ ਦਿਆਲਾ ਜੀ ਧਰਮ ਨਾ ਛੱਡਣ ਕਰਕੇ ਦਿੱਲੀ ਦੇ ਚਾਂਦਨੀ ਚੌਕ ਵਿਖੇ ਸ਼ਹੀਦ ਕੀਤੇ ਗਏ।"},"pankti":{"gurmukhi":"ਕਬੀਰ ਜਿਸੁ ਮਰਨੇ ਤੇ ਜਗੁ ਡਰੈ ਮੇਰੇ ਮਨਿ ਆਨੰਦੁ ॥ ਮਰਨੇ ਹੀ ਤੇ ਪਾਈਐ ਪੂਰਨੁ ਪਰਮਾਨੰਦੁ ॥੨੨॥","ref":"Ang 1365 · Salok Kabir Ji · Bhagat Kabir Ji"},"images":[{"file":"gurdwara-sis-ganj-sahib-delhi-gate--2018--indrajit-das.jpg","credit":"Indrajit Das, CC BY-SA 4.0, via Wikimedia Commons","alt":"The front of Gurdwara Sis Ganj Sahib, Delhi, under its Gurmukhi, English and Hindi name board. Cropped at the right edge."},{"file":"shaheedi-guru-tegh-bahadur-sahib-ji-and-bhai-sahiban--late-19th-century--basahatullah.jpg","credit":"Basahatullah, Nabha court, late 19th century, public domain, via Wikimedia Commons","alt":"Painting of the shaheedi of Sri Guru Tegh Bahadur Sahib Ji, Bhai Mati Das Ji and Bhai Dayala Ji at Delhi."}]},"gurgaddi-divas-sri-guru-nanak-dev-ji":{"about":{"en":"Sri Guru Nanak Dev Ji were Guru from the very beginning, so their Gurgaddi is remembered with their Prakash, on Kattak sudi puranmashi.","pa":"ਸ੍ਰੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਆਦਿ ਤੋਂ ਹੀ ਗੁਰੂ ਸਰੂਪ ਪ੍ਰਗਟੇ, ਇਸ ਲਈ ਉਨ੍ਹਾਂ ਦਾ ਗੁਰਗੱਦੀ ਦਿਵਸ ਪ੍ਰਕਾਸ਼ ਪੁਰਬ ਵਾਲੇ ਦਿਨ, ਕੱਤਕ ਸੁਦੀ ਪੂਰਨਮਾਸ਼ੀ ਨੂੰ ਮਨਾਇਆ ਜਾਂਦਾ ਹੈ।"},"pankti":{"gurmukhi":"ਹਉ ਢਾਢੀ ਵੇਕਾਰੁ ਕਾਰੈ ਲਾਇਆ ॥ ਰਾਤਿ ਦਿਹੈ ਕੈ ਵਾਰ ਧੁਰਹੁ ਫੁਰਮਾਇਆ ॥","ref":"Ang 150 · Majh ki Vaar · Sri Guru Nanak Dev Ji"},"darshan":{"label":"ਗੁਰ ਗੱਦੀ","text":"ਆਦਿ ਤੋਂ ਹੀ ਗੁਰੂ ਸਰੂਪ ਪ੍ਰਗਟੇ","page":"੧੩","source":"Gurbani Paath Darshan p.੧੩"},"images":[{"file":"guru-nanak-dev-ji--c1800-1840--royal-collection--scene.jpg","credit":"Royal Collection Trust, RCIN 925202 · c. 1800–1840 · detail","alt":"Sri Guru Nanak Dev Ji, seated on a terrace with a rababi and an attendant; Gurmukhi name panel across the head"},{"file":"guru-nanak-dev-ji-numbered-1--old-painting--intrinsikharts.jpg","credit":"IntrinsikhArts","alt":"Old painting of Sri Guru Nanak Dev Ji, numbered ੧ in the IntrinsikhArts series of the ten Guru Sahiban."},{"file":"guru-nanak-dev-ji-with-holy-men--c1828-1830--rani-jindan-book.jpg","credit":"From Rani Jindan’s book, Lahore, c. 1828–1830, public domain, via Wikimedia Commons","alt":"Sri Guru Nanak Dev Ji in discussion with holy men; detail of a painting from Rani Jindan’s book, Lahore."},{"file":"homage-and-langar-before-guru-nanak-dev-ji--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (578876i), 19th century · public domain","alt":"Kings and sangat paying homage to Sri Guru Nanak Dev Ji while langar is prepared and served."},{"file":"guru-nanak-dev-ji-listening-to-music--19th-century--wellcome-collection.jpg","credit":"Wellcome Collection (27201i), 19th century · public domain","alt":"Sri Guru Nanak Dev Ji listening to a rabab player under a tree, an attendant beside them."}]},"sees-sanskar-divas-sri-guru-tegh-bahadur-sahib-ji":{"about":{"en":"Bhai Jaita Ji carried the sees of Sri Guru Tegh Bahadur Sahib Ji from Delhi to Sri Anandpur Sahib, where its sanskar was performed in 1675.","pa":"ਭਾਈ ਜੈਤਾ ਜੀ ਸ੍ਰੀ ਗੁਰੂ ਤੇਗ਼ ਬਹਾਦਰ ਸਾਹਿਬ ਜੀ ਦਾ ਸੀਸ ਦਿੱਲੀ ਤੋਂ ਸ੍ਰੀ ਅਨੰਦਪੁਰ ਸਾਹਿਬ ਲਿਆਏ, ਜਿੱਥੇ ੧੬੭੫ ਈ. ਵਿੱਚ ਸੀਸ ਦਾ ਸਸਕਾਰ ਕੀਤਾ ਗਿਆ।"},"pankti":{"gurmukhi":"ਧਰਮ ਹੇਤ ਸਾਕਾ ਜਿਨਿ ਕੀਆ ॥ ਸੀਸੁ ਦੀਆ ਪਰ ਸਿਰਰੁ ਨ ਦੀਆ ॥","ref":"Sri Dasam Granth Sahib · Bachittar Natak, Adhyay 5 · Sri Guru Gobind Singh Ji"},"image":{"file":"gurdwara-sis-ganj-sahib-anandpur--2008--mandeep-singh.jpg","credit":"Sunnyson24, public domain, via Wikimedia Commons","alt":"Gurdwara Sis Ganj Sahib, Sri Anandpur Sahib, where the sees of Sri Guru Tegh Bahadur Sahib Ji was cremated."}},"ghallughara-week-begins-sri-harmandir-sahib-fired-upon-1984":{"pankti":{"gurmukhi":"ਹਰਿ ਮੰਦਰੁ ਸੋਈ ਆਖੀਐ ਜਿਥਹੁ ਹਰਿ ਜਾਤਾ ॥","ref":"Ang 953 · Ramkali ki Vaar · Sri Guru Nanak Dev Ji"},"images":[{"file":"akal-takht-sahib-sangat--2020--amandeep-singh.jpg","credit":"Amandeep Singh, CC BY-SA 4.0, via Wikimedia Commons","alt":"Sri Akal Takht Sahib with the sangat gathered in front. Cropped at the foot to keep the crowd small."},{"file":"guru-sahiban-fresco-original-akal-takht--mid-19th-century--unknown.jpg","credit":"Fresco from the original Sri Akal Takht Sahib (lost in 1984), mid-19th century, public domain, via Wikimedia Commons","alt":"Fresco of Guru Sahiban with Bhai Mardana Ji and Bhai Bala Ji, from the Sri Akal Takht Sahib building destroyed in 1984."}]},"complex-surrounded-pilgrims-trapped-1984":{"pankti":{"gurmukhi":"ਸੰਗ ਸਖਾ ਸਭਿ ਤਜਿ ਗਏ ਕੋਊ ਨ ਨਿਬਹਿਓ ਸਾਥਿ ॥ ਕਹੁ ਨਾਨਕ ਇਹ ਬਿਪਤਿ ਮੈ ਟੇਕ ਏਕ ਰਘੁਨਾਥ ॥੫੫॥","ref":"Ang 1429 · Salok Mahalla 9 · Sri Guru Tegh Bahadur Sahib Ji"},"images":[{"file":"akal-takht-sahib--2006--amarpreet-singh.jpg","credit":"Amarpreet.singh.in at the English-language Wikipedia, CC BY-SA 3.0, via Wikimedia Commons","alt":"Sri Akal Takht Sahib, the rebuilt building, from the courtyard."},{"file":"guru-sahiban-fresco-original-akal-takht--mid-19th-century--unknown.jpg","credit":"Fresco from the original Sri Akal Takht Sahib (lost in 1984), mid-19th century, public domain, via Wikimedia Commons","alt":"Fresco of Guru Sahiban with Bhai Mardana Ji and Bhai Bala Ji, from the Sri Akal Takht Sahib building destroyed in 1984."},{"file":"harmandir-sahib--c1858--felice-beato-wellcome-collection.jpg","credit":"Felice Beato, c. 1858; Wellcome Collection (569626i) · public domain","alt":"Photograph of Sri Harmandir Sahib across the sarovar, c. 1858."}]},"main-assault-on-sri-harmandir-sahib-1984":{"pankti":{"gurmukhi":"ਕਬੀਰ ਮੁਹਿ ਮਰਨੇ ਕਾ ਚਾਉ ਹੈ ਮਰਉ ਤ ਹਰਿ ਕੈ ਦੁਆਰ ॥ ਮਤ ਹਰਿ ਪੂਛੈ ਕਉਨੁ ਹੈ ਪਰਾ ਹਮਾਰੈ ਬਾਰ ॥੬੧॥","ref":"Ang 1367 · Salok Kabir Ji · Bhagat Kabir Ji"},"images":[{"file":"akal-takht-sahib-sangat--2020--amandeep-singh.jpg","credit":"Amandeep Singh, CC BY-SA 4.0, via Wikimedia Commons","alt":"Sri Akal Takht Sahib with the sangat gathered in front. Cropped at the foot to keep the crowd small."},{"file":"guru-sahiban-fresco-original-akal-takht--mid-19th-century--unknown.jpg","credit":"Fresco from the original Sri Akal Takht Sahib (lost in 1984), mid-19th century, public domain, via Wikimedia Commons","alt":"Fresco of Guru Sahiban with Bhai Mardana Ji and Bhai Bala Ji, from the Sri Akal Takht Sahib building destroyed in 1984."}]},"sikh-reference-library-destroyed-1984":{"pankti":{"gurmukhi":"ਅਗਨਿ ਨ ਦਹੈ ਪਵਨੁ ਨਹੀ ਮਗਨੈ ਤਸਕਰੁ ਨੇਰਿ ਨ ਆਵੈ ॥ ਰਾਮ ਨਾਮ ਧਨੁ ਕਰਿ ਸੰਚਉਨੀ ਸੋ ਧਨੁ ਕਤ ਹੀ ਨ ਜਾਵੈ ॥੧॥","ref":"Ang 336 · Raag Gauri · Bhagat Kabir Ji"}},"ghallughara-week-ends-1984":{"pankti":{"gurmukhi":"ਬਲੁ ਹੋਆ ਬੰਧਨ ਛੁਟੇ ਸਭੁ ਕਿਛੁ ਹੋਤ ਉਪਾਇ ॥ ਨਾਨਕ ਸਭੁ ਕਿਛੁ ਤੁਮਰੈ ਹਾਥ ਮੈ ਤੁਮ ਹੀ ਹੋਤ ਸਹਾਇ ॥੫੪॥","ref":"Ang 1429 · Salok Mahalla 9 · Sri Guru Tegh Bahadur Sahib Ji"},"images":[{"file":"akal-takht-sahib-sangat--2020--amandeep-singh.jpg","credit":"Amandeep Singh, CC BY-SA 4.0, via Wikimedia Commons","alt":"Sri Akal Takht Sahib with the sangat gathered in front. Cropped at the foot to keep the crowd small."},{"file":"guru-sahiban-fresco-original-akal-takht--mid-19th-century--unknown.jpg","credit":"Fresco from the original Sri Akal Takht Sahib (lost in 1984), mid-19th century, public domain, via Wikimedia Commons","alt":"Fresco of Guru Sahiban with Bhai Mardana Ji and Bhai Bala Ji, from the Sri Akal Takht Sahib building destroyed in 1984."}]},"november-1984-violence-begins":{"pankti":{"gurmukhi":"ਰਾਖਹੁ ਅਪਨੀ ਸਰਣਿ ਪ੍ਰਭ ਮੋਹਿ ਕਿਰਪਾ ਧਾਰੇ ॥","ref":"Ang 809 · Raag Bilaval · Sri Guru Arjan Dev Ji"},"image":{"file":"gurdwara-rakab-ganj-sahib--2022--historiansimar.jpg","credit":"Historiansimar, CC BY-SA 4.0, via Wikimedia Commons","alt":"Gurdwara Sri Rakab Ganj Sahib, New Delhi, lit at night."}},"sikh-genocide-1984-delhi":{"pankti":{"gurmukhi":"ਏਤੀ ਮਾਰ ਪਈ ਕਰਲਾਣੇ ਤੈਂ ਕੀ ਦਰਦੁ ਨ ਆਇਆ ॥੧॥","ref":"Ang 360 · Babarvani · Raag Asa · Sri Guru Nanak Dev Ji"},"image":{"file":"gurdwara-rakab-ganj-sahib--2022--historiansimar.jpg","credit":"Historiansimar, CC BY-SA 4.0, via Wikimedia Commons","alt":"Gurdwara Sri Rakab Ganj Sahib, New Delhi, lit at night."}},"sikh-genocide-1984-second-day":{"pankti":{"gurmukhi":"ਦੁਖ ਭੰਜਨੁ ਤੇਰਾ ਨਾਮੁ ਜੀ ਦੁਖ ਭੰਜਨੁ ਤੇਰਾ ਨਾਮੁ ॥ ਆਠ ਪਹਰ ਆਰਾਧੀਐ ਪੂਰਨ ਸਤਿਗੁਰ ਗਿਆਨੁ ॥੧॥ ਰਹਾਉ ॥","ref":"Ang 218 · Raag Gauri · Sri Guru Arjan Dev Ji"},"image":{"file":"gurdwara-rakab-ganj-sahib--2022--historiansimar.jpg","credit":"Historiansimar, CC BY-SA 4.0, via Wikimedia Commons","alt":"Gurdwara Sri Rakab Ganj Sahib, New Delhi, lit at night."}},"sikh-genocide-1984-army-deployed":{"pankti":{"gurmukhi":"ਰਾਮ ਨਾਮੁ ਉਰ ਮੈ ਗਹਿਓ ਜਾ ਕੈ ਸਮ ਨਹੀ ਕੋਇ ॥ ਜਿਹ ਸਿਮਰਤ ਸੰਕਟ ਮਿਟੈ ਦਰਸੁ ਤੁਹਾਰੋ ਹੋਇ ॥੫੭॥੧॥","ref":"Ang 1429 · Salok Mahalla 9 · Sri Guru Tegh Bahadur Sahib Ji"},"image":{"file":"gurdwara-rakab-ganj-sahib--2022--historiansimar.jpg","credit":"Historiansimar, CC BY-SA 4.0, via Wikimedia Commons","alt":"Gurdwara Sri Rakab Ganj Sahib, New Delhi, lit at night."}},"sangrand-1":{"pankti":{"gurmukhi":"ਚੇਤਿ ਗੋਵਿੰਦੁ ਅਰਾਧੀਐ ਹੋਵੈ ਅਨੰਦੁ ਘਣਾ ॥","ref":"Ang 133 · Barah Maha Majh · Sri Guru Arjan Dev Ji"}},"sangrand-2":{"pankti":{"gurmukhi":"ਵੈਸਾਖਿ ਧੀਰਨਿ ਕਿਉ ਵਾਢੀਆ ਜਿਨਾ ਪ੍ਰੇਮ ਬਿਛੋਹੁ ॥","ref":"Ang 133 · Barah Maha Majh · Sri Guru Arjan Dev Ji"}},"sangrand-3":{"pankti":{"gurmukhi":"ਹਰਿ ਜੇਠਿ ਜੁੜੰਦਾ ਲੋੜੀਐ ਜਿਸੁ ਅਗੈ ਸਭਿ ਨਿਵੰਨਿ ॥","ref":"Ang 134 · Barah Maha Majh · Sri Guru Arjan Dev Ji"}},"sangrand-4":{"pankti":{"gurmukhi":"ਆਸਾੜੁ ਤਪੰਦਾ ਤਿਸੁ ਲਗੈ ਹਰਿ ਨਾਹੁ ਨ ਜਿੰਨਾ ਪਾਸਿ ॥","ref":"Ang 134 · Barah Maha Majh · Sri Guru Arjan Dev Ji"}},"sangrand-5":{"pankti":{"gurmukhi":"ਸਾਵਣਿ ਸਰਸੀ ਕਾਮਣੀ ਚਰਨ ਕਮਲ ਸਿਉ ਪਿਆਰੁ ॥","ref":"Ang 134 · Barah Maha Majh · Sri Guru Arjan Dev Ji"}},"sangrand-6":{"pankti":{"gurmukhi":"ਭਾਦੁਇ ਭਰਮਿ ਭੁਲਾਣੀਆ ਦੂਜੈ ਲਗਾ ਹੇਤੁ ॥","ref":"Ang 134 · Barah Maha Majh · Sri Guru Arjan Dev Ji"}},"sangrand-7":{"pankti":{"gurmukhi":"ਅਸੁਨਿ ਪ੍ਰੇਮ ਉਮਾਹੜਾ ਕਿਉ ਮਿਲੀਐ ਹਰਿ ਜਾਇ ॥","ref":"Ang 134 · Barah Maha Majh · Sri Guru Arjan Dev Ji"}},"sangrand-8":{"pankti":{"gurmukhi":"ਕਤਿਕਿ ਕਰਮ ਕਮਾਵਣੇ ਦੋਸੁ ਨ ਕਾਹੂ ਜੋਗੁ ॥","ref":"Ang 135 · Barah Maha Majh · Sri Guru Arjan Dev Ji"}},"sangrand-9":{"pankti":{"gurmukhi":"ਮੰਘਿਰਿ ਮਾਹਿ ਸੋਹੰਦੀਆ ਹਰਿ ਪਿਰ ਸੰਗਿ ਬੈਠੜੀਆਹ ॥","ref":"Ang 135 · Barah Maha Majh · Sri Guru Arjan Dev Ji"}},"sangrand-10":{"pankti":{"gurmukhi":"ਪੋਖਿ ਤੁਖਾਰੁ ਨ ਵਿਆਪਈ ਕੰਠਿ ਮਿਲਿਆ ਹਰਿ ਨਾਹੁ ॥","ref":"Ang 135 · Barah Maha Majh · Sri Guru Arjan Dev Ji"}},"sangrand-11":{"pankti":{"gurmukhi":"ਮਾਘਿ ਮਜਨੁ ਸੰਗਿ ਸਾਧੂਆ ਧੂੜੀ ਕਰਿ ਇਸਨਾਨੁ ॥","ref":"Ang 135 · Barah Maha Majh · Sri Guru Arjan Dev Ji"}},"sangrand-12":{"pankti":{"gurmukhi":"ਫਲਗੁਣਿ ਅਨੰਦ ਉਪਾਰਜਨਾ ਹਰਿ ਸਜਣ ਪ੍ਰਗਟੇ ਆਇ ॥","ref":"Ang 136 · Barah Maha Majh · Sri Guru Arjan Dev Ji"}},"masya":{"pankti":{"gurmukhi":"ਅੰਮਾਵਸ ਮਹਿ ਆਸ ਨਿਵਾਰਹੁ ॥ ਅੰਤਰਜਾਮੀ ਰਾਮੁ ਸਮਾਰਹੁ ॥","ref":"Ang 343 · Gauri Thiti · Bhagat Kabir Ji"}},"puranmashi":{"pankti":{"gurmukhi":"ਪੂਨਿਉ ਪੂਰਾ ਚੰਦ ਅਕਾਸ ॥ ਪਸਰਹਿ ਕਲਾ ਸਹਜ ਪਰਗਾਸ ॥","ref":"Ang 344 · Gauri Thiti · Bhagat Kabir Ji"}},"nanakshahi-new-year":{"pankti":{"gurmukhi":"ਚੇਤੁ ਬਸੰਤੁ ਭਲਾ ਭਵਰ ਸੁਹਾਵੜੇ ॥ ਬਨ ਫੂਲੇ ਮੰਝ ਬਾਰਿ ਮੈ ਪਿਰੁ ਘਰਿ ਬਾਹੁੜੈ ॥","ref":"Ang 1107–1108 · Tukhari Barah Maha · Sri Guru Nanak Dev Ji"}},"avtar-purab-bhai-daya-singh-ji":{"about":{"pa":"ਭਾਈ ਦਯਾ ਸਿੰਘ ਜੀ, ਪੰਜਾਂ ਪਿਆਰਿਆਂ ਵਿੱਚੋਂ ਪਹਿਲੇ, ਦਾ ਜਨਮ ੧ ਫੱਗਣ (ਫੱਗਣ ਦੀ ਸੰਗਰਾਂਦ), ਸੰਮਤ ੧੭੨੫ ਬਿਕ੍ਰਮੀ ਨੂੰ ਲਾਹੌਰ ਵਿਖੇ ਪਿਤਾ ਮਈਆ ਰਾਮ ਜੀ ਅਤੇ ਮਾਤਾ ਸੋਭਾ ਦੇਈ ਜੀ ਦੇ ਘਰ ਹੋਇਆ। ੧੩ ਸਾਲ ਦੀ ਉਮਰ ਵਿੱਚ ਉਹ ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਦੀ ਸ਼ਰਨ ਆਏ।","en":"Bhai Daya Singh Ji, the first of the Panj Pyare, was born in Lahore on 1 Phagun (the Phagun sangrand), 1725 Bikrami, to Mayia Ram Ji and Mata Sobha Dei Ji. They came into the sharan of Sri Guru Gobind Singh Ji at the age of 13."},"pankti":{"gurmukhi":"ਸੀਸੁ ਵਢੇ ਕਰਿ ਬੈਸਣੁ ਦੀਜੈ ਵਿਣੁ ਸਿਰ ਸੇਵ ਕਰੀਜੈ ॥","ref":"Ang 558 · Raag Vadhans · Sri Guru Nanak Dev Ji"},"darshan":{"label":"ਜਨਮ","text":"੧੭੨੫ ਬਿਕਰਮੀ, ਫਗਣ ਦੀ ਸੰਕ੍ਰਾਂਤ","page":"੨੩","source":"Gurbani Paath Darshan p.੨੩"},"images":[{"file":"takht-sri-kesgarh-sahib--2022--historiansimar.jpg","credit":"Historiansimar, CC BY-SA 4.0, via Wikimedia Commons","alt":"Takht Sri Kesgarh Sahib, Sri Anandpur Sahib."},{"file":"guru-gobind-singh-ji-with-panj-pyare-mural-kot-fateh-khan--19th-century--unknown.jpg","credit":"Samadhi mural, Kot Fateh Khan, 19th century; photo
