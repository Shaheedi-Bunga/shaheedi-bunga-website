<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- the site loads everything from itself and sends nothing anywhere (see /privacy/); this says so to the browser.
     Inline script and style stay allowed: every page carries its own. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
{{robots}}<title>{{title}} · Shaheedi Bunga</title>
{{meta}}<link rel="icon" href="/Assets/Brand/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/Assets/Brand/apple-touch-icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/lib/fonts.css">
<link rel="stylesheet" href="kit.css">
<!-- before paint: light unless this viewer chose dark (or ?mood= asks), so
     there is never a flash of the wrong mode -->
<script>(function(){var m=(/[?&]mood=(light|dark)/.exec(location.search)||[])[1];
  if(!m){try{m=localStorage.getItem("sb-mood");}catch(e){}}
  document.documentElement.dataset.mood=m==="dark"?"dark":"light";})();</script>
